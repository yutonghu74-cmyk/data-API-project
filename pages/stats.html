<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用统计 — 数据平台</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
</head>
<body>
<!-- 面包屑 -->
<div class="breadcrumb">
  <span class="brand">数据平台</span>
  <span class="sep">›</span>
  <a href="#">三方API管理</a>
  <span class="sep">›</span>
  <span class="current">使用统计</span>
  <div class="breadcrumb-right" id="userBar"></div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-group open" id="sg1">
      <div class="sidebar-group-title" onclick="document.getElementById('sg1').classList.toggle('open')">
        三方API管理 <span class="arrow">›</span>
      </div>
      <div class="sidebar-children">
        <a href="claude.html" class="sidebar-item">API调用</a>
        <a href="apply.html"   class="sidebar-item">API申请&审核</a>
        <a href="keys.html"    class="sidebar-item">密钥管理</a>
        <a href="stats.html"   class="sidebar-item active">使用统计</a>
        <a href="users.html"   class="sidebar-item" id="usersLink" style="display:none">用户管理</a>
      </div>
    </div>
  </div>

  <div class="main">
    <p class="page-title">使用统计</p>

    <!-- 已授权 API 列表 -->
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>账号名称</th><th>供应商</th><th>创建时间</th><th>更新时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="statsTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { requireLogin, getUser, authHeaders, logout } from '../assets/js/auth.js';
if (!requireLogin()) throw new Error('redirect');

const user = getUser();
document.getElementById('userBar').innerHTML = `
  <span class="username">${user.username}</span>
  <button class="logout" id="logoutBtn">退出</button>`;
document.getElementById('logoutBtn').addEventListener('click', () => logout());
if (user.role === 'admin') { const l = document.getElementById('usersLink'); if (l) l.style.display = 'block'; }

async function loadStats() {
  const tbody = document.getElementById('statsTbody');
  try {
    const res = await fetch('http://localhost:8000/api-requests/approved', { headers: authHeaders() });
    const list = await res.json();
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:32px">暂无已授权的 API，请先提交申请</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(c => `<tr>
      <td><strong>${c.name}</strong></td>
      <td>${c.provider}</td>
      <td>${c.created_at ? c.created_at.slice(0,10) : '—'}</td>
      <td>${c.updated_at ? c.updated_at.slice(0,10) : '—'}</td>
      <td><a href="stats-detail.html?config_id=${c.id}" class="btn-link">查看统计</a></td>
    </tr>`).join('');
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#dc2626;padding:32px">加载失败</td></tr>';
  }
}

loadStats();
</script>
</body>
</html>
