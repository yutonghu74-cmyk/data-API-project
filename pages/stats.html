<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用统计 — 数据平台</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
  <style>
    .stat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .stat-card .val { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-top: 4px; }
    .stat-card .lbl { font-size: .8rem; color: var(--text-muted); }

    .detail-row { background: var(--surface); }
    .detail-wrap { padding: 16px 24px; display: none; }
    .detail-wrap.open { display: block; }

    .chart-svg { width: 100%; height: 80px; }
    .chart-label { display: flex; justify-content: space-between; font-size: .7rem; color: var(--text-muted); margin-top: 4px; }

    .expand-btn { cursor: pointer; color: var(--green); font-size: .85rem; background: none; border: none; padding: 0; }
    .expand-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="breadcrumb">
  <button class="sidebar-toggle" id="sidebarToggle">☰</button><span class="brand">数据平台</span>
  <span class="sep">›</span>
  <a href="#">三方API管理</a>
  <span class="sep">›</span>
  <span class="current">使用统计</span>
  <div class="breadcrumb-right" id="userBar"></div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-group open" id="sg1">
      <div class="sidebar-group-title" onclick="document.getElementById('sg1').classList.toggle('open')">
        三方API管理 <span class="arrow">›</span>
      </div>
      <div class="sidebar-children">
        <a href="claude.html" class="sidebar-item">API调用</a>
        <a href="apply.html"  class="sidebar-item">API申请&审核</a>
        <a href="keys.html"   class="sidebar-item" id="keysLink" style="display:none">密钥管理</a>
        <a href="stats.html"  class="sidebar-item active">使用统计</a>
        <a href="users.html"  class="sidebar-item" id="usersLink" style="display:none">用户管理</a>
      </div>
    </div>
  </div>

  <div class="main">
    <p class="page-title">使用统计</p>

    <!-- 汇总卡片（管理员可见） -->
    <div class="stat-cards" id="summaryCards" style="display:none"></div>

    <!-- 按 API 统计 -->
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:20px">
      <div class="table-wrap">
        <table id="statsTable">
          <thead>
            <tr><th>API名称</th><th>供应商</th><th>总调用</th><th>成功率</th><th>Input Token</th><th>Output Token</th><th>总费用(元)</th><th>平均耗时</th><th>最后使用</th><th>操作</th></tr>
          </thead>
          <tbody id="statsTbody"></tbody>
        </table>
      </div>
    </div>

    <!-- 按用户分组（管理员可见） -->
    <div id="userStatsSection" style="display:none">
      <p style="font-size:.9rem;font-weight:600;margin-bottom:12px;color:var(--text)">按用户统计</p>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>用户</th><th>调用次数</th><th>Input Token</th><th>Output Token</th><th>总Token</th><th>总费用(元)</th><th>成功次数</th><th>最后使用</th></tr>
            </thead>
            <tbody id="userStatsTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initSidebar } from '../assets/js/sidebar.js';
import { requireLogin, getUser, refreshUser, authHeaders, logout } from '../assets/js/auth.js';
if (!requireLogin()) throw new Error('redirect');
initSidebar();

const user    = await refreshUser();
const isAdmin = user.role === 'admin';
const ADMIN_HEADERS = { 'Content-Type': 'application/json', 'X-Admin-Password': 'admin123' };

document.getElementById('userBar').innerHTML = `
  <span class="username">${user.username}${isAdmin ? '（管理员）' : ''}</span>
  <button class="logout" id="logoutBtn">退出</button>`;
document.getElementById('logoutBtn').addEventListener('click', () => logout());
if (isAdmin) { const l = document.getElementById('usersLink'); if (l) l.style.display = 'block'; const k = document.getElementById('keysLink'); if (k) k.style.display = 'block'; }

async function loadStats() {
  const tbody = document.getElementById('statsTbody');
  let statsList = [];

  try {
    if (isAdmin) {
      // 管理员：调用 /admin/stats 获取所有配置统计
      const res = await fetch('http://localhost:8000/admin/stats', { headers: ADMIN_HEADERS });
      statsList = await res.json().catch(() => []);

      // 汇总卡片
      if (statsList.length) {
        const total   = statsList.reduce((s, r) => s + r.total_calls, 0);
        const tokens  = statsList.reduce((s, r) => s + r.total_tokens, 0);
        const cost    = statsList.reduce((s, r) => s + (r.total_cost || 0), 0);
        const okRate  = statsList.reduce((s, r) => s + r.success_rate, 0) / statsList.length;
        const avgMs   = statsList.reduce((s, r) => s + r.avg_duration_ms, 0) / statsList.length;
        document.getElementById('summaryCards').style.display = 'grid';
        document.getElementById('summaryCards').innerHTML = `
          <div class="stat-card"><div class="lbl">总调用次数</div><div class="val">${total.toLocaleString()}</div></div>
          <div class="stat-card"><div class="lbl">平均成功率</div><div class="val">${okRate.toFixed(1)}%</div></div>
          <div class="stat-card"><div class="lbl">累计 Token</div><div class="val">${tokens.toLocaleString()}</div></div>
          <div class="stat-card"><div class="lbl">总费用</div><div class="val">¥${cost.toFixed(4)}</div></div>
          <div class="stat-card"><div class="lbl">平均耗时</div><div class="val">${avgMs.toFixed(0)} ms</div></div>`;

        // 加载按用户分组数据
        loadUserStats();
      }
    } else {
      // 普通用户：只看自己已授权的配置统计
      const res = await fetch('http://localhost:8000/api-requests/approved', { headers: authHeaders() });
      const approved = await res.json().catch(() => []);
      // 暂无用户级别调用统计端点，展示已授权列表基本信息
      statsList = approved.map(c => ({
        config_id: c.id,
        name: c.name,
        provider: c.provider,
        total_calls: '—',
        success_rate: '—',
        total_tokens: '—',
        avg_duration_ms: '—',
        last_used: '—',
      }));
    }
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#dc2626;padding:32px">加载失败</td></tr>';
    return;
  }

  if (!statsList.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:32px">暂无统计数据</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  statsList.forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${s.name}</strong></td>
      <td>${s.provider}</td>
      <td>${typeof s.total_calls === 'number' ? s.total_calls.toLocaleString() : s.total_calls}</td>
      <td>${typeof s.success_rate === 'number' ? s.success_rate + '%' : s.success_rate}</td>
      <td>${typeof s.input_tokens  === 'number' ? s.input_tokens.toLocaleString()  : '—'}</td>
      <td>${typeof s.output_tokens === 'number' ? s.output_tokens.toLocaleString() : '—'}</td>
      <td>¥${typeof s.total_cost === 'number' ? s.total_cost.toFixed(4) : '—'}</td>
      <td>${typeof s.avg_duration_ms === 'number' ? s.avg_duration_ms + ' ms' : s.avg_duration_ms}</td>
      <td style="font-size:.82rem;color:var(--text-muted)">${s.last_used !== '—' ? s.last_used.slice(0,16).replace('T',' ') : '—'}</td>
      <td><button class="expand-btn" data-cid="${s.config_id}">趋势 ▾</button></td>`;
    tbody.appendChild(tr);

    // 展开详情行
    const detailTr = document.createElement('tr');
    detailTr.className = 'detail-row';
    detailTr.innerHTML = `<td colspan="8"><div class="detail-wrap" id="detail-${s.config_id}">
      <div style="font-size:.82rem;color:var(--text-muted);margin-bottom:8px">近 7 天调用趋势</div>
      <svg class="chart-svg" id="svg-${s.config_id}" viewBox="0 0 400 80" preserveAspectRatio="none"></svg>
      <div class="chart-label" id="label-${s.config_id}"></div>
    </div></td>`;
    tbody.appendChild(detailTr);
  });

  // 展开按钮事件
  tbody.querySelectorAll('.expand-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleDetail(btn.dataset.cid, btn));
  });
}

async function loadUserStats() {
  if (!isAdmin) return;
  document.getElementById('userStatsSection').style.display = 'block';
  const tbody = document.getElementById('userStatsTbody');
  try {
    const res = await fetch('http://localhost:8000/admin/stats/by-user', { headers: ADMIN_HEADERS });
    const list = await res.json().catch(() => []);
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:24px">暂无数据</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(u => `<tr>
      <td><strong>${u.username}</strong></td>
      <td>${u.total_calls.toLocaleString()}</td>
      <td>${(u.input_tokens||0).toLocaleString()}</td>
      <td>${(u.output_tokens||0).toLocaleString()}</td>
      <td>${(u.total_tokens||0).toLocaleString()}</td>
      <td>¥${(u.total_cost||0).toFixed(4)}</td>
      <td>${u.success_count||0}</td>
      <td style="font-size:.82rem;color:var(--text-muted)">${u.last_used ? u.last_used.slice(0,16).replace('T',' ') : '—'}</td>
    </tr>`).join('');
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#dc2626;padding:24px">加载失败</td></tr>';
  }
}

async function toggleDetail(configId, btn) {
  const wrap = document.getElementById('detail-' + configId);
  if (wrap.classList.contains('open')) {
    wrap.classList.remove('open');
    btn.textContent = '查看趋势 ▾';
    return;
  }
  wrap.classList.add('open');
  btn.textContent = '收起 ▴';

  // 加载趋势数据（仅管理员有此端点）
  if (!isAdmin) return;
  try {
    const res = await fetch(`http://localhost:8000/admin/stats/${configId}/daily`, { headers: ADMIN_HEADERS });
    const data = await res.json().catch(() => []);
    drawChart(configId, data);
  } catch(e) {}
}

function drawChart(configId, data) {
  const svg   = document.getElementById('svg-' + configId);
  const label = document.getElementById('label-' + configId);
  const days  = getLast7Days();
  const map   = Object.fromEntries(data.map(d => [d.day, d.count]));
  const vals  = days.map(d => map[d] || 0);
  const max   = Math.max(...vals, 1);
  const W = 400, H = 80, pad = 10;
  const xs = days.map((_, i) => pad + i * ((W - pad * 2) / 6));
  const ys = vals.map(v => H - pad - (v / max) * (H - pad * 2));
  const pts = xs.map((x, i) => `${x},${ys[i]}`).join(' ');
  svg.innerHTML = `
    <polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round"/>
    ${xs.map((x,i) => `<circle cx="${x}" cy="${ys[i]}" r="3" fill="var(--green)"/>`).join('')}`;
  label.innerHTML = days.map(d => `<span>${d.slice(5)}</span>`).join('');
}

function getLast7Days() {
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - 6 + i);
    return d.toISOString().slice(0, 10);
  });
}

loadStats();
</script>
</body>
</html>
