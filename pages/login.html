<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 数据平台</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--surface); }
    .login-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 44px;
      width: 380px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }
    .login-box h1 { font-size: 1.3rem; margin-bottom: 4px; }
    .login-box .sub { font-size: .85rem; color: var(--text-muted); margin-bottom: 28px; }
    .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 8px 20px; font-size: .9rem; cursor: pointer;
      border: none; background: none; color: var(--text-muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 500; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .error-msg { color: #dc2626; font-size: .83rem; margin-top: 10px; min-height: 18px; }
    .success-msg { color: var(--green); font-size: .83rem; margin-top: 10px; min-height: 18px; }
    .btn-primary { width: 100%; justify-content: center; padding: 10px; font-size: .95rem; margin-top: 4px; }
  </style>
</head>
<body>
<div class="login-box">
  <h1>数据平台</h1>
  <p class="sub">三方 API 管理系统</p>

  <div class="tabs">
    <button class="tab active" data-tab="login">登录</button>
    <button class="tab" data-tab="register">注册</button>
  </div>

  <!-- 登录 -->
  <div class="tab-panel active" id="tab-login">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="loginPwd" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn">登录</button>
    <p class="error-msg" id="loginErr"></p>
  </div>

  <!-- 注册 -->
  <div class="tab-panel" id="tab-register">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="regUser" placeholder="请设置用户名">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="regPwd" placeholder="请设置密码（至少6位）">
    </div>
    <div class="form-group">
      <label>确认密码</label>
      <input type="password" id="regPwd2" placeholder="请再次输入密码">
    </div>
    <button class="btn btn-primary" id="registerBtn">注册</button>
    <p class="error-msg" id="registerErr"></p>
    <p class="success-msg" id="registerOk"></p>
  </div>
</div>

<script type="module">
import { login, register, isLoggedIn } from '../assets/js/auth.js';

if (isLoggedIn()) {
  const u = (await import('../assets/js/auth.js')).getUser();
  window.location.href = u?.role === 'admin' ? '/pages/admin-new.html' : '/pages/claude.html';
}

// tab 切换
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-' + t.dataset.tab).classList.add('active');
  });
});

// 登录
document.getElementById('loginBtn').addEventListener('click', async () => {
  const err = document.getElementById('loginErr');
  err.textContent = '';
  try {
    const data = await login(
      document.getElementById('loginUser').value.trim(),
      document.getElementById('loginPwd').value
    );
    window.location.href = data.user.role === 'admin' ? '/pages/admin-new.html' : '/pages/claude.html';
  } catch (e) { err.textContent = e.message; }
});

document.getElementById('loginPwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

// 注册
document.getElementById('registerBtn').addEventListener('click', async () => {
  const err = document.getElementById('registerErr');
  const ok  = document.getElementById('registerOk');
  err.textContent = ''; ok.textContent = '';
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPwd').value;
  const p2 = document.getElementById('regPwd2').value;
  if (!u) { err.textContent = '请输入用户名'; return; }
  if (p.length < 6) { err.textContent = '密码至少6位'; return; }
  if (p !== p2) { err.textContent = '两次密码不一致'; return; }
  try {
    await register(u, p);
    ok.textContent = '注册成功，请登录';
    document.querySelector('.tab[data-tab="login"]').click();
  } catch (e) { err.textContent = e.message; }
});
</script>
</body>
</html>
