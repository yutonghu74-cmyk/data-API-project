<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API调用 — 数据平台</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
  <style>
    /* ── Tab 导航 ── */
    .sub-tabs { display:flex; border-bottom:1px solid var(--border); margin-top:-10px; margin-bottom:0; background:#fff; }
    .sub-tab { padding:10px 22px; font-size:.9rem; cursor:pointer; border:none; background:none; color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s; }
    .sub-tab:hover { color:var(--text); }
    .sub-tab.active { color:var(--green); border-bottom-color:var(--green); font-weight:500; }
    .sub-panel { display:none; }
    .sub-panel.active { display:flex; flex-direction:column; }

    /* ── 在线使用主布局（左历史 + 右聊天）── */
    .chat-layout {
      display: flex;
      height: calc(100vh - 148px);
    }

    /* ── 左侧历史会话栏 ── */
    .session-sidebar {
      width: 220px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      background: #fafafa;
    }
    .session-sidebar-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .new-chat-btn {
      width: 100%; padding: 7px 0; font-size: .85rem;
      background: var(--green); color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-weight: 500;
    }
    .new-chat-btn:hover { background: var(--green-hover); }
    .session-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    .session-item {
      padding: 8px 10px 8px 12px; cursor: pointer; font-size: .82rem;
      color: var(--text); border-radius: 0; transition: background .12s;
      display: flex; align-items: flex-start; gap: 4px; position: relative;
    }
    .session-item:hover { background: var(--border); }
    .session-item.active { background: var(--green-bg); color: var(--green); font-weight: 500; }
    .session-item-body { flex: 1; min-width: 0; }
    .session-item-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .session-item-meta { font-size:.72rem; color:var(--text-muted); margin-top:2px; }
    .session-pin-icon { font-size:.7rem; color:var(--green); flex-shrink:0; margin-top:2px; }
    .session-more-btn {
      display: none; flex-shrink: 0; align-self: flex-start;
      background: none; border: none; padding: 2px 5px; cursor: pointer;
      color: var(--text-muted); border-radius: 3px; font-size: 1rem; line-height: 1;
    }
    .session-item:hover .session-more-btn,
    .session-item.menu-open .session-more-btn { display: block; }
    .session-more-btn:hover { background: rgba(0,0,0,.08); }

    /* 下拉菜单 */
    .session-menu {
      display: none; position: fixed; z-index: 500;
      background: #fff; border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
      min-width: 120px; padding: 4px 0;
    }
    .session-menu.open { display: block; }
    .session-menu-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; font-size: .83rem; cursor: pointer;
      color: var(--text); white-space: nowrap;
    }
    .session-menu-item:hover { background: var(--surface); }
    .session-menu-item.danger { color: #dc2626; }
    .session-menu-item.danger:hover { background: #fee2e2; }

    /* ── 拖拽手柄 ── */
    .resize-handle {
      width: 4px; cursor: col-resize; background: transparent;
      flex-shrink: 0; position: relative; z-index: 10;
      transition: background .15s;
    }
    .resize-handle:hover, .resize-handle.active { background: var(--green); }

    /* ── 右侧聊天区 ── */
    .chat-main {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
    }
    .config-bar {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .config-bar .form-group { margin: 0; }
    .messages {
      flex: 1; overflow-y: auto; padding: 20px 24px;
      display: flex; flex-direction: column; gap: 16px;
      background: #fff;
      align-items: center;
    }
    .messages > * {
      width: 100%; max-width: 900px;
    }
    .bubble {
      max-width: 100%; padding: 10px 14px; border-radius: 14px;
      font-size: .92rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    }
    .bubble-user { background: rgb(242,242,242); color: var(--text); align-self: flex-end; border-bottom-right-radius: 4px; margin-left: auto; }
    .bubble-assistant { background: #fff; border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; margin-right: auto; }
    .bubble-error { background: #fee2e2; border:1px solid #fecaca; color:#dc2626; align-self:flex-start; border-radius:var(--radius); font-size:.85rem; }
    .retry-btn { margin-top:6px; padding:3px 10px; font-size:.78rem; background:#fff; border:1px solid #fecaca; color:#dc2626; border-radius:4px; cursor:pointer; }
    .retry-btn:hover { background:#fee2e2; }
    .bubble-model-tag { font-size:.72rem; color:var(--text-muted); margin-top:4px; align-self:flex-start; padding-left:2px; }
    .cursor::after { content:'▋'; animation:blink .7s step-end infinite; }
    @keyframes blink { 50% { opacity:0; } }

    /* ── 气泡内 Markdown 渲染 ── */
    .bubble img { max-height: 200px; max-width: 100%; border-radius: 6px; cursor: zoom-in; display: block; margin: 4px 0; }
    .bubble p { margin: 0 0 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
    .bubble li { margin: 2px 0; }
    .bubble pre { background:#1e1e1e; color:#e6e6e6; padding:10px 12px; border-radius:6px; overflow-x:auto; font-size:.82rem; line-height:1.5; margin:6px 0; }
    .bubble pre code { background:none; padding:0; color:inherit; font-family:Consolas,Monaco,monospace; }
    .bubble code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 3px; font-family: Consolas,Monaco,monospace; font-size: .88em; }
    .bubble-user code { background: rgba(255,255,255,.18); }
    .bubble table { border-collapse: collapse; margin: 6px 0; font-size: .85rem; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
    .bubble th { background: var(--surface); font-weight: 600; }
    .bubble blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--border); color: var(--text-muted); }
    .bubble a { color: var(--green); text-decoration: underline; }
    .bubble-user a { color: #fff; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 10px 0 6px; font-weight: 600; }
    .bubble h1 { font-size: 1.15rem; } .bubble h2 { font-size: 1.08rem; }
    .bubble h3 { font-size: 1rem; } .bubble h4 { font-size: .95rem; }

    /* ── 图片缩略图 ── */
    .thumb-wrap {
      position: relative; display: inline-block;
      width: 64px; height: 64px; border-radius: 6px;
      overflow: hidden; border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .thumb-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
    .thumb-wrap .thumb-del {
      position:absolute; top:2px; right:2px;
      width:18px; height:18px; border-radius:50%;
      background:rgba(0,0,0,.5); color:#fff;
      font-size:11px; line-height:18px; text-align:center;
      cursor:pointer; border:none; padding:0;
    }
    .attachment-tag {
      display:flex; align-items:center; gap:5px;
      background:#fff; border:1px solid var(--border);
      border-radius:6px; padding:3px 8px; font-size:.8rem;
    }
    .attachment-tag button { background:none; color:var(--text-muted); padding:0 2px; font-size:.85rem; }
    .attachment-tag button:hover { color:#dc2626; }

    /* ── 输入区 ── */
    .input-area { padding: 10px 16px; border-top: 1px solid var(--border); background: #fff; display:flex; flex-direction:column; align-items:center; }
    .attachments-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; width:100%; max-width:900px; }
    .input-row { display:flex; gap:8px; align-items:flex-end; width:100%; max-width:900px; }
    .input-row textarea { flex:1; resize:none; height:44px; line-height:1.5; font-family:var(--font); }

    .empty-hint { color:var(--text-muted); font-size:.85rem; text-align:center; margin:auto; }
    .no-api-hint { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--text-muted); }
    .no-api-hint a { color:var(--green); }
    .drag-over { outline: 2px dashed var(--green); outline-offset: -4px; }


    /* 安全提示悬浮条（与顶栏平行，居中，不撑满宽度） */
    .security-banner {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 5px 14px 5px 12px; font-size: .82rem; color: #92400e;
      position: fixed;
      top: calc((var(--header-h) - 30px) / 2);
      left: 50%; transform: translateX(-20%);
      z-index: 110; white-space: nowrap;
    }
    .security-banner .icon { font-size: .9rem; flex-shrink: 0; }

    /* 图片放大灯箱 */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.85); align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 6px; object-fit: contain; }
  </style>

  <!-- 图片放大灯箱 -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="">
  </div>

  <!-- 全局会话操作下拉菜单（单例） -->
  <div class="session-menu" id="sessionMenu">
    <div class="session-menu-item" id="menuPin">📌 置顶</div>
    <div class="session-menu-item" id="menuRename">✏️ 重命名</div>
    <div class="session-menu-item danger" id="menuDelete">🗑️ 删除</div>
  </div>
  <!-- Markdown 渲染（轻量，仅 ~30KB） -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>

<!-- 安全提示横幅 -->

<!-- 顶部固定导航栏 -->

<div class="layout">

    <!-- 子界面 Tab -->

<script type="module">
import { initSidebar } from '../assets/js/sidebar.js';
import { requireLogin, getUser, refreshUser, authHeaders, logout } from '../assets/js/auth.js';
import { streamChat, fetchModels } from '../assets/js/stream.js';

if (!requireLogin()) throw new Error('redirect');
initSidebar();

const user = await refreshUser();
// ── 子界面 Tab 切换 ────────────────────────────────────────
function updateClaudeHash(patch) {
  const sp = new URLSearchParams(location.hash.slice(1));
  for (const [k, v] of Object.entries(patch)) {
    if (v == null || v === '') sp.delete(k); else sp.set(k, v);
  }
  const s = sp.toString();
  const newHash = s ? ('#' + s) : '';
  if (location.hash !== newHash) {
    history.replaceState(null, '', location.pathname + location.search + newHash);
  }
}

// ── 批量处理 iframe 状态持久化 ───────────────────────────
// 把 sessionStorage 里保存的子页 hash 拼回 iframe.src,确保刷新后仍停留在原子页
(function restoreBatchIframe() {
  const f = document.getElementById('batchFrame');
  if (!f) return;
  const savedHash = sessionStorage.getItem('batch_iframe_hash') || '';
  if (savedHash) f.src = 'batch.html?embed=1' + savedHash;
})();
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'batch-hash') {
    try { sessionStorage.setItem('batch_iframe_hash', e.data.hash || ''); } catch {}
  }
});

document.querySelectorAll('.sub-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    updateClaudeHash({ panel: tab.dataset.panel });
  });
});

// 刷新后恢复子 tab
(function restoreClaudePanel() {
  const params = new URLSearchParams(location.hash.slice(1));
  const panel = params.get('panel');
  if (!panel) return;
  const btn = document.querySelector(`.sub-tab[data-panel="${panel}"]`);
  if (btn) btn.click();
})();

const messagesEl     = document.getElementById('messages');
const userInput      = document.getElementById('userInput');
const sendBtn        = document.getElementById('sendBtn');
const providerInput  = document.getElementById('providerInput');
const configInput    = document.getElementById('configInput');
const modelInput     = document.getElementById('modelInput');
const providerList   = document.getElementById('providerList');
const configList     = document.getElementById('configList');
const modelList      = document.getElementById('modelList');
const attachmentsRow = document.getElementById('attachmentsRow');
const fileInput      = document.getElementById('fileInput');
const attachBtn      = document.getElementById('attachBtn');
const sessionListEl  = document.getElementById('sessionList');

const ACCEPTED_TYPES = {
  'image/jpeg':'image','image/png':'image','image/gif':'image','image/webp':'image',
  'application/pdf':'document','text/plain':'document','text/csv':'document','text/markdown':'document',
};
const MAX_SIZE = 20 * 1024 * 1024;
let chatHistory = [];
let attachments = [];
let currentSessionId = null;

// ── 会话历史侧栏 ───────────────────────────────────────────
async function loadSessions() {
  try {
    const res = await fetch('http://localhost:8000/history/my', { headers: authHeaders() });
    const list = await res.json().catch(() => []);
    sessionListEl.innerHTML = '';
    list.forEach(s => {
      const div = document.createElement('div');
      div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      div.dataset.sid = s.id;

      // 置顶图标
      const pinIcon = document.createElement('span');
      pinIcon.className = 'session-pin-icon';
      pinIcon.textContent = s.pinned ? '📌' : '';

      // 会话主体
      const body = document.createElement('div');
      body.className = 'session-item-body';

      const titleEl = document.createElement('div');
      titleEl.className = 'session-item-title';
      titleEl.textContent = s.title || '（无标题）';

      const metaEl = document.createElement('div');
      metaEl.className = 'session-item-meta';
      metaEl.textContent = `${s.created_at.slice(0,10)} · ${s.msg_count||0}条`;

      body.appendChild(titleEl);
      body.appendChild(metaEl);

      // 三点菜单按钮
      const moreBtn = document.createElement('button');
      moreBtn.className = 'session-more-btn';
      moreBtn.title = '更多操作';
      moreBtn.textContent = '···';
      moreBtn.addEventListener('click', e => {
        e.stopPropagation();
        openSessionMenu(e, s, titleEl, div);
      });

      if (s.pinned) div.appendChild(pinIcon);
      div.appendChild(body);
      div.appendChild(moreBtn);

      div.addEventListener('click', () => loadSession(s));
      sessionListEl.appendChild(div);
    });
  } catch(e) {}
}

async function loadSession(s) {
  try {
    const res = await fetch(`http://localhost:8000/history/${s.id}`, { headers: authHeaders() });
    const data = await res.json();
    currentSessionId = s.id;
    chatHistory = [];
    messagesEl.innerHTML = '';
    data.messages.forEach(m => {
      const bubble = addBubble(m.role, '', m.role === 'assistant' ? (m.model || '') : '');
      renderMessageContent(bubble, m.content, m.role);
      if (m.role !== 'system') {
        let c = m.content;
        try { const p = JSON.parse(c); if (Array.isArray(p)) c = p; } catch {}
        chatHistory.push({ role: m.role, content: c });
      }
    });
    // 锁定供应商/API（保持原 request_id 计费归属），但模型解锁，可换模型继续
    const sess = data.session || {};
    const cfgId = sess.config_id ? String(sess.config_id) : '';
    const entry = _approvedList.find(c => String(c.request_id) === cfgId);
    if (entry) {
      providerInput.value = entry.provider;
      configInput.value = entry.api_name || '';
      _currentRequestId = entry.request_id;
      // 用该 API 的可用模型重建 modelList，并预选当时的模型
      const models = entry.available_models
        ? entry.available_models.split(',').map(m => m.trim()).filter(Boolean)
        : [];
      modelList.innerHTML = models.map(m => `<option value="${m}">`).join('');
    } else if (sess.config_id) {
      providerInput.value = '';
      configInput.value = '（历史会话）';
      _currentRequestId = sess.config_id;
      modelList.innerHTML = '';
    }
    modelInput.value = sess.model || '';
    providerInput.disabled = true;
    configInput.disabled = true;
    modelInput.disabled = false;

    document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
    [...sessionListEl.children].forEach(el => { if (el.dataset.sid == s.id) el.classList.add('active'); });
  } catch(e) {}
}

// 渲染消息内容：用户消息纯文本，助手消息走 Markdown；JSON 数组解析出图片+文字
function renderMessageContent(bubble, raw, role = 'user') {
  let parsed;
  try { parsed = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch { parsed = null; }

  if (Array.isArray(parsed)) {
    const imgs = parsed.filter(b => b.type === 'image' && b.source?.data);
    const texts = parsed.filter(b => b.type === 'text').map(b => b.text).join('\n');

    if (imgs.length) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px';
      imgs.forEach(b => {
        row.appendChild(makeThumb(`data:${b.source.media_type};base64,${b.source.data}`));
      });
      bubble.appendChild(row);
    }
    if (texts) {
      const t = document.createElement('div');
      if (role === 'assistant') {
        renderMarkdown(t, texts);
      } else {
        t.style.whiteSpace = 'pre-wrap';
        t.textContent = texts;
      }
      bubble.appendChild(t);
    }
    if (!imgs.length && !texts) bubble.textContent = raw;
  } else {
    const text = typeof raw === 'string' ? raw : JSON.stringify(raw);
    if (role === 'assistant') {
      renderMarkdown(bubble, text);
    } else {
      bubble.textContent = text;
    }
  }
}

document.getElementById('newChatBtn').addEventListener('click', () => {
  chatHistory = []; attachments = []; renderAttachments();
  currentSessionId = null;
  _currentRequestId = null;
  messagesEl.innerHTML = '<p class="empty-hint">发送消息开始对话</p>';
  document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
  providerInput.disabled = false;
  configInput.disabled = false;
  modelInput.disabled = false;
  rebuildConfigBar();
  userInput.focus();
});

// ── 会话下拉菜单 ──────────────────────────────────────────
let _menuSession = null, _menuTitleEl = null, _menuDiv = null;
const menu = document.getElementById('sessionMenu');

function openSessionMenu(e, s, titleEl, div) {
  _menuSession = s; _menuTitleEl = titleEl; _menuDiv = div;
  // 更新置顶文案
  document.getElementById('menuPin').textContent = s.pinned ? '📌 取消置顶' : '📍 置顶';
  // 定位
  const rect = e.currentTarget.getBoundingClientRect();
  menu.style.top  = `${rect.bottom + 4}px`;
  menu.style.left = `${Math.min(rect.left, window.innerWidth - 140)}px`;
  menu.classList.add('open');
  div.classList.add('menu-open');
}

function closeMenu() {
  menu.classList.remove('open');
  _menuDiv?.classList.remove('menu-open');
}

document.getElementById('menuPin').addEventListener('click', async () => {
  closeMenu();
  await fetch(`http://localhost:8000/sessions/${_menuSession.id}/pin`, { method: 'PUT', headers: authHeaders() });
  loadSessions();
});

document.getElementById('menuRename').addEventListener('click', () => {
  closeMenu();
  startRename(_menuSession, _menuTitleEl);
});

document.getElementById('menuDelete').addEventListener('click', async () => {
  closeMenu();
  if (!confirm(`删除「${_menuSession.title || '无标题'}」？此操作不可撤销。`)) return;
  await fetch(`http://localhost:8000/sessions/${_menuSession.id}`, { method: 'DELETE', headers: authHeaders() });
  if (currentSessionId === _menuSession.id) {
    currentSessionId = null; chatHistory = [];
    messagesEl.innerHTML = '<p class="empty-hint">发送消息开始对话</p>';
  }
  loadSessions();
});

document.addEventListener('click', e => {
  if (!menu.contains(e.target)) closeMenu();
});

// ── 图片放大灯箱 ──────────────────────────────────────────
const lightbox    = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') lightbox.classList.remove('open'); });

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
}

// 给图片元素绑定放大事件（气泡内显示，高度 200px）
function makeThumb(src, style = 'max-height:200px;max-width:100%;object-fit:contain;border-radius:6px;cursor:zoom-in;display:block;margin:4px 0') {
  const img = document.createElement('img');
  img.src = src;
  img.style.cssText = style;
  img.addEventListener('click', e => { e.stopPropagation(); openLightbox(src); });
  return img;
}

function startRename(s, titleEl) {
  const inp = document.createElement('input');
  inp.value = s.title || '';
  inp.style.cssText = 'width:100%;font-size:.82rem;padding:1px 4px;border:1px solid var(--green);border-radius:3px;outline:none';
  titleEl.replaceWith(inp);
  inp.focus(); inp.select();
  let committed = false;
  const commit = async () => {
    if (committed) return; committed = true;
    const newTitle = inp.value.trim() || '（无标题）';
    try {
      await fetch(`http://localhost:8000/sessions/${s.id}/title`, {
        method: 'PUT', headers: authHeaders(),
        body: JSON.stringify({ title: newTitle }),
      });
      s.title = newTitle;
    } catch {}
    titleEl.textContent = s.title || '（无标题）';
    inp.replaceWith(titleEl);
    loadSessions();
  };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
    if (e.key === 'Escape') { committed = true; inp.replaceWith(titleEl); }
  });
}

loadSessions();

// ── 会话持久化 ────────────────────────────────────────────
async function ensureSession(firstMessageText) {
  if (currentSessionId) return;
  try {
    const res = await fetch('http://localhost:8000/sessions', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({
        config_id: _currentRequestId || null,
        model: modelInput.value,
        title: firstMessageText.slice(0, 50),
      }),
    });
    const data = await res.json();
    currentSessionId = data.session_id;
    loadSessions();
  } catch(e) {}
}

async function saveMessage(role, content, model = '') {
  if (!currentSessionId) return;
  const text = typeof content === 'string' ? content : JSON.stringify(content);
  fetch('http://localhost:8000/sessions/messages', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({ session_id: currentSessionId, role, content: text, model }),
  }).catch(() => {});
}

// ── 配置选择（input + datalist 模糊匹配）──────────────────
let _approvedList = [];
let _currentRequestId = null;   // 当前选中的 api_requests.id

async function loadApprovedConfigs() {
  try {
    const res = await fetch('http://localhost:8000/api-requests/approved', { headers: authHeaders() });
    _approvedList = await res.json();
    if (!_approvedList.length) {
      providerList.innerHTML = '';
      configList.innerHTML = '';
      modelList.innerHTML = '';
      providerInput.placeholder = '— 暂无可用 API —';
      setInputEnabled(false);
      messagesEl.innerHTML = `<div class="no-api-hint"><p>暂无可用 API</p><p><a href="apply.html">前往申请 →</a></p></div>`;
      return;
    }
    rebuildConfigBar();
  } catch(e) {}
}

const LS_PROV = 'claude_last_provider';
const LS_CFG  = 'claude_last_config';
const LS_MDL  = 'claude_last_model';

function rebuildConfigBar() {
  const providers = [...new Set(_approvedList.map(c => c.provider))];
  providerList.innerHTML = providers.map(p => `<option value="${p}">`).join('');
  const lastProv = localStorage.getItem(LS_PROV);
  if (lastProv && providers.includes(lastProv)) {
    providerInput.value = lastProv;
    fillConfigsForProvider(lastProv);
  } else {
    providerInput.value = '';
    configInput.value = '';
    modelInput.value = '';
    configList.innerHTML = '';
    modelList.innerHTML = '';
  }
}

function fillConfigsForProvider(prov) {
  const filtered = _approvedList.filter(c => c.provider === prov);
  configList.innerHTML = filtered.map(c => {
    const label = c.api_name || '（未命名）';
    return `<option value="${label}">`;
  }).join('');
  const lastCfgName = localStorage.getItem(LS_CFG);
  const match = lastCfgName && filtered.find(c => c.api_name === lastCfgName);
  if (match) {
    configInput.value = match.api_name;
    _currentRequestId = match.request_id;
    loadModelsForConfig(match);
  } else {
    configInput.value = '';
    _currentRequestId = null;
    modelInput.value = '';
    modelList.innerHTML = '';
  }
}

providerInput.addEventListener('change', () => {
  const v = providerInput.value.trim();
  localStorage.setItem(LS_PROV, v);
  fillConfigsForProvider(v);
});

configInput.addEventListener('change', () => {
  const v = configInput.value.trim();
  const prov = providerInput.value.trim();
  const entry = _approvedList.find(c => c.provider === prov && c.api_name === v);
  if (entry) {
    _currentRequestId = entry.request_id;
    localStorage.setItem(LS_CFG, v);
    loadModelsForConfig(entry);
  } else {
    _currentRequestId = null;
    modelList.innerHTML = '';
  }
});

const COMMON_MODELS = [
  'claude-opus-4-20250514', 'claude-sonnet-4-20250514',
  'claude-3-7-sonnet-20250219', 'claude-3-5-sonnet-20241022', 'claude-3-5-haiku-20241022',
  'gpt-4o', 'gpt-4o-mini', 'gpt-4-turbo',
  'deepseek-chat', 'deepseek-reasoner',
  'gemini-2.5-pro', 'gemini-2.5-flash',
];

function loadModelsForConfig(entry) {
  const configured = entry?.available_models
    ? entry.available_models.split(',').map(m => m.trim()).filter(Boolean)
    : [];
  const all = [...configured];
  COMMON_MODELS.forEach(m => { if (!all.includes(m)) all.push(m); });
  modelList.innerHTML = all.map(m => `<option value="${m}">`).join('');
  const lastMdl = localStorage.getItem(LS_MDL);
  if (lastMdl && all.includes(lastMdl)) modelInput.value = lastMdl;
  else if (configured.length) modelInput.value = configured[0];
  else modelInput.value = '';
}

modelInput.addEventListener('change', () => {
  localStorage.setItem(LS_MDL, modelInput.value.trim());
});

loadApprovedConfigs();

// ── 气泡 ──────────────────────────────────────────────────
function renderMarkdown(target, raw) {
  if (!raw) { target.innerHTML = ''; return; }
  try {
    const html = window.marked ? marked.parse(raw, { breaks: true, gfm: true }) : raw;
    const safe = window.DOMPurify ? DOMPurify.sanitize(html) : html;
    target.innerHTML = safe;
    target.querySelectorAll('img').forEach(img => {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', e => { e.stopPropagation(); openLightbox(img.src); });
    });
  } catch {
    target.textContent = raw;
  }
}

function addBubble(role, text = '', model = '') {
  const empty = messagesEl.querySelector('.empty-hint, .no-api-hint');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = `bubble bubble-${role}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  if (role === 'assistant' && model) {
    const tag = document.createElement('div');
    tag.className = 'bubble-model-tag';
    tag.textContent = `⎯ ${model}`;
    messagesEl.appendChild(tag);
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addError(msg, showRetry = false) {
  const div = document.createElement('div');
  div.className = 'bubble bubble-error';
  div.textContent = msg;
  if (showRetry) {
    const btn = document.createElement('button');
    btn.className = 'retry-btn'; btn.textContent = '重新生成';
    btn.addEventListener('click', () => { div.remove(); retryLastMessage(); });
    div.appendChild(document.createElement('br'));
    div.appendChild(btn);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function retryLastMessage() {
  if (!chatHistory.length || chatHistory[chatHistory.length-1].role !== 'user') return;
  setInputEnabled(false);
  const bubble = addBubble('assistant');
  bubble.classList.add('cursor');
  let accumulated = '';
  await streamChat({
    messages: chatHistory, model: modelInput.value.trim(), system: '',
    request_id: _currentRequestId,
    user_token: (await import('../assets/js/auth.js')).getToken(),
    onToken(c) { accumulated += c; renderMarkdown(bubble, accumulated); messagesEl.scrollTop = messagesEl.scrollHeight; },
    onDone() {
      bubble.classList.remove('cursor');
      renderMarkdown(bubble, accumulated);
      const usedModel = modelInput.value.trim();
      const tag = document.createElement('div');
      tag.className = 'bubble-model-tag';
      tag.textContent = `⎯ ${usedModel}`;
      messagesEl.appendChild(tag);
      chatHistory.push({ role:'assistant', content:accumulated });
      saveMessage('assistant', accumulated, usedModel);
      setInputEnabled(true); userInput.focus();
    },
    onError(err) { bubble.remove(); addError(err, true); setInputEnabled(true); },
  });
}

// ── 附件（图片缩略图 + 文件标签）────────────────────────
function readFileAsBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error(`读取失败：${file.name}`));
    r.readAsDataURL(file);
  });
}

async function processFiles(files) {
  for (const file of files) {
    if (file.type.startsWith('video/')) { addError('不支持视频文件'); continue; }
    if (!ACCEPTED_TYPES[file.type]) { addError(`不支持的文件类型：${file.name}`); continue; }
    if (file.size > MAX_SIZE) { addError(`文件超过 20MB：${file.name}`); continue; }
    try {
      const base64 = await readFileAsBase64(file);
      attachments.push({ name: file.name, mimeType: file.type, base64 });
      renderAttachments();
    } catch(err) { addError(err.message); }
  }
}

function renderAttachments() {
  attachmentsRow.innerHTML = '';
  attachments.forEach((att, i) => {
    if (att.mimeType.startsWith('image/')) {
      // 图片缩略图
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';
      const img = document.createElement('img');
      img.src = `data:${att.mimeType};base64,${att.base64}`;
      img.alt = att.name;
      const del = document.createElement('button');
      del.className = 'thumb-del'; del.textContent = '×';
      del.addEventListener('click', () => { attachments.splice(i,1); renderAttachments(); });
      wrap.appendChild(img); wrap.appendChild(del);
      attachmentsRow.appendChild(wrap);
    } else {
      // 文件标签
      const tag = document.createElement('div');
      tag.className = 'attachment-tag';
      const span = document.createElement('span'); span.textContent = `📄 ${att.name}`;
      const btn = document.createElement('button'); btn.textContent = '✕';
      btn.addEventListener('click', () => { attachments.splice(i,1); renderAttachments(); });
      tag.appendChild(span); tag.appendChild(btn);
      attachmentsRow.appendChild(tag);
    }
  });
}

function setInputEnabled(enabled) {
  userInput.disabled = !enabled;
  sendBtn.disabled   = !enabled;
  attachBtn.disabled = !enabled;
  fileInput.disabled = !enabled;
}

// ── 发送 ──────────────────────────────────────────────────
async function send() {
  const text = userInput.value.trim();
  if (!text && attachments.length === 0) return;
  if (!providerInput.value.trim()) { addError('请先选择供应商'); return; }
  if (!_currentRequestId)          { addError('请选择 API 名称'); return; }
  if (!modelInput.value.trim())    { addError('请选择模型'); return; }

  userInput.value = '';
  let content;
  if (attachments.length === 0) {
    content = text;
  } else {
    content = [];
    if (text) content.push({ type:'text', text });
    for (const att of attachments) {
      if (att.mimeType.startsWith('image/'))
        content.push({ type:'image', source:{ type:'base64', media_type:att.mimeType, data:att.base64 } });
      else if (att.mimeType === 'application/pdf')
        content.push({ type:'document', source:{ type:'base64', media_type:'application/pdf', data:att.base64 } });
      else
        content.push({ type:'document', source:{ type:'text', media_type:'text/plain', data:atob(att.base64) } });
    }
  }

  // 用户气泡（图片用缩略图展示在气泡内）
  const userBubble = addBubble('user');
  if (attachments.length > 0) {
    const imgs = attachments.filter(a => a.mimeType.startsWith('image/'));
    if (imgs.length) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px';
      imgs.forEach(a => {
        row.appendChild(makeThumb(`data:${a.mimeType};base64,${a.base64}`));
      });
      userBubble.appendChild(row);
    }
    if (text) {
      const t = document.createElement('div'); t.textContent = text;
      userBubble.appendChild(t);
    }
  } else {
    userBubble.textContent = text;
  }

  chatHistory.push({ role:'user', content });
  attachments = []; renderAttachments();

  await ensureSession(text || '图片对话');
  saveMessage('user', typeof content === 'string' ? content : JSON.stringify(content));

  setInputEnabled(false);
  const bubble = addBubble('assistant');
  bubble.classList.add('cursor');
  let accumulated = '';

  await streamChat({
    messages: chatHistory, model: modelInput.value.trim(), system: '',
    request_id: _currentRequestId,
    user_token: (await import('../assets/js/auth.js')).getToken(),
    onToken(chunk) { accumulated += chunk; renderMarkdown(bubble, accumulated); messagesEl.scrollTop = messagesEl.scrollHeight; },
    onDone() {
      bubble.classList.remove('cursor');
      renderMarkdown(bubble, accumulated);
      const usedModel = modelInput.value.trim();
      // 在气泡下方插入模型标签
      const tag = document.createElement('div');
      tag.className = 'bubble-model-tag';
      tag.textContent = `⎯ ${usedModel}`;
      messagesEl.appendChild(tag);
      chatHistory.push({ role:'assistant', content: accumulated });
      saveMessage('assistant', accumulated, usedModel);
      setInputEnabled(true);
      userInput.focus();
      loadSessions();
    },
    onError(err) {
      bubble.remove();
      saveMessage('assistant', `[错误] ${err}`);
      addError(err, true); setInputEnabled(true);
    },
  });
}

sendBtn.addEventListener('click', send);
userInput.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
let _uploadConfirmed = false;   // 当次页面会话内,确认过一次后续不再提示
attachBtn.addEventListener('click', () => {
  if (_uploadConfirmed) { fileInput.click(); return; }
  document.getElementById('uploadConfirmModal').classList.add('open');
});
document.getElementById('uploadConfirmOk').addEventListener('click', () => {
  _uploadConfirmed = true;
  document.getElementById('uploadConfirmModal').classList.remove('open');
  fileInput.click();
});
fileInput.addEventListener('change', () => { processFiles([...fileInput.files]); fileInput.value=''; });
messagesEl.addEventListener('dragover', e => { e.preventDefault(); messagesEl.classList.add('drag-over'); });
messagesEl.addEventListener('dragleave', () => messagesEl.classList.remove('drag-over'));
messagesEl.addEventListener('drop', e => { e.preventDefault(); messagesEl.classList.remove('drag-over'); processFiles([...e.dataTransfer.files]); });

// ── 侧边栏拖拽调整宽度 ──────────────────────────────────────
{
  const sidebar = document.getElementById('sessionSidebar');
  const handle = document.getElementById('resizeHandle');
  const LS_WIDTH = 'claude_sidebar_width';
  const saved = localStorage.getItem(LS_WIDTH);
  if (saved) sidebar.style.width = saved + 'px';

  let startX, startW;
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    handle.classList.add('active');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  function onMove(e) {
    const w = Math.max(140, Math.min(500, startW + e.clientX - startX));
    sidebar.style.width = w + 'px';
  }
  function onUp() {
    handle.classList.remove('active');
    localStorage.setItem(LS_WIDTH, sidebar.offsetWidth);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
}
