<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API调用 — 数据平台</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
  <style>
    /* ── Tab 导航 ── */
    .sub-tabs { display:flex; border-bottom:1px solid var(--border); margin-top:-10px; margin-bottom:0; background:#fff; }
    .sub-tab { padding:10px 22px; font-size:.9rem; cursor:pointer; border:none; background:none; color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s; }
    .sub-tab:hover { color:var(--text); }
    .sub-tab.active { color:var(--green); border-bottom-color:var(--green); font-weight:500; }
    .sub-panel { display:none; }
    .sub-panel.active { display:flex; flex-direction:column; }

    /* ── 在线使用主布局（左历史 + 右聊天）── */
    .chat-layout {
      display: flex;
      height: calc(100vh - 148px);
    }

    /* ── 左侧历史会话栏 ── */
    .session-sidebar {
      width: 220px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      background: #fafafa;
    }
    .session-sidebar-head {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .new-chat-btn {
      width: 100%; padding: 7px 0; font-size: .85rem;
      background: var(--green); color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-weight: 500;
    }
    .new-chat-btn:hover { background: var(--green-hover); }
    .session-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    .session-item {
      padding: 8px 10px 8px 12px; cursor: pointer; font-size: .82rem;
      color: var(--text); border-radius: 0; transition: background .12s;
      display: flex; align-items: flex-start; gap: 4px; position: relative;
    }
    .session-item:hover { background: var(--border); }
    .session-item.active { background: var(--green-bg); color: var(--green); font-weight: 500; }
    .session-item-body { flex: 1; min-width: 0; }
    .session-item-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .session-item-meta { font-size:.72rem; color:var(--text-muted); margin-top:2px; }
    .session-pin-icon { font-size:.7rem; color:var(--green); flex-shrink:0; margin-top:2px; }
    .session-more-btn {
      display: none; flex-shrink: 0; align-self: flex-start;
      background: none; border: none; padding: 2px 5px; cursor: pointer;
      color: var(--text-muted); border-radius: 3px; font-size: 1rem; line-height: 1;
    }
    .session-item:hover .session-more-btn,
    .session-item.menu-open .session-more-btn { display: block; }
    .session-more-btn:hover { background: rgba(0,0,0,.08); }

    /* 下拉菜单 */
    .session-menu {
      display: none; position: fixed; z-index: 500;
      background: #fff; border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
      min-width: 120px; padding: 4px 0;
    }
    .session-menu.open { display: block; }
    .session-menu-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; font-size: .83rem; cursor: pointer;
      color: var(--text); white-space: nowrap;
    }
    .session-menu-item:hover { background: var(--surface); }
    .session-menu-item.danger { color: #dc2626; }
    .session-menu-item.danger:hover { background: #fee2e2; }

    /* ── 右侧聊天区 ── */
    .chat-main {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
    }
    .config-bar {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .config-bar .form-group { margin: 0; }
    .messages {
      flex: 1; overflow-y: auto; padding: 20px 24px;
      display: flex; flex-direction: column; gap: 16px;
      background: var(--surface);
    }
    .bubble {
      max-width: 75%; padding: 10px 14px; border-radius: 14px;
      font-size: .92rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    }
    .bubble-user { background: var(--green); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bubble-assistant { background: #fff; border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
    .bubble-error { background: #fee2e2; border:1px solid #fecaca; color:#dc2626; align-self:flex-start; border-radius:var(--radius); font-size:.85rem; }
    .retry-btn { margin-top:6px; padding:3px 10px; font-size:.78rem; background:#fff; border:1px solid #fecaca; color:#dc2626; border-radius:4px; cursor:pointer; }
    .retry-btn:hover { background:#fee2e2; }
    .cursor::after { content:'▋'; animation:blink .7s step-end infinite; }
    @keyframes blink { 50% { opacity:0; } }

    /* ── 图片缩略图 ── */
    .thumb-wrap {
      position: relative; display: inline-block;
      width: 64px; height: 64px; border-radius: 6px;
      overflow: hidden; border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .thumb-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
    .thumb-wrap .thumb-del {
      position:absolute; top:2px; right:2px;
      width:18px; height:18px; border-radius:50%;
      background:rgba(0,0,0,.5); color:#fff;
      font-size:11px; line-height:18px; text-align:center;
      cursor:pointer; border:none; padding:0;
    }
    .attachment-tag {
      display:flex; align-items:center; gap:5px;
      background:#fff; border:1px solid var(--border);
      border-radius:6px; padding:3px 8px; font-size:.8rem;
    }
    .attachment-tag button { background:none; color:var(--text-muted); padding:0 2px; font-size:.85rem; }
    .attachment-tag button:hover { color:#dc2626; }

    /* ── 输入区 ── */
    .input-area { padding: 10px 16px; border-top: 1px solid var(--border); background: #fff; }
    .attachments-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .input-row { display:flex; gap:8px; align-items:flex-end; }
    .input-row textarea { flex:1; resize:none; height:44px; line-height:1.5; font-family:var(--font); }

    .empty-hint { color:var(--text-muted); font-size:.85rem; text-align:center; margin:auto; }
    .no-api-hint { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--text-muted); }
    .no-api-hint a { color:var(--green); }
    .drag-over { outline: 2px dashed var(--green); outline-offset: -4px; }

    /* ── 脚本编辑器 ──────────────────────────────────────── */
    #panel-script { height: calc(100vh - 148px); }
    .script-layout { display:flex; height:100%; }
    .script-left {
      width:50%; min-width:300px; display:flex; flex-direction:column;
      border-right:1px solid var(--border); padding:10px; gap:8px; overflow:hidden;
    }
    .script-right { flex:1; display:flex; flex-direction:column; min-width:0; }
    .script-file-drop {
      border:2px dashed var(--border); border-radius:var(--radius);
      padding:8px 14px; cursor:pointer; text-align:center;
      font-size:.83rem; color:var(--text-muted); transition:border-color .15s;
    }
    .script-file-drop:hover,.script-file-drop.dragover {
      border-color:var(--green); color:var(--green); background:var(--green-bg);
    }
    .script-config { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; flex-shrink:0; }
    .script-config .form-group label { font-size:.74rem; }
    .script-editor-container {
      flex:1; min-height:0; border:1px solid var(--border);
      border-radius:var(--radius); overflow:hidden;
    }
    .script-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; padding-top:2px; }
    .script-out-tabs { display:flex; border-bottom:1px solid var(--border); background:#fff; flex-shrink:0; }
    .script-out-tab {
      padding:8px 16px; font-size:.85rem; cursor:pointer; border:none; background:none;
      color:var(--text-muted); border-bottom:2px solid transparent;
    }
    .script-out-tab.active { color:var(--green); border-bottom-color:var(--green); font-weight:500; }
    .script-out-panel { display:none; flex:1; overflow:hidden; flex-direction:column; }
    .script-out-panel.active { display:flex; }
    .script-log {
      flex:1; overflow-y:auto; padding:12px 16px;
      font-family:monospace; font-size:.82rem; line-height:1.6;
      background:var(--surface); white-space:pre-wrap; word-break:break-word;
    }
    .log-stdout { color:var(--text); }
    .log-stderr { color:#e06c75; }
    .log-error  { color:#dc2626; }
    .log-info   { color:#6b7280; font-style:italic; }
    .script-log img   { max-width:100%; border-radius:6px; margin:4px 0; cursor:zoom-in; display:block; }
    .script-log video { max-width:100%; border-radius:6px; margin:4px 0; display:block; }
    .script-file-badge {
      background:var(--green); color:#fff; border-radius:10px;
      font-size:.7rem; padding:0 5px; margin-left:4px; min-width:16px;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .result-file-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px; border-bottom:1px solid var(--border); font-size:.83rem;
    }
    .result-file-item .file-name { flex:1; font-family:monospace; word-break:break-all; }
    .result-file-item .file-size { color:var(--text-muted); font-size:.75rem; flex-shrink:0; }

    /* 安全提示悬浮条（与顶栏平行，居中，不撑满宽度） */
    .security-banner {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 5px 14px 5px 12px; font-size: .82rem; color: #92400e;
      position: fixed;
      top: calc((var(--header-h) - 30px) / 2);
      left: 50%; transform: translateX(-20%);
      z-index: 110; white-space: nowrap;
    }
    .security-banner .icon { font-size: .9rem; flex-shrink: 0; }
    .security-banner .close-btn {
      background: none; border: none; cursor: pointer;
      color: #b45309; font-size: 1rem; padding: 0 0 0 6px; line-height: 1;
      opacity: .7; flex-shrink: 0;
    }
    .security-banner .close-btn:hover { opacity: 1; }

    /* 图片放大灯箱 */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.85); align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 6px; object-fit: contain; }
  </style>

  <!-- 图片放大灯箱 -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="">
  </div>

  <!-- 全局会话操作下拉菜单（单例） -->
  <div class="session-menu" id="sessionMenu">
    <div class="session-menu-item" id="menuPin">📌 置顶</div>
    <div class="session-menu-item" id="menuRename">✏️ 重命名</div>
    <div class="session-menu-item danger" id="menuDelete">🗑️ 删除</div>
  </div>
  <!-- Monaco Editor（懒加载，进入脚本 Tab 时初始化）-->
  <script>var require = { paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } };</script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>

<!-- 安全提示横幅 -->
<div class="security-banner" id="securityBanner">
  <span class="icon">⚠️</span>
  <span class="text">注意信息安全：请勿在对话中输入账号密码、身份证号、银行卡号等敏感信息。</span>
  <button class="close-btn" id="bannerClose" title="关闭">×</button>
</div>

<!-- 顶部固定导航栏 -->

<div class="layout">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-group open" id="sg1">
      <div class="sidebar-group-title" onclick="document.getElementById('sg1').classList.toggle('open')">
        三方API管理 <span class="arrow">›</span>
      </div>
      <div class="sidebar-children">
        <a href="claude.html"  class="sidebar-item active">API调用</a>
        <a href="apply.html"   class="sidebar-item">API申请&审核</a>
        <a href="keys.html"    class="sidebar-item sidebar-admin" id="keysLink">密钥管理</a>
        <a href="stats.html"   class="sidebar-item">使用统计</a>
        <a href="users.html"   class="sidebar-item sidebar-admin" id="usersLink">用户管理</a>
      </div>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="main" style="padding-bottom:0">
<div class="breadcrumb">
  <button class="sidebar-toggle" id="sidebarToggle">☰</button><span class="brand">数据平台</span>
  <span class="sep">›</span>
  <a href="#">三方API管理</a>
  <span class="sep">›</span>
  <span class="current">API调用</span>
  <div class="breadcrumb-right" id="userBar"></div>
</div>


    <!-- 子界面 Tab -->
    <div class="sub-tabs">
      <button class="sub-tab active" data-panel="chat">在线使用</button>
      <button class="sub-tab" data-panel="batch">批量处理</button>
      <button class="sub-tab" data-panel="script">脚本</button>
    </div>

    <!-- ① 在线使用（左历史 + 右聊天） -->
    <div class="sub-panel active" id="panel-chat">
      <div class="chat-layout">

        <!-- 左：会话历史 -->
        <div class="session-sidebar">
          <div class="session-sidebar-head">
            <button class="new-chat-btn" id="newChatBtn">＋ 新对话</button>
          </div>
          <div class="session-list" id="sessionList"></div>
        </div>

        <!-- 右：聊天主区 -->
        <div class="chat-main">
          <!-- 配置栏 -->
          <div class="config-bar">
            <div class="form-group">
              <label>供应商</label>
              <select id="providerSelect"><option value="">— 请选择 —</option></select>
            </div>
            <div class="form-group">
              <label>API名称</label>
              <select id="configSelect"><option value="">— 请选择 —</option></select>
            </div>
            <div class="form-group">
              <label>模型</label>
              <select id="modelSelect"><option value="">— 请选择 —</option></select>
            </div>
          </div>

          <!-- 消息流 -->
          <div class="messages" id="messages">
            <p class="empty-hint">发送消息开始对话</p>
          </div>

          <!-- 输入区 -->
          <div class="input-area">
            <div class="attachments-row" id="attachmentsRow"></div>
            <div class="input-row">
              <textarea id="userInput" placeholder="输入消息… (Enter 发送，Shift+Enter 换行)"></textarea>
              <input type="file" id="fileInput" multiple
                     accept="image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain,text/csv,text/markdown,.md"
                     style="display:none">
              <button class="btn btn-secondary" id="attachBtn" title="附加文件">📎</button>
              <button class="btn btn-primary"   id="sendBtn">发送</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ③ 脚本编辑器 -->
    <div class="sub-panel" id="panel-script">
      <div class="script-layout">
        <!-- 左：文件 + 配置 + 编辑器 -->
        <div class="script-left">
          <div id="scriptFileArea">
            <input type="file" id="scriptFileInput"
                   accept=".parquet,.json,.csv,.xlsx,.xls" style="display:none">
            <div class="script-file-drop" id="scriptFileDrop">
              <div>📂 拖拽或点击上传数据文件</div>
              <div style="font-size:.73rem;color:var(--text-muted)">.parquet / .json / .csv / .xlsx</div>
            </div>
            <div id="scriptFileInfo" style="display:none;align-items:center;padding:6px 2px;gap:8px">
              <span id="scriptFileName" style="font-size:.82rem;font-weight:500"></span>
              <span id="scriptFileStats" style="font-size:.75rem;color:var(--text-muted)"></span>
              <button class="btn btn-secondary" id="scriptFileClear"
                      style="padding:2px 8px;font-size:.75rem">✕</button>
            </div>
          </div>
          <div class="script-config">
            <div class="form-group" style="margin:0">
              <label>供应商</label>
              <select id="scriptProviderSel"><option value="">— 请选择 —</option></select>
            </div>
            <div class="form-group" style="margin:0">
              <label>API名称</label>
              <select id="scriptConfigSel"><option value="">— 请选择 —</option></select>
            </div>
            <div class="form-group" style="margin:0">
              <label>模型</label>
              <select id="scriptModelSel"><option value="">— 请选择 —</option></select>
            </div>
          </div>
          <div id="scriptEditorContainer" class="script-editor-container"></div>
          <div class="script-actions">
            <button class="btn btn-primary"   id="scriptRunBtn">▶ 运行</button>
            <button class="btn btn-secondary" id="scriptStopBtn" style="display:none">■ 停止</button>
            <button class="btn btn-secondary" id="scriptClearBtn">🗑 清空输出</button>
            <span id="scriptTimer" style="font-size:.8rem;color:var(--text-muted)"></span>
          </div>
        </div>
        <!-- 右：输出区 -->
        <div class="script-right">
          <div class="script-out-tabs">
            <button class="script-out-tab active" data-out="log">运行日志</button>
            <button class="script-out-tab" data-out="files">
              结果文件
              <span id="scriptFileBadge" class="script-file-badge" style="display:none"></span>
            </button>
          </div>
          <div class="script-out-panel active" id="scriptOutLog">
            <div class="script-log" id="scriptLog">
              <span style="color:var(--text-muted);font-size:.82rem">运行后输出将显示在这里</span>
            </div>
          </div>
          <div class="script-out-panel" id="scriptOutFiles">
            <div id="scriptResultFiles" style="flex:1;overflow-y:auto">
              <p style="color:var(--text-muted);font-size:.82rem;padding:16px">暂无结果文件</p>
            </div>
            <div id="scriptDownloadAll" style="display:none;padding:8px 12px;border-top:1px solid var(--border)">
              <button class="btn btn-primary" id="scriptDlAllBtn" style="font-size:.82rem">
                ↓ 打包下载全部
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ② 批量处理 -->
    <div class="sub-panel" id="panel-batch">
      <iframe src="batch.html?embed=1" id="batchFrame"
              style="width:100%;height:calc(100vh - 96px);border:none;display:block"></iframe>
    </div>

  </div>
</div>

<script type="module">
import { initSidebar } from '../assets/js/sidebar.js';
import { requireLogin, getUser, refreshUser, authHeaders, logout } from '../assets/js/auth.js';
import { streamChat, fetchModels } from '../assets/js/stream.js';

if (!requireLogin()) throw new Error('redirect');
initSidebar();

// ── 安全提示横幅 ──────────────────────────────────────────
document.getElementById('bannerClose').addEventListener('click', () => {
  document.getElementById('securityBanner').style.display = 'none';
});

const user = await refreshUser();
document.getElementById('userBar').innerHTML = `
  <span class="username">${user.username}${user.role === 'admin' ? '（管理员）' : ''}</span>
  <button class="logout" id="logoutBtn">退出</button>`;
document.getElementById('logoutBtn').addEventListener('click', () => logout());
if (user.role === 'admin') { const l = document.getElementById('usersLink'); if (l) l.style.display = 'block'; const k = document.getElementById('keysLink'); if (k) k.style.display = 'block'; }

// ── 子界面 Tab 切换 ────────────────────────────────────────
document.querySelectorAll('.sub-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

const messagesEl     = document.getElementById('messages');
const userInput      = document.getElementById('userInput');
const sendBtn        = document.getElementById('sendBtn');
const providerSelect = document.getElementById('providerSelect');
const configSelect   = document.getElementById('configSelect');
const modelSelect    = document.getElementById('modelSelect');
const attachmentsRow = document.getElementById('attachmentsRow');
const fileInput      = document.getElementById('fileInput');
const attachBtn      = document.getElementById('attachBtn');
const sessionListEl  = document.getElementById('sessionList');

const ACCEPTED_TYPES = {
  'image/jpeg':'image','image/png':'image','image/gif':'image','image/webp':'image',
  'application/pdf':'document','text/plain':'document','text/csv':'document','text/markdown':'document',
};
const MAX_SIZE = 20 * 1024 * 1024;
let chatHistory = [];
let attachments = [];
let currentSessionId = null;

// ── 会话历史侧栏 ───────────────────────────────────────────
async function loadSessions() {
  try {
    const res = await fetch('http://localhost:8000/history/my', { headers: authHeaders() });
    const list = await res.json().catch(() => []);
    sessionListEl.innerHTML = '';
    list.forEach(s => {
      const div = document.createElement('div');
      div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      div.dataset.sid = s.id;

      // 置顶图标
      const pinIcon = document.createElement('span');
      pinIcon.className = 'session-pin-icon';
      pinIcon.textContent = s.pinned ? '📌' : '';

      // 会话主体
      const body = document.createElement('div');
      body.className = 'session-item-body';

      const titleEl = document.createElement('div');
      titleEl.className = 'session-item-title';
      titleEl.textContent = s.title || '（无标题）';

      const metaEl = document.createElement('div');
      metaEl.className = 'session-item-meta';
      metaEl.textContent = `${s.created_at.slice(0,10)} · ${s.msg_count||0}条`;

      body.appendChild(titleEl);
      body.appendChild(metaEl);

      // 三点菜单按钮
      const moreBtn = document.createElement('button');
      moreBtn.className = 'session-more-btn';
      moreBtn.title = '更多操作';
      moreBtn.textContent = '···';
      moreBtn.addEventListener('click', e => {
        e.stopPropagation();
        openSessionMenu(e, s, titleEl, div);
      });

      div.appendChild(body);
      div.appendChild(moreBtn);

      div.addEventListener('click', () => loadSession(s));
      sessionListEl.appendChild(div);
    });
  } catch(e) {}
}

async function loadSession(s) {
  try {
    const res = await fetch(`http://localhost:8000/history/${s.id}`, { headers: authHeaders() });
    const data = await res.json();
    currentSessionId = s.id;
    chatHistory = [];
    messagesEl.innerHTML = '';
    data.messages.forEach(m => {
      const bubble = addBubble(m.role);
      renderMessageContent(bubble, m.content);
      if (m.role !== 'system') {
        // 尝试解析 JSON 字符串（图片消息存为 JSON）
        let c = m.content;
        try { const p = JSON.parse(c); if (Array.isArray(p)) c = p; } catch {}
        chatHistory.push({ role: m.role, content: c });
      }
    });
    document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
    [...sessionListEl.children].forEach(el => { if (el.dataset.sid == s.id) el.classList.add('active'); });
  } catch(e) {}
}

// 渲染消息内容：纯文本直接显示，JSON 数组则解析出图片缩略图和文字
function renderMessageContent(bubble, raw) {
  let parsed;
  try { parsed = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch { parsed = null; }

  if (Array.isArray(parsed)) {
    const imgs = parsed.filter(b => b.type === 'image' && b.source?.data);
    const texts = parsed.filter(b => b.type === 'text').map(b => b.text).join('\n');

    if (imgs.length) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px';
      imgs.forEach(b => {
        row.appendChild(makeThumb(`data:${b.source.media_type};base64,${b.source.data}`));
      });
      bubble.appendChild(row);
    }
    if (texts) {
      const t = document.createElement('div');
      t.style.whiteSpace = 'pre-wrap';
      t.textContent = texts;
      bubble.appendChild(t);
    }
    if (!imgs.length && !texts) bubble.textContent = raw; // fallback
  } else {
    bubble.textContent = typeof raw === 'string' ? raw : JSON.stringify(raw);
  }
}

function addBubble(role, text = '') {
  const empty = messagesEl.querySelector('.empty-hint, .no-api-hint');

  const div = document.createElement('div');
  div.className = `bubble bubble-${role}`;
  div.textContent = text;

  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addError(msg, showRetry = false) {
  const div = document.createElement('div');
  div.className = 'bubble bubble-error';
  div.textContent = msg;
  if (showRetry) {
    const btn = document.createElement('button');
    btn.className = 'retry-btn'; btn.textContent = '重新生成';
    btn.addEventListener('click', () => { div.remove(); retryLastMessage(); });
    div.appendChild(document.createElement('br'));
    div.appendChild(btn);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function retryLastMessage() {
  if (!chatHistory.length || chatHistory[chatHistory.length-1].role !== 'user') return;
  setInputEnabled(false);
  const bubble = addBubble('assistant');
  bubble.classList.add('cursor');
  let accumulated = '';
  await streamChat({
    messages: chatHistory, model: modelSelect.value, system: '',
    config_id: parseInt(configSelect.value),
    user_token: (await import('../assets/js/auth.js')).getToken(),
    onToken(c) { accumulated += c; bubble.textContent = accumulated; messagesEl.scrollTop = messagesEl.scrollHeight; },
    onDone() { bubble.classList.remove('cursor'); chatHistory.push({ role:'assistant', content:accumulated }); saveMessage('assistant', accumulated); setInputEnabled(true); userInput.focus(); },
    onError(err) { bubble.remove(); addError(err, true); setInputEnabled(true); },
  });
}

// ── 附件（图片缩略图 + 文件标签）────────────────────────
function readFileAsBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error(`读取失败：${file.name}`));
    r.readAsDataURL(file);
  });
}

async function processFiles(files) {
  for (const file of files) {
    if (file.type.startsWith('video/')) { addError('不支持视频文件'); continue; }
    if (!ACCEPTED_TYPES[file.type]) { addError(`不支持的文件类型：${file.name}`); continue; }
    if (file.size > MAX_SIZE) { addError(`文件超过 20MB：${file.name}`); continue; }
    try {
      const base64 = await readFileAsBase64(file);
      attachments.push({ name: file.name, mimeType: file.type, base64 });
      renderAttachments();
    } catch(err) { addError(err.message); }
  }
}

function renderAttachments() {
  attachmentsRow.innerHTML = '';
  attachments.forEach((att, i) => {
    if (att.mimeType.startsWith('image/')) {
      // 图片缩略图
      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';
      const img = document.createElement('img');
      img.src = `data:${att.mimeType};base64,${att.base64}`;
      img.alt = att.name;
      const del = document.createElement('button');
      del.className = 'thumb-del'; del.textContent = '×';
      del.addEventListener('click', () => { attachments.splice(i,1); renderAttachments(); });
      wrap.appendChild(img); wrap.appendChild(del);
      attachmentsRow.appendChild(wrap);
    } else {
      // 文件标签
      const tag = document.createElement('div');
      tag.className = 'attachment-tag';
      const span = document.createElement('span'); span.textContent = `📄 ${att.name}`;
      const btn = document.createElement('button'); btn.textContent = '✕';
      btn.addEventListener('click', () => { attachments.splice(i,1); renderAttachments(); });
      tag.appendChild(span); tag.appendChild(btn);
      attachmentsRow.appendChild(tag);
    }
  });
}

function setInputEnabled(enabled) {
  userInput.disabled = !enabled;
  sendBtn.disabled   = !enabled;
  attachBtn.disabled = !enabled;
  fileInput.disabled = !enabled;

// ── 发送 ──────────────────────────────────────────────────
async function send() {
  const text = userInput.value.trim();
  if (!text && attachments.length === 0) return;
  if (!providerSelect.value) { addError('请先选择供应商'); return; }
  if (!configSelect.value)   { addError('请选择 API 名称'); return; }
  if (!modelSelect.value)    { addError('请选择模型'); return; }

  userInput.value = '';
  let content;
  if (attachments.length === 0) {
    content = text;
  } else {
    content = [];
    if (text) content.push({ type:'text', text });
    for (const att of attachments) {
      if (att.mimeType.startsWith('image/'))
        content.push({ type:'image', source:{ type:'base64', media_type:att.mimeType, data:att.base64 } });
      else if (att.mimeType === 'application/pdf')
        content.push({ type:'document', source:{ type:'base64', media_type:'application/pdf', data:att.base64 } });
      else
        content.push({ type:'document', source:{ type:'text', media_type:'text/plain', data:atob(att.base64) } });
    }
  }

  // 用户气泡（图片用缩略图展示在气泡内）
  const userBubble = addBubble('user');
  if (attachments.length > 0) {
    const imgs = attachments.filter(a => a.mimeType.startsWith('image/'));
    if (imgs.length) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px';
      imgs.forEach(a => {
        row.appendChild(makeThumb(`data:${a.mimeType};base64,${a.base64}`));
      });
      userBubble.appendChild(row);
    }
    if (text) {
      const t = document.createElement('div'); t.textContent = text;
      userBubble.appendChild(t);
    }
  } else {
    userBubble.textContent = text;
  }

  chatHistory.push({ role:'user', content });
  attachments = []; renderAttachments();

  await ensureSession(text || '图片对话');
  saveMessage('user', typeof content === 'string' ? content : JSON.stringify(content));

  setInputEnabled(false);
  const bubble = addBubble('assistant');
  bubble.classList.add('cursor');
  let accumulated = '';

  await streamChat({
    messages: chatHistory, model: modelSelect.value, system: '',
    config_id: parseInt(configSelect.value),
    user_token: (await import('../assets/js/auth.js')).getToken(),
    onToken(chunk) { accumulated += chunk; bubble.textContent = accumulated; messagesEl.scrollTop = messagesEl.scrollHeight; },
    onDone() {
      bubble.classList.remove('cursor');
      chatHistory.push({ role:'assistant', content: accumulated });
      saveMessage('assistant', accumulated);
      setInputEnabled(true);
      userInput.focus();
      loadSessions();
    },
    onError(err) {
      bubble.remove();
      saveMessage('assistant', `[错误] ${err}`);
      addError(err, true); setInputEnabled(true);
    },
  });
}

  document.querySelector('.script-out-tab[data-out="log"]').click();
  clearScriptOutput();

  monacoEditor?.updateOptions({ readOnly: true });
  document.getElementById('scriptRunBtn').style.display  = 'none';
  document.getElementById('scriptStopBtn').style.display = '';
  let elapsed = 0;
  const timerEl = document.getElementById('scriptTimer');
  timerEl.textContent = '0s';
  _scriptTimer = setInterval(() => { elapsed++; timerEl.textContent = elapsed + 's'; }, 1000);

  const { getToken } = await import('../assets/js/auth.js');
  _scriptAbort = new AbortController();

  try {
    const res = await fetch('http://localhost:8000/script/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': getToken() || '' },
      body: JSON.stringify({ code, config_id: configId ? parseInt(configId) : null,
                             model, file_id: uploadedFileId }),
      signal: _scriptAbort.signal,
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      appendScriptLog('error', (d.detail || `HTTP ${res.status}`) + '\n');
      return;
    }
    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try { handleScriptEvent(JSON.parse(line.slice(6))); } catch {}
      }
    }
  } catch(e) {
    if (e.name !== 'AbortError') appendScriptLog('error', '连接中断：' + e.message + '\n');
    else appendScriptLog('info', '已手动停止\n');
  } finally {
    clearInterval(_scriptTimer);
    monacoEditor?.updateOptions({ readOnly: false });
    document.getElementById('scriptRunBtn').style.display  = '';
    document.getElementById('scriptStopBtn').style.display = 'none';
    timerEl.textContent = '';
  }
}

function handleScriptEvent(ev) {
  const logEl = document.getElementById('scriptLog');
  switch(ev.type) {
    case 'stdout': appendScriptLog('stdout', ev.text); break;
    case 'stderr': appendScriptLog('stderr', ev.text); break;
    case 'error':  appendScriptLog('error',  ev.text); break;
    case 'info':   appendScriptLog('info',   ev.text); break;
    case 'image': {
      const img = document.createElement('img');
      img.src = ev.data;
      img.addEventListener('click', () => openLightbox(ev.data));
      logEl.appendChild(img); logEl.scrollTop = logEl.scrollHeight; break;
    }
    case 'video': {
      const vid = document.createElement('video');
      vid.controls = true;
      vid.src = `http://localhost:8000/script/result/${ev.run_id}/${ev.filename}`;
      logEl.appendChild(vid); logEl.scrollTop = logEl.scrollHeight; break;
    }
    case 'file': {
      _scriptRunId = ev.run_id; _scriptFiles++;
      const badge = document.getElementById('scriptFileBadge');
      badge.textContent = _scriptFiles; badge.style.display = '';
      const filesEl = document.getElementById('scriptResultFiles');
      if (filesEl.querySelector('p')) filesEl.innerHTML = '';
      const sizeStr = ev.size > 1048576 ? (ev.size/1048576).toFixed(1)+' MB'
                    : ev.size > 1024    ? (ev.size/1024).toFixed(1)+' KB'
                    : ev.size + ' B';
      const item = document.createElement('div');
      item.className = 'result-file-item';
      item.innerHTML = `<span class="file-name">📄 ${ev.name}</span>
        <span class="file-size">${sizeStr}</span>
        <a class="btn btn-secondary" style="padding:3px 10px;font-size:.78rem;text-decoration:none"
           href="http://localhost:8000/script/result/${ev.run_id}/download"
           download="result_${ev.run_id.slice(0,8)}.zip">↓</a>`;
      filesEl.appendChild(item);
      document.getElementById('scriptDownloadAll').style.display = '';
      break;
    }
    case 'done': {
      if (ev.run_id) _scriptRunId = ev.run_id;
      appendScriptLog('info', `\n✅ 完成（${ev.elapsed}s，${ev.file_count} 个结果文件）\n`);
      break;
    }
  }
}

function appendScriptLog(cls, text) {
  const logEl = document.getElementById('scriptLog');
  const hint = logEl.querySelector('[style]');
  if (hint) hint.remove();
  const span = document.createElement('span');
  span.className = `log-${cls}`; span.textContent = text;
  logEl.appendChild(span); logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById('scriptDlAllBtn').addEventListener('click', () => {
  if (_scriptRunId)
    window.location.href = `http://localhost:8000/script/result/${_scriptRunId}/download`;
});

})(); // initScriptEditor
</script>
</body>
</html>
