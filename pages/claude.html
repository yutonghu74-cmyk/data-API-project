<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API调用 — 数据平台</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
  <style>
    .sub-tabs {
      display: flex; border-bottom: 1px solid var(--border);
      margin-top: -10px; margin-bottom: 0; background: #fff;
    }
    .sub-tab {
      padding: 10px 22px; font-size: .9rem; cursor: pointer;
      border: none; background: none; color: var(--text-muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .15s;
    }
    .sub-tab:hover { color: var(--text); }
    .sub-tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 500; }
    .sub-panel { display: none; }
    .sub-panel.active { display: block; }
    .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 176px); }
    .config-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; margin-top: 20px; }
    .messages {
      flex: 1; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      margin-bottom: 10px;
    }
    .bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 12px;
      font-size: .92rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .bubble-user {
      background: var(--green); color: #fff;
      align-self: flex-end; border-bottom-right-radius: 4px;
    }
    .bubble-assistant {
      background: #fff; border: 1px solid var(--border);
      align-self: flex-start; border-bottom-left-radius: 4px;
    }
    .bubble-error {
      background: #fee2e2; border: 1px solid #fecaca; color: #dc2626;
      align-self: flex-start; border-radius: var(--radius); font-size: .85rem;
    }
    .cursor::after { content: '▋'; animation: blink .7s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .input-area { display: flex; flex-direction: column; gap: 6px; }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    .input-row textarea {
      flex: 1; resize: none; height: 44px; line-height: 1.5;
      font-family: var(--font);
    }
    .attachments-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .attachment-tag {
      display: flex; align-items: center; gap: 5px;
      background: #fff; border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 8px; font-size: .8rem;
    }
    .attachment-tag button {
      background: none; color: var(--text-muted); padding: 0 2px;
      font-size: .85rem; border-radius: 3px;
    }
    .attachment-tag button:hover { color: #dc2626; }
    .drag-over { border-color: var(--green) !important; background: var(--green-bg) !important; }
    .empty-hint { color: var(--text-muted); font-size: .85rem; text-align: center; margin: auto; }
    .no-api-hint {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; color: var(--text-muted);
    }
    .no-api-hint a { color: var(--green); }
    .save-row { display: flex; align-items: center; gap: 8px; font-size: .83rem; color: var(--text-muted); }
    .save-row input { width: 280px; height: 32px; font-size: .83rem; }
  </style>
</head>
<body>

<!-- 顶部固定导航栏 -->
<div class="top-bar">
  <button class="sidebar-toggle" id="sidebarToggle">☰</button>
  <span class="brand">数据平台</span>
  <div style="flex:1"></div>
  <div class="breadcrumb-right" id="userBar"></div>
</div>

<div class="layout">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-group open" id="sg1">
      <div class="sidebar-group-title" onclick="document.getElementById('sg1').classList.toggle('open')">
        三方API管理 <span class="arrow">›</span>
      </div>
      <div class="sidebar-children">
        <a href="claude.html"  class="sidebar-item active">API调用</a>
        <a href="apply.html"   class="sidebar-item">API申请&审核</a>
        <a href="keys.html"    class="sidebar-item sidebar-admin" id="keysLink">密钥管理</a>
        <a href="stats.html"   class="sidebar-item">使用统计</a>
        <a href="users.html"   class="sidebar-item sidebar-admin" id="usersLink">用户管理</a>
      </div>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="main" style="padding-bottom:0">
<div class="breadcrumb">
  <a href="#">三方API管理</a>
  <span class="sep">›</span>
  <span class="current">API调用</span>
</div>


    <!-- 子界面 Tab -->
    <div class="sub-tabs">
      <button class="sub-tab active" data-panel="chat">在线试用</button>
      <button class="sub-tab" data-panel="batch">批量处理</button>
      <button class="sub-tab" data-panel="history">历史记录</button>
    </div>

    <!-- ① API调用 -->
    <div class="sub-panel active" id="panel-chat">
      <div class="chat-wrap">
        <div class="config-bar">
          <div class="form-group" style="margin:0">
            <label>供应商</label>
            <select id="providerSelect"><option value="">— 请选择 —</option></select>
          </div>
          <div class="form-group" style="margin:0">
            <label>API名称</label>
            <select id="configSelect"><option value="">— 请选择 —</option></select>
          </div>
          <div class="form-group" style="margin:0">
            <label>模型</label>
            <select id="modelSelect"><option value="">— 请选择 —</option></select>
          </div>
        </div>
        <div class="messages" id="messages">
          <p class="empty-hint">发送消息开始对话</p>
        </div>
        <div class="input-area">
          <div class="attachments-row" id="attachmentsRow"></div>
          <div class="input-row">
            <textarea id="userInput" placeholder="输入消息… (Enter 发送，Shift+Enter 换行)"></textarea>
            <input type="file" id="fileInput" multiple
                   accept="image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain,text/csv,text/markdown,.md"
                   style="display:none">
            <button class="btn btn-secondary" id="attachBtn" title="附加文件">📎</button>
            <button class="btn btn-primary"   id="sendBtn">发送</button>
            <button class="btn btn-secondary" id="clearBtn">清空</button>
          </div>
          <div class="save-row">
            <span>保存结果到：</span>
            <input id="savePath" placeholder="留空则不保存，如 /Users/me/result.txt">
          </div>
        </div>
      </div>
    </div>

    <!-- ② 批量处理 -->
    <div class="sub-panel" id="panel-batch">
      <iframe src="batch.html?embed=1" id="batchFrame"
              style="width:100%;height:calc(100vh - 96px);border:none;display:block"></iframe>
    </div>

    <!-- ③ 历史记录 -->
    <div class="sub-panel" id="panel-history">
      <iframe src="history.html?embed=1" id="historyFrame"
              style="width:100%;height:calc(100vh - 96px);border:none;display:block"></iframe>
    </div>

  </div>
</div>

<script type="module">
import { initSidebar } from '../assets/js/sidebar.js';
import { requireLogin, getUser, refreshUser, authHeaders, logout } from '../assets/js/auth.js';
import { streamChat, fetchModels } from '../assets/js/stream.js';

if (!requireLogin()) throw new Error('redirect');
initSidebar();

const user = await refreshUser();
document.getElementById('userBar').innerHTML = `
  <span class="username">${user.username}${user.role === 'admin' ? '（管理员）' : ''}</span>
  <button class="logout" id="logoutBtn">退出</button>`;
document.getElementById('logoutBtn').addEventListener('click', () => logout());
if (user.role === 'admin') { const l = document.getElementById('usersLink'); if (l) l.style.display = 'block'; const k = document.getElementById('keysLink'); if (k) k.style.display = 'block'; }

// ── 子界面 Tab 切换 ────────────────────────────────────────
document.querySelectorAll('.sub-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

const messagesEl     = document.getElementById('messages');
const userInput      = document.getElementById('userInput');
const sendBtn        = document.getElementById('sendBtn');
const clearBtn       = document.getElementById('clearBtn');
const providerSelect = document.getElementById('providerSelect');
const configSelect   = document.getElementById('configSelect');
const modelSelect    = document.getElementById('modelSelect');
const attachmentsRow = document.getElementById('attachmentsRow');
const fileInput      = document.getElementById('fileInput');
const attachBtn      = document.getElementById('attachBtn');
const savePath       = document.getElementById('savePath');

const ACCEPTED_TYPES = {
  'image/jpeg':'image','image/png':'image','image/gif':'image','image/webp':'image',
  'application/pdf':'document','text/plain':'document','text/csv':'document','text/markdown':'document',
};
const MAX_SIZE = 20 * 1024 * 1024;
let history = [];
let attachments = [];
let currentSessionId = null;

async function ensureSession(firstMessageText) {
  if (currentSessionId) return;
  try {
    const res = await fetch('http://localhost:8000/sessions', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        config_id: configSelect.value ? parseInt(configSelect.value) : null,
        model: modelSelect.value,
        title: firstMessageText.slice(0, 50),
      }),
    });
    const data = await res.json();
    currentSessionId = data.session_id;
  } catch(e) { console.error('创建会话失败', e); }
}

async function saveMessage(role, content) {
  if (!currentSessionId) return;
  const text = typeof content === 'string' ? content : JSON.stringify(content);
  fetch('http://localhost:8000/sessions/messages', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify({ session_id: currentSessionId, role, content: text }),
  }).catch(() => {});
}

// 已授权配置全量缓存
let _approvedList = [];

async function loadApprovedConfigs() {
  try {
    const res = await fetch('http://localhost:8000/api-requests/approved', { headers: authHeaders() });
    _approvedList = await res.json();
    if (!_approvedList.length) {
      providerSelect.innerHTML = '<option value="">— 暂无可用 API，请先申请 —</option>';
      configSelect.innerHTML   = '<option value="">—</option>';
      setInputEnabled(false);
      messagesEl.innerHTML = `<div class="no-api-hint">
        <p>暂无可用 API</p>
        <p><a href="apply.html">前往申请 →</a></p>
      </div>`;
      return;
    }
    // 填充供应商（去重）
    const providers = [...new Set(_approvedList.map(c => c.provider))];
    providerSelect.innerHTML = '<option value="">— 请选择 —</option>' +
      providers.map(p => `<option value="${p}">${p}</option>`).join('');
    configSelect.innerHTML = '<option value="">— 请选择 —</option>';
  } catch(e) { console.error(e); }
}

// 供应商变化 → 筛选 API名称
providerSelect.addEventListener('change', () => {
  const p = providerSelect.value;
  const filtered = _approvedList.filter(c => c.provider === p);
  configSelect.innerHTML = filtered.length
    ? '<option value="">— 请选择 —</option>' + filtered.map(c => `<option value="${c.id}">${c.name}</option>`).join('')
    : '<option value="">— 暂无可用 —</option>';
  modelSelect.innerHTML = '<option value="">— 请选择 —</option>';
});

// API名称变化 → 加载模型
configSelect.addEventListener('change', () => loadModelsForConfig(configSelect.value));

async function loadModelsForConfig(configId) {
  if (!configId) { modelSelect.innerHTML = '<option value="">— 请选择 —</option>'; return; }
  modelSelect.innerHTML = '<option value="">— 加载中 —</option>';
  try {
    const res  = await fetch(`http://localhost:8000/configs/${configId}/models`);
    const data = await res.json();
    modelSelect.innerHTML = data.models?.length
      ? data.models.map(m => `<option value="${m}">${m}</option>`).join('')
      : '<option value="">— 该配置暂无可用模型 —</option>';
  } catch(e) {
    modelSelect.innerHTML = '<option value="">— 加载失败 —</option>';
  }
}

loadApprovedConfigs();

function addBubble(role, text = '') {
  const empty = messagesEl.querySelector('.empty-hint, .no-api-hint');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = `bubble bubble-${role}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addError(msg) {
  const div = document.createElement('div');
  div.className = 'bubble bubble-error';
  div.textContent = msg;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error(`文件读取失败：${file.name}`));
    reader.readAsDataURL(file);
  });
}

async function processFiles(files) {
  for (const file of files) {
    if (file.type.startsWith('video/')) { addError('不支持视频文件'); continue; }
    if (!ACCEPTED_TYPES[file.type]) { addError(`不支持的文件类型：${file.name}`); continue; }
    if (file.size > MAX_SIZE) { addError(`文件超过 20MB：${file.name}`); continue; }
    try {
      const base64 = await readFileAsBase64(file);
      attachments.push({ name: file.name, mimeType: file.type, base64 });
      renderAttachments();
    } catch (err) { addError(err.message); }
  }
}

function renderAttachments() {
  attachmentsRow.innerHTML = '';
  attachments.forEach((att, i) => {
    const icon = att.mimeType.startsWith('image/') ? '🖼️' : '📄';
    const tag = document.createElement('div');
    tag.className = 'attachment-tag';
    const span = document.createElement('span'); span.textContent = `${icon} ${att.name}`;
    const btn = document.createElement('button'); btn.textContent = '✕';
    btn.addEventListener('click', () => { attachments.splice(i,1); renderAttachments(); });
    tag.appendChild(span); tag.appendChild(btn);
    attachmentsRow.appendChild(tag);
  });
}

function setInputEnabled(enabled) {
  userInput.disabled = !enabled;
  sendBtn.disabled   = !enabled;
  attachBtn.disabled = !enabled;
  fileInput.disabled = !enabled;
}

async function send() {
  const text = userInput.value.trim();
  if (!text && attachments.length === 0) return;
  if (!providerSelect.value) { addError('请先选择供应商'); return; }
  if (!configSelect.value)  { addError('请选择 API 名称'); return; }
  if (!modelSelect.value)   { addError('请选择模型'); return; }

  userInput.value = '';
  let content;
  if (attachments.length === 0) {
    content = text;
  } else {
    content = [];
    if (text) content.push({ type:'text', text });
    for (const att of attachments) {
      if (att.mimeType.startsWith('image/'))
        content.push({ type:'image', source:{ type:'base64', media_type:att.mimeType, data:att.base64 } });
      else if (att.mimeType === 'application/pdf')
        content.push({ type:'document', source:{ type:'base64', media_type:'application/pdf', data:att.base64 } });
      else
        content.push({ type:'document', source:{ type:'text', media_type:'text/plain', data:atob(att.base64) } });
    }
  }

  addBubble('user', text + (attachments.length > 0 ? `\n[📎 ${attachments.length} 个附件]` : ''));
  history.push({ role:'user', content });
  attachments = []; renderAttachments();

  // 创建会话（首条消息时）并保存用户消息
  await ensureSession(text);
  saveMessage('user', typeof content === 'string' ? content : text);

  setInputEnabled(false);
  const bubble = addBubble('assistant');
  bubble.classList.add('cursor');
  let accumulated = '';

  await streamChat({
    messages:   history,
    model:      modelSelect.value,
    system:     '',
    config_id:  parseInt(configSelect.value),
    user_token: (await import('../assets/js/auth.js')).getToken(),
    onToken(chunk) {
      accumulated += chunk;
      bubble.textContent = accumulated;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    },
    onDone() {
      bubble.classList.remove('cursor');
      history.push({ role:'assistant', content: accumulated });
      saveMessage('assistant', accumulated);
      setInputEnabled(true);
      userInput.focus();
      // 保存结果到文件
      const path = savePath.value.trim();
      if (path && accumulated) {
        fetch('http://localhost:8000/save-result', {
          method: 'POST',
          headers: { ...authHeaders() },
          body: JSON.stringify({ path, content: accumulated }),
        }).catch(() => {});
      }
    },
    onError(err) {
      bubble.remove(); history.pop();
      addError(err); setInputEnabled(true);
    },
  });
}

sendBtn.addEventListener('click', send);
userInput.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
clearBtn.addEventListener('click', () => {
  history = []; attachments = []; renderAttachments();
  currentSessionId = null;
  messagesEl.innerHTML = '<p class="empty-hint">发送消息开始对话</p>';
});
attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { processFiles([...fileInput.files]); fileInput.value=''; });
messagesEl.addEventListener('dragover', e => { e.preventDefault(); messagesEl.classList.add('drag-over'); });
messagesEl.addEventListener('dragleave', () => messagesEl.classList.remove('drag-over'));
messagesEl.addEventListener('drop', e => { e.preventDefault(); messagesEl.classList.remove('drag-over'); processFiles([...e.dataTransfer.files]); });
</script>
</body>
</html>
