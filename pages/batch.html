<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批量处理 — 数据平台</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
  <script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed-mode');</script>
  <!-- xlsx 库改为按需懒加载(原同步引入 ≈944KB 阻塞首屏);见 ensureXLSX() -->
  <script>
    window.ensureXLSX = function () {
      if (window.XLSX) return Promise.resolve();
      if (window._xlsxLoading) return window._xlsxLoading;
      window._xlsxLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
        s.onload  = () => resolve();
        s.onerror = () => { window._xlsxLoading = null; reject(new Error('xlsx 加载失败')); };
        document.head.appendChild(s);
      });
      return window._xlsxLoading;
    };
  </script>
  <!-- Monaco Editor（懒加载，进入脚本 Tab 时初始化）-->
  <script>var require = { paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } };</script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <style>
    html.embed-mode .top-bar,
    html.embed-mode .breadcrumb,
    html.embed-mode .sidebar { display: none !important; }
    /* 嵌入(iframe)模式下,父页面已有「在线使用/批量处理」sub-tab,这里隐藏空的 .toolbar
       并压缩 .main 顶部 padding,把"批量处理 sub-tab"与"前端配置 tab"间距缩到 ≈10px */
    html.embed-mode .toolbar { display: none !important; }
    html.embed-mode .layout { padding-top: 0 !important; }
    html.embed-mode .main { margin-left: 0 !important; padding: 10px 16px 16px !important; }

    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab-btn {
      padding: 10px 24px; font-size: .9rem; cursor: pointer;
      border: none; background: none; color: var(--text-muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--green); border-bottom-color: var(--green); font-weight: 500; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .field-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .field-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px; font-size: .85rem; cursor: pointer;
      border: 1px solid var(--border); background: #fff; color: var(--text-muted);
      transition: all .15s;
    }
    .field-chip.selected { background: var(--green-bg); border-color: var(--green); color: var(--green); font-weight: 500; }

    .preview-table { max-height: 220px; overflow: auto; margin-top: 12px; }
    .progress-bar-wrap { background: var(--surface); border-radius: 6px; height: 10px; margin: 10px 0; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--green); border-radius: 6px; transition: width .3s; }

    .result-status-ok  { color: var(--green); font-size: .8rem; }
    .result-status-err { color: #dc2626; font-size: .8rem; }
    .result-status-ing { color: #f59e0b; font-size: .8rem; }

    .template-help { font-size: .8rem; color: var(--text-muted); margin-top: 6px; }
    code { background: var(--surface); padding: 1px 5px; border-radius: 3px; font-size: .85em; }

    .section-title { font-size: .92rem; font-weight: 500; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .section-title:first-child { margin-top: 0; }

    /* ── 数据来源切换 (文件 / 数据集) ────────────────────── */
    .src-toggle {
      display:flex; gap:0; margin-bottom:10px;
      border:1px solid var(--border); border-radius:var(--radius);
      overflow:hidden; width:fit-content;
    }
    .src-toggle-btn {
      padding:6px 14px; font-size:.85rem; cursor:pointer;
      border:none; background:#fff; color:var(--text-muted);
    }
    .src-toggle-btn.active { background:var(--green-bg); color:var(--green); font-weight:500; }
    .src-toggle-btn + .src-toggle-btn { border-left:1px solid var(--border); }
    .dataset-meta { font-size:.78rem; color:var(--text-muted); margin-top:6px; }

    /* ── 表单校验红色提示 ────────────────────────────────── */
    .field-invalid { border-color: #dc2626 !important; box-shadow: 0 0 0 2px rgba(220,38,38,.12); }
    label.field-invalid, .section-title.field-invalid { color: #dc2626; border-bottom-color: #dc2626; }

    .history-list-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .history-list-item:hover { background: var(--surface); }

    /* ── 历史 - 状态徽章 / 进度条 / 缩略图 ─────────────────── */
    .status-badge {
      display:inline-block; padding:2px 8px; border-radius:10px;
      font-size:.72rem; font-weight:500; white-space:nowrap;
    }
    .status-badge.queued    { background:#e5e7eb; color:#4b5563; }
    .status-badge.running   { background:#fef3c7; color:#92400e; }
    .status-badge.completed { background:var(--green-bg); color:var(--green); }
    .status-badge.failed    { background:#fee2e2; color:#dc2626; }
    .status-badge.partial   { background:#ffedd5; color:#c2410c; }
    .mini-progress {
      width:130px; height:8px; background:var(--surface); border-radius:5px;
      overflow:hidden; display:inline-block; vertical-align:middle;
    }
    .mini-progress > div { height:100%; background:var(--green); transition:width .3s; }
    .img-thumb {
      width:48px; height:48px; object-fit:cover; border-radius:4px;
      cursor:zoom-in; border:1px solid var(--border); margin:2px;
      transition:transform .15s;
    }
    .img-thumb:hover { transform:scale(1.5); z-index:10; position:relative; box-shadow:0 4px 12px rgba(0,0,0,.3); }
    .img-thumb.broken {
      background:repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 6px,#e5e7eb 6px,#e5e7eb 12px);
      display:inline-block; cursor:default;
    }
    #historyTable th, #historyTable td { padding:8px 10px; font-size:.85rem; }
    #historyTable thead th.sortable { cursor:pointer; user-select:none; white-space:nowrap; }
    #historyTable thead th.sortable:hover { background:var(--surface); }
    #historyTable thead th.sortable .sort-ind {
      display:inline-block; margin-left:4px;
      font-size:.7rem; opacity:.35; color:var(--text-muted);
    }
    #historyTable thead th.sortable.sort-asc  .sort-ind { opacity:1; color:var(--green); }
    #historyTable thead th.sortable.sort-desc .sort-ind { opacity:1; color:var(--green); }
    #historyTable thead .filter-row th { padding:4px 6px; background:var(--surface); }
    #historyTable thead .filter-row input,
    #historyTable thead .filter-row select {
      width:100%; padding:3px 6px; font-size:.75rem;
      border:1px solid var(--border); border-radius:4px; background:#fff;
      box-sizing:border-box; font-family:inherit; color:var(--text);
    }

    .row-failed { background:#fef2f2; }
    .row-failed:hover { background:#fee2e2; }
    .copy-btn {
      padding:2px 6px; font-size:.7rem; border:1px solid var(--border);
      background:#fff; border-radius:3px; cursor:pointer; color:var(--text-muted);
    }
    .copy-btn:hover { background:var(--surface); color:var(--text); }

    /* ── 前端配置 (与脚本配置同款左右双栏) ──────────────────── */
    #tab-click-config.active { display: flex; flex-direction: column; }
    #tab-click-config { height: calc(100vh - 200px); min-height: 460px; }
    .click-layout { display:flex; height:100%; }
    .click-left {
      width:50%; min-width:320px; display:flex; flex-direction:column;
      border-right:1px solid var(--border); padding:12px 16px; gap:8px; overflow-y:auto;
    }
    .click-left .section-title { margin-top: 12px; }
    .click-left .section-title:first-child { margin-top: 0; }
    .click-right { flex:1; display:flex; flex-direction:column; min-width:0; }
    .click-out-tabs { display:flex; border-bottom:1px solid var(--border); background:#fff; flex-shrink:0; }
    .click-out-tab {
      padding:8px 16px; font-size:.85rem; cursor:pointer; border:none; background:none;
      color:var(--text-muted); border-bottom:2px solid transparent;
    }
    .click-out-tab.active { color:var(--green); border-bottom-color:var(--green); font-weight:500; }
    .click-out-panel { display:none; flex:1; overflow:hidden; flex-direction:column; }
    .click-out-panel.active { display:flex; }
    .click-log {
      flex:1; overflow-y:auto; padding:12px 16px;
      font-family:monospace; font-size:.82rem; line-height:1.6;
      background:var(--surface); white-space:pre-wrap; word-break:break-word;
    }
    .click-progress { padding: 10px 16px; border-bottom: 1px solid var(--border); background: #fff; flex-shrink: 0; }

    /* ── 脚本编辑器 ──────────────────────────────────────── */
    #tab-script.active { display: flex; flex-direction: column; }
    #tab-script { height: calc(100vh - 200px); min-height: 460px; }
    .script-layout { display:flex; height:100%; }
    .script-left {
      width:50%; min-width:300px; display:flex; flex-direction:column;
      border-right:1px solid var(--border); padding:10px; gap:8px; overflow:hidden;
    }
    .script-right { flex:1; display:flex; flex-direction:column; min-width:0; }
    .script-config { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; flex-shrink:0; }
    .script-config .form-group label { font-size:.74rem; }
    .script-editor-container {
      flex:1; min-height:0; border:1px solid var(--border);
      border-radius:var(--radius); overflow:hidden;
    }
    .script-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; padding-top:2px; }
    .script-out-tabs { display:flex; border-bottom:1px solid var(--border); background:#fff; flex-shrink:0; }
    .script-out-tab {
      padding:8px 16px; font-size:.85rem; cursor:pointer; border:none; background:none;
      color:var(--text-muted); border-bottom:2px solid transparent;
    }
    .script-out-tab.active { color:var(--green); border-bottom-color:var(--green); font-weight:500; }
    .script-out-panel { display:none; flex:1; overflow:hidden; flex-direction:column; }
    .script-out-panel.active { display:flex; }
    .script-log {
      flex:1; overflow-y:auto; padding:12px 16px;
      font-family:monospace; font-size:.82rem; line-height:1.6;
      background:var(--surface); white-space:pre-wrap; word-break:break-word;
    }
    .log-stdout { color:var(--text); }
    .log-stderr { color:#e06c75; }
    .log-error  { color:#dc2626; }
    .log-info   { color:#6b7280; font-style:italic; }
    .script-log img   { max-width:100%; border-radius:6px; margin:4px 0; cursor:zoom-in; display:block; }
    .script-log video { max-width:100%; border-radius:6px; margin:4px 0; display:block; }
    .script-file-badge {
      background:var(--green); color:#fff; border-radius:10px;
      font-size:.7rem; padding:0 5px; margin-left:4px; min-width:16px;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .result-file-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px; border-bottom:1px solid var(--border); font-size:.83rem;
    }
    .result-file-item .file-name { flex:1; font-family:monospace; word-break:break-all; }
    .result-file-item .file-size { color:var(--text-muted); font-size:.75rem; flex-shrink:0; }
  </style>
</head>
<body>

<div class="layout">
  <div class="main">
    <div class="breadcrumb">
      <a href="#">三方API管理</a>
      <span class="sep">›</span>
      <span class="current">批量处理</span>
    </div>
    <div class="toolbar">
      <span class="page-title" style="margin:0">批量处理</span>
    </div>

    <!-- Tab 导航 -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="click-config">前端配置</button>
      <button class="tab-btn" data-tab="script">脚本配置</button>
      <button class="tab-btn" data-tab="history">任务列表</button>
    </div>

    <!-- Tab 1: 点击配置 -->
    <div class="tab-panel active" id="tab-click-config">
      <div class="click-layout">
        <!-- 左侧:配置 -->
        <div class="click-left">
          <div class="section-title">任务名称</div>
          <div class="form-group" style="margin-bottom:4px">
            <input id="taskName" autocomplete="off" placeholder="例如 2026-05-18_产品评论分析（留空则用 YYYY-MM-DD_NA）">
          </div>

          <div class="section-title" style="margin-top:6px">数据来源</div>
          <div class="src-toggle" id="clickSrcToggle">
            <button type="button" class="src-toggle-btn active" data-src="file">📂 上传文件</button>
            <button type="button" class="src-toggle-btn" data-src="dataset">📊 已有数据集</button>
          </div>
          <div id="clickFileSrc">
            <div class="form-group">
              <label>选择文件 <span style="color:var(--text-muted);font-weight:400">（支持 CSV / Excel / JSON / Parquet）</span></label>
              <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.json,.parquet" style="padding:6px">
            </div>
            <div id="fileInfo" style="font-size:.85rem;color:var(--text-muted);margin-top:8px"></div>
          </div>
          <div id="clickDatasetSrc" style="display:none">
            <div class="form-group">
              <label>选择数据集</label>
              <select id="clickDatasetSel"><option value="">— 请选择 —</option></select>
            </div>
            <div id="clickDatasetInfo" class="dataset-meta"></div>
          </div>
          <div class="preview-table" id="previewTable"></div>

          <div class="section-title">选择字段</div>
          <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:8px">选择要作为 AI 输入的字段（可多选）：</p>
          <div class="field-list" id="fieldList"></div>

          <div class="section-title">API 配置</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
            <div class="form-group" style="margin:0">
              <label>供应商</label>
              <select id="providerSelect"><option value="">— 请选择 —</option></select>
            </div>
            <div class="form-group" style="margin:0">
              <label>API名称</label>
              <select id="configSelect"><option value="">— 请选择 —</option></select>
            </div>
            <div class="form-group" style="margin:0">
              <label>模型</label>
              <select id="modelSelect"><option value="">— 请选择 —</option></select>
            </div>
          </div>
          <div class="form-group" style="margin-top:16px">
            <label>Prompt 模板</label>
            <textarea id="promptTemplate" rows="4"
              placeholder="使用 {字段名} 引用字段，例如：&#10;请分析以下评论的情感倾向：{评论内容}&#10;产品名称：{产品名}"></textarea>
            <div class="template-help">可用字段：<span id="availableFields">—</span></div>
          </div>

          <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-primary" id="startBatchBtn" disabled>开始批跑</button>
            <button class="btn btn-secondary" id="stopBtn" style="display:none">暂停</button>
            <button class="btn btn-primary" id="exportBtn" style="display:none">导出 CSV</button>
          </div>
        </div>

        <!-- 右侧:运行日志 / 结果 -->
        <div class="click-right">
          <div class="click-out-tabs">
            <button class="click-out-tab active" data-cout="log">运行日志</button>
            <button class="click-out-tab" data-cout="result">结果文件</button>
          </div>
          <div class="click-out-panel active" id="clickOutLog">
            <div class="click-progress" id="batchProgressCard" style="display:none">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span style="font-size:.9rem;font-weight:500" id="progressText">准备中…</span>
                <span style="font-size:.82rem;color:var(--text-muted)" id="progressDetail"></span>
              </div>
              <div class="progress-bar-wrap" style="margin:0"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
            </div>
            <div class="click-log" id="batchLog">
              <span style="color:var(--text-muted);font-size:.82rem">点击「开始批跑」后输出将显示在这里</span>
            </div>
          </div>
          <div class="click-out-panel" id="clickOutResult">
            <div id="batchResultCard" style="flex:1;overflow:auto">
              <table id="resultTable" style="width:100%">
                <thead id="resultHead"></thead>
                <tbody id="resultBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 3: 脚本编辑器 -->
    <div class="tab-panel" id="tab-script">
      <div class="script-layout">
        <div class="script-left">
          <div class="form-group" style="margin:0;flex-shrink:0">
            <label style="font-size:.74rem">任务名称</label>
            <input id="scriptTaskName" autocomplete="off" placeholder="例如 2026-05-18_产品评论分析（留空则用 YYYY-MM-DD_NA）">
          </div>
          <div id="scriptFileArea">
            <div class="src-toggle" id="scriptSrcToggle">
              <button type="button" class="src-toggle-btn active" data-src="file">📂 上传文件</button>
              <button type="button" class="src-toggle-btn" data-src="dataset">📊 已有数据集</button>
            </div>
            <div id="scriptFileSrc">
              <div class="form-group">
                <label>选择文件 <span style="color:var(--text-muted);font-weight:400">（支持CSV、excel、JSON、Parquet）</span></label>
                <input type="file" id="scriptFileInput"
                       accept=".csv,.xlsx,.xls,.json,.parquet" style="padding:6px">
              </div>
              <div id="scriptFileInfo" style="font-size:.85rem;color:var(--text-muted);margin-top:8px"></div>
            </div>
            <div id="scriptDatasetSrc" style="display:none">
              <div class="form-group" style="margin:0">
                <select id="scriptDatasetSel" style="width:100%">
                  <option value="">— 请选择数据集 —</option>
                </select>
              </div>
              <div id="scriptDatasetInfo" class="dataset-meta"></div>
            </div>
          </div>
          <div class="script-config">
            <div class="form-group" style="margin:0">
              <label>供应商</label>
              <select id="scriptProviderSel"><option value="">— 请选择 —</option></select>
            </div>
            <div class="form-group" style="margin:0">
              <label>API名称</label>
              <select id="scriptConfigSel"><option value="">— 请选择 —</option></select>
            </div>
            <div class="form-group" style="margin:0">
              <label>模型</label>
              <select id="scriptModelSel"><option value="">— 请选择 —</option></select>
            </div>
          </div>
          <div id="scriptEditorContainer" class="script-editor-container"></div>
          <div class="script-actions">
            <button class="btn btn-primary"   id="scriptRunBtn">▶ 运行</button>
            <button class="btn btn-secondary" id="scriptStopBtn" style="display:none">■ 停止</button>
            <button class="btn btn-secondary" id="scriptLintBtn">语法检查</button>
            <button class="btn btn-secondary" id="scriptClearBtn">🗑 清空输出</button>
            <span id="scriptTimer" style="font-size:.8rem;color:var(--text-muted)"></span>
          </div>
        </div>
        <div class="script-right">
          <div class="script-out-tabs">
            <button class="script-out-tab active" data-out="log">运行日志</button>
            <button class="script-out-tab" data-out="files">
              结果文件
              <span id="scriptFileBadge" class="script-file-badge" style="display:none"></span>
            </button>
          </div>
          <div class="script-out-panel active" id="scriptOutLog">
            <div class="script-log" id="scriptLog">
              <span style="color:var(--text-muted);font-size:.82rem">运行后输出将显示在这里</span>
            </div>
          </div>
          <div class="script-out-panel" id="scriptOutFiles">
            <div id="scriptResultFiles" style="flex:1;overflow-y:auto">
              <p style="color:var(--text-muted);font-size:.82rem;padding:16px">暂无结果文件</p>
            </div>
            <div id="scriptDownloadAll" style="display:none;padding:8px 12px;border-top:1px solid var(--border)">
              <button class="btn btn-primary" id="scriptDlAllBtn" style="font-size:.82rem">
                ↓ 打包下载全部
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 4: 处理历史 -->
    <div class="tab-panel" id="tab-history">
      <div id="historyListView">
        <div class="card" style="padding:0;overflow:hidden">
          <div style="padding:8px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:flex-end;align-items:center;gap:8px">
            <span id="historyAutoHint" style="font-size:.78rem;color:var(--text-muted)"></span>
            <button class="btn btn-secondary" id="refreshHistoryBtn" style="padding:4px 12px">刷新</button>
          </div>
          <div class="table-wrap" style="max-height:560px;overflow:auto">
            <table id="historyTable">
              <thead>
                <tr>
                  <th class="sortable" data-sort="batch_id">任务ID<span class="sort-ind">↕</span></th>
                  <th class="sortable" data-sort="task_name">任务名称<span class="sort-ind">↕</span></th>
                  <th class="sortable" data-sort="source_type">来源<span class="sort-ind">↕</span></th>
                  <th class="sortable" data-sort="model">模型<span class="sort-ind">↕</span></th>
                  <th class="sortable" data-sort="status">状态<span class="sort-ind">↕</span></th>
                  <th class="sortable" data-sort="progress" style="min-width:200px">进度<span class="sort-ind">↕</span></th>
                  <th class="sortable" data-sort="created_at">创建时间<span class="sort-ind">↕</span></th>
                  <th style="min-width:240px">操作</th>
                </tr>
                <tr class="filter-row">
                  <th><input class="hd-filter" data-filter="batch_id" placeholder="过滤…"></th>
                  <th><input class="hd-filter" data-filter="task_name" placeholder="过滤…"></th>

<script type="module">
import { initSidebar } from '../assets/js/sidebar.js';

// ── Tab 切换 ─────────────────────────────────────────────
let _navRestoring = false;   // restoreFromHash 期间为 true,避免回写 hash
function updateHash(patch) {
  if (_navRestoring) return;
  const sp = new URLSearchParams(location.hash.slice(1));
  for (const [k, v] of Object.entries(patch)) {
    if (v == null || v === '') sp.delete(k);
    else sp.set(k, v);
  }
  const s = sp.toString();
  const newHash = s ? ('#' + s) : '';
  if (location.hash !== newHash) {
    history.replaceState(null, '', location.pathname + location.search + newHash);
  }
  // 作为 iframe 嵌入时,通知父页持久化(用于跨刷新恢复 iframe 内部状态)
  if (window.parent !== window) {
    try { window.parent.postMessage({ type: 'batch-hash', hash: newHash }, '*'); } catch {}
  }
}

// ── 历史回填模式：仅由"任务列表→配置按钮"激活；任何 Tab 切换或 ESC 都会清空 ──
let _inHistoricalView = false;
let _loadingFromHistory = false;

function exitHistoricalView() {
  if (!_inHistoricalView) return;
  // 清前端配置
  try {
    resetClickConfigForm();
    const ps = document.getElementById('providerSelect');
    if (ps) { ps.value = ''; ps.dispatchEvent(new Event('change')); }
    const cs = document.getElementById('configSelect');
    if (cs) cs.value = '';
    const ms = document.getElementById('modelSelect');
    if (ms) ms.value = '';
  } catch {}
  // 清脚本配置
  try {
    window._resetScriptEditor?.();
    const sps = document.getElementById('scriptProviderSel');
    if (sps) { sps.value = ''; sps.dispatchEvent(new Event('change')); }
    const scs = document.getElementById('scriptConfigSel');
    if (scs) scs.value = '';
    const sms = document.getElementById('scriptModelSel');
    if (sms) sms.value = '';
    window._uploadedFileId = null;
    const sfInfo = document.getElementById('scriptFileInfo');
    if (sfInfo) { sfInfo.textContent = ''; sfInfo.style.color = ''; }
    const sfInput = document.getElementById('scriptFileInput');
    if (sfInput) sfInput.value = '';
    window._clearScriptOutput?.();
  } catch {}
  _inHistoricalView = false;
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (_inHistoricalView && !_loadingFromHistory) exitHistoricalView();
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'history') loadHistory();
    updateHash({ tab: btn.dataset.tab, detail: null });
  });
});

// ESC：处于历史回填模式时返回任务列表（tab 点击会触发 exitHistoricalView 清空）
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !_inHistoricalView) return;
  // 焦点在输入框/编辑器时跳过，避免打断用户输入
  const t = e.target;
  const tag = (t?.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || t?.isContentEditable) return;
  document.querySelector('.tab-btn[data-tab="history"]')?.click();
});

// ── 点击配置：当前表单 → config_json ────────────────────
function defaultTaskName() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_NA`;
}
function clickConfigJson() {
  const src = window._clickSrcMode || 'file';
  return {
    source: src,
    input_file: src === 'file'    ? (window._currentInputFile || '') : '',
    dataset_id: src === 'dataset' ? (window._currentDatasetId || '') : '',

    prompt_template: document.getElementById('promptTemplate')?.value || '',
    provider: document.getElementById('providerSelect')?.value || '',
    request_id: parseInt(document.getElementById('configSelect')?.value || 0) || null,

// 用历史 job 的 config_json 回填点击配置 Tab
async function loadConfigIntoClickForm(cfg, taskName) {
  resetClickConfigForm();
  document.getElementById('taskName').value = taskName || '';
  document.getElementById('promptTemplate').value = cfg.prompt_template || '';
  selectedFields = cfg.selected_fields || [];
  window._currentInputFile = cfg.input_file || '';
  window._currentDatasetId = cfg.dataset_id || '';
  // 老 job 没 source 字段时,看 dataset_id 兜底
  const inferredSrc = cfg.source || (cfg.dataset_id ? 'dataset' : 'file');
  setClickSrcMode(inferredSrc);
  if (inferredSrc === 'dataset' && cfg.dataset_id) {
    await ensureClickDatasetsLoaded();
    const sel = document.getElementById('clickDatasetSel');
    if (sel) sel.value = cfg.dataset_id;
  }
  document.getElementById('availableFields').innerHTML =
    selectedFields.length ? selectedFields.map(f => `<code>{${f}}</code>`).join(' ') : '—';
  const list = document.getElementById('fieldList');
  list.innerHTML = '';
  selectedFields.forEach(h => {
    const chip = document.createElement('div');
    chip.className = 'field-chip selected'; chip.textContent = h;
    chip.addEventListener('click', () => {
      chip.classList.toggle('selected');
      selectedFields = [...document.querySelectorAll('.field-chip.selected')].map(c => c.textContent);
      document.getElementById('availableFields').innerHTML =
        selectedFields.length ? selectedFields.map(f => `<code>{${f}}</code>`).join(' ') : '—';
      updateStartBtn();
    });
    list.appendChild(chip);
  });
  // 等配置 API 列表加载完成,再回填供应商/API名称/模型,避免下拉为空导致填不上
  if (!_batchConfigs.length) await loadConfigs();
  if (cfg.provider) {
    const ps = document.getElementById('providerSelect');
    ps.value = cfg.provider; ps.dispatchEvent(new Event('change'));
  }
  if (cfg.request_id) {
    const cs = document.getElementById('configSelect');
    cs.value = String(cfg.request_id); cs.dispatchEvent(new Event('change'));
    if (cfg.model) document.getElementById('modelSelect').value = cfg.model;
  }
}

// 用历史 job 的 script_code 回填脚本 Tab
async function loadScriptIntoEditor(scriptCode, taskName, cfg = {}, jobId = null) {
  document.getElementById('scriptTaskName').value = taskName || '';
  if (window.monacoEditor) {
    monacoEditor.setValue(scriptCode || '');
  } else {
    window._pendingScriptCode = scriptCode || '';
  }
  // 用历史 cfg 回填 供应商 / 配置 / 模型 / 文件 / 数据集
  if (cfg && (cfg.provider || cfg.input_file || cfg.dataset_id)) {
    if (window._loadScriptConfigs && !window._getScriptConfigs?.()?.length) {
      await window._loadScriptConfigs();
    }
    if (cfg.provider) {
      const pSel = document.getElementById('scriptProviderSel');
      pSel.value = cfg.provider;
      pSel.dispatchEvent(new Event('change'));   // 同步填充 configSel
      if (cfg.request_id) {
        const cSel = document.getElementById('scriptConfigSel');
        cSel.value = String(cfg.request_id);
        cSel.dispatchEvent(new Event('change')); // 同步填充 modelSel
        if (cfg.model) document.getElementById('scriptModelSel').value = cfg.model;
      }
    }
    const inferredSrc = cfg.source || (cfg.dataset_id ? 'dataset' : 'file');
    if (window.setScriptSrcMode) window.setScriptSrcMode(inferredSrc);
    if (inferredSrc === 'dataset' && cfg.dataset_id) {
      if (window.ensureScriptDatasetsLoaded) await window.ensureScriptDatasetsLoaded();
      const sel = document.getElementById('scriptDatasetSel');
      if (sel) {
        sel.value = cfg.dataset_id;
        window._scriptDatasetId = cfg.dataset_id;
        document.getElementById('scriptDatasetInfo').textContent = '(沿用历史数据集)';
      }
    } else if (cfg.input_file) {
      window._uploadedFileId = cfg.input_file;
      const fi = document.getElementById('scriptFileInfo');
      fi.textContent = `(沿用历史文件: ${cfg.input_file.split('/').pop()})`;
      fi.style.color = '';
    }
  }
  // 默认调出运行日志(从历史拉)
  if (jobId) await loadHistoricalRunLog(jobId);
}

// 拉取历史任务的运行日志,渲染到脚本 Tab 的"运行日志"面板
async function loadHistoricalRunLog(jobId) {
  try {
    const res = await fetch(`http://localhost:8000/batch2/jobs/${jobId}/rows`, { headers: authHeaders() });
    if (!res.ok) return;
    const rows = await res.json();
    window._clearScriptOutput?.();
    // 切到"运行日志" Tab
    document.querySelector('.script-out-tab[data-out="log"]')?.click();
    window._appendScriptLog?.('info', `📜 历史运行日志 · 任务 #${jobId} · 共 ${rows.length} 行\n\n`);
    if (!rows.length) {
      window._appendScriptLog?.('info', '(该任务暂无行级日志)\n');
      return;
    }
    rows.forEach(r => {
      const idx = r.row_index;
      const ts = r.finished_at ? ` [${r.finished_at}]` : '';
      if (r.success) {
        const out = (r.output_text || '').toString();
        window._appendScriptLog?.('stdout', `[行 ${idx}] ✓${ts} ${out}\n`);
      } else {
        window._appendScriptLog?.('error',  `[行 ${idx}] ✗${ts} ${r.error_msg || '(无错误信息)'}\n`);
      }
    });
  } catch(e) {
    window._appendScriptLog?.('error', '加载历史日志失败:' + e.message + '\n');
  }
}

// ── 文件上传 ─────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const isParquet = ext === 'parquet';
  try {
    if (ext === 'csv') rows = await parseCsv(file);
    else if (ext === 'json') rows = await parseJson(file);
    else if (['xlsx','xls'].includes(ext)) rows = await parseExcel(file);
    else if (isParquet) rows = [];               // parquet 本地不解析,等服务器返回列名
    else { alert('不支持的文件格式'); return; }
    headers = rows.length ? Object.keys(rows[0]) : [];
    _inputRowCount = rows.length;
    document.getElementById('fileInfo').textContent = isParquet
      ? '上传中…(parquet 由服务器解析列结构)'
      : `已解析 ${rows.length} 行，${headers.length} 列：${headers.join('、')}`;
    if (!isParquet) {
      renderPreview();
      renderFieldSelector();
    }
    updateStartBtn();

    // 上传到服务器:其他格式拿 file_id,parquet 额外用服务器返回的列名 + 行数补齐 UI
    try {
      const form = new FormData(); form.append('file', file);
      const tk = localStorage.getItem('platform_token') || '';
      const res = await fetch('http://localhost:8000/script/upload', {
        method:'POST', headers:{'X-Token':tk}, body: form,
      });
      if (res.ok) {
        const d = await res.json();
        window._currentInputFile = d.file_id;
        if (isParquet) {
          headers = d.col_names || [];
          _inputRowCount = d.rows || 0;
          document.getElementById('fileInfo').textContent =
            `parquet 已上传:${_inputRowCount} 行,${headers.length} 列:${headers.join('、')}(parquet 暂不显示本地预览)`;
          document.getElementById('previewTable').innerHTML = '';
          renderFieldSelector();
          updateStartBtn();
        }
      } else if (isParquet) {
        document.getElementById('fileInfo').textContent = 'parquet 上传失败,无法继续';
      }
    } catch {
      if (isParquet) document.getElementById('fileInfo').textContent = 'parquet 上传失败,无法继续';
    }
  } catch(e) {
    document.getElementById('fileInfo').textContent = `解析失败：${e.message}`;
  }
});

function parseCsv(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const lines = e.target.result.split('\n').filter(l => l.trim());
      if (!lines.length) { resolve([]); return; }
      const heads = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
      const data = lines.slice(1).map(line => {
        const vals = line.split(',').map(v => v.trim().replace(/^"|"$/g,''));
        return Object.fromEntries(heads.map((h,i) => [h, vals[i]||'']));
      });
      resolve(data);
    };
    reader.onerror = reject;
    reader.readAsText(file, 'utf-8');
  });
}

function parseJson(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        resolve(Array.isArray(d) ? d : [d]);
      } catch(err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsText(file, 'utf-8');
  });
}

async function parseExcel(file) {
  await window.ensureXLSX();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(ws));
      } catch(err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function renderPreview() {
  const preview = rows.slice(0, 5);

    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>

  </table><p style="font-size:.78rem;color:var(--text-muted);margin-top:6px">预览前5行，共${rows.length}行</p>`;
}

window._clickSrcMode = 'file';
window._currentDatasetId = '';

function setClickSrcMode(mode) {
  mode = (mode === 'dataset') ? 'dataset' : 'file';
  window._clickSrcMode = mode;
  document.querySelectorAll('#clickSrcToggle .src-toggle-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.src === mode);
  });
  document.getElementById('clickFileSrc').style.display    = mode === 'file'    ? '' : 'none';
  document.getElementById('clickDatasetSrc').style.display = mode === 'dataset' ? '' : 'none';
  // 清除两侧"上传文件/数据来源" section title 的校验红色提示
  document.querySelectorAll('#tab-click-config .section-title.field-invalid')
    .forEach(t => { if (t.textContent.trim() === '数据来源') t.classList.remove('field-invalid'); });
}

async function ensureClickDatasetsLoaded(force = false) {
  if (_clickDatasetsLoaded && !force) return;
  const sel = document.getElementById('clickDatasetSel');
  if (!sel) return;
  try {
    const res = await fetch('http://localhost:8000/datasets', { headers: authHeaders() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const items = await res.json();
    const prev = sel.value;
    sel.innerHTML = '<option value="">— 请选择 —</option>' + items.map(d => {
      const t = (d.created_at || '').toString().slice(0, 16);
      return `<option value="${d.dataset_id}">${d.name} · ${d.row_count} 行 · ${t}</option>`;
    }).join('');
    if (prev) sel.value = prev;
    _clickDatasetsLoaded = true;
  } catch (e) {
    sel.innerHTML = `<option value="">— 加载失败: ${e.message} —</option>`;
  }
}

document.querySelectorAll('#clickSrcToggle .src-toggle-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const mode = btn.dataset.src;
    setClickSrcMode(mode);
    if (mode === 'dataset') {
      await ensureClickDatasetsLoaded();
      // 切回数据集模式且之前已选,重新刷预览
      const sel = document.getElementById('clickDatasetSel');
      if (sel?.value && window._currentDatasetId === sel.value) {
        await applyClickDataset(sel.value);
      } else if (!sel?.value) {
        // 清空文件残留的预览
        rows = []; headers = []; selectedFields = []; _inputRowCount = 0;
        document.getElementById('previewTable').innerHTML = '';
        document.getElementById('fieldList').innerHTML = '';
        document.getElementById('availableFields').textContent = '—';
        updateStartBtn();

async function startBatch() {
  _clearClickFormValidation();
  const template  = document.getElementById('promptTemplate').value.trim();
  const requestId = document.getElementById('configSelect').value;
  const model     = document.getElementById('modelSelect').value;
  const mode      = window._clickSrcMode || 'file';
  const hasSource = mode === 'dataset'
    ? !!window._currentDatasetId
    : !!window._currentInputFile;
  let invalid = false;
  if (!template)  { _flagFieldInvalid('promptTemplate'); invalid = true; }
  if (!requestId) { _flagFieldInvalid('configSelect');   invalid = true; }
  if (!model)     { _flagFieldInvalid('modelSelect');    invalid = true; }
  if (!hasSource) { _flagFieldInvalid(null, '数据来源'); invalid = true; }
  if (invalid) return;

  document.getElementById('batchProgressCard').style.display = '';
  running = true; stopFlag = false; results = [];

  const resultCols = [...selectedFields, 'AI 结果', '状态'];
  document.getElementById('resultHead').innerHTML =
    `<tr><th>#</th>${resultCols.map(c=>`<th>${c}</th>`).join('')}</tr>`;
  document.getElementById('resultBody').innerHTML = '';
  document.getElementById('stopBtn').style.display = 'inline-flex';
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('stopBtn').textContent = '暂停';
  document.getElementById('exportBtn').style.display = 'none';
  document.getElementById('startBatchBtn').disabled = true;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressText').textContent = '运行中…';
  document.getElementById('progressDetail').textContent = '';
  _currentRunJobId = null;
  // 切到"运行日志" Tab 并清空旧日志
  document.querySelector('.click-out-tab[data-cout="log"]')?.click();
  clearBatchLog();
  appendBatchLog('info', '▶ 开始批跑…\n');

  // 任务名为空时,发送空字符串 —— 后端会用 batch_id 兜底,符合"同任务ID命名规则"
  const taskName = document.getElementById('taskName').value.trim();
  let _ranOk = false;
  try {
    await runBatchWithStreaming({
    source_type: 'click',
    task_name: taskName,
    config_json: JSON.stringify(clickConfigJson()),
    request_id: parseInt(requestId),
    model,
  }, (ev, ctx) => {
    if (ev.type === 'task_started') {
      _currentRunJobId = ev.job_id;
      appendBatchLog('info', `任务已创建 (job_id=${ev.job_id})\n`);
    } else if (ev.type === 'row') {
      const tr = document.createElement('tr');
      const fields = ctx.fields;
      tr.innerHTML = `<td>${ev.idx+1}</td>` +
        fields.map(f => `<td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(String(ev.input?.[f] ?? ''))}</td>`).join('') +
        `<td style="max-width:300px">${escapeHtml(String(ev.output).slice(0,200))}${String(ev.output).length>200?'…':''}</td>` +
        `<td>${ev.success ? '<span class="result-status-ok">完成</span>' : `<span class="result-status-err" title="${escapeHtml(ev.error||'')}">失败</span>`}</td>`;
      document.getElementById('resultBody').appendChild(tr);
      results.push({ ...ev.input, 'AI结果': ev.output, '状态': ev.success?'完成':'失败' });
      ctx.done = (ctx.done||0) + (ev.success?1:0);
      ctx.fail = (ctx.fail||0) + (ev.success?0:1);
      const total = ctx.total || 0;
      const processed = ctx.done + ctx.fail;
      const pct = total > 0 ? Math.round(processed/total*100) : 0;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent = `进度：${processed}${total?' / '+total:''}`;
      document.getElementById('progressDetail').textContent = `完成 ${ctx.done}　失败 ${ctx.fail}`;
      // 同步到右侧日志
      if (ev.success) {
        const preview = String(ev.output ?? '').replace(/\s+/g, ' ').slice(0, 120);
        appendBatchLog('stdout', `[行 ${ev.idx+1}] ✓ ${preview}\n`);
      } else {
        appendBatchLog('error', `[行 ${ev.idx+1}] ✗ ${ev.error || '(无错误信息)'}\n`);
      }
    } else if (ev.type === 'stdout') {
      if (/已加载 (\d+) 行/.test(ev.text || '')) ctx.total = parseInt(RegExp.$1);
      appendBatchLog('stdout', ev.text || '');
    } else if (ev.type === 'stderr') {
      appendBatchLog('stderr', ev.text || '');
    } else if (ev.type === 'error') {
      appendBatchLog('error', ev.text || '');
    }
  }, { fields: selectedFields });
    _ranOk = true;
  } catch (e) {
    let msg = (e && e.message) || String(e);
    try { const j = JSON.parse(msg); msg = j.detail || msg; } catch {}
    appendBatchLog('error', `\n❌ 启动失败：${msg}\n`);
    // 任务名重复 → 高亮任务名输入框
    if (/已存在|已被使用|duplicate/i.test(msg)) {
      _flagFieldInvalid('taskName', '任务名称');
      document.getElementById('taskName')?.focus();
    }
  }

  running = false;
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('startBatchBtn').disabled = false;
  if (_ranOk) {
    document.getElementById('exportBtn').style.display = 'inline-flex';
    document.getElementById('progressText').textContent = `批跑完成：共 ${results.length} 行`;
    appendBatchLog('info', `\n✅ 批跑完成,共 ${results.length} 行\n`);
    // 仅成功完成时清空表单
    resetClickConfigForm();
  } else {
    // 启动失败/中途出错：隐藏进度卡片,但保留用户已填写的内容
    document.getElementById('batchProgressCard').style.display = 'none';
    document.getElementById('progressText').textContent = '准备中…';
  }
}

// ── 公共：调用 /batch2/run 并接受流式事件 ────────────────
async function runBatchWithStreaming(payload, onEvent, ctx = {}) {
  const res = await fetch('http://localhost:8000/batch2/run', {
    method:'POST', headers: authHeaders(),
    body: JSON.stringify(payload),
  });
  if (!res.ok) { throw new Error(await res.text()); }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      try { onEvent(JSON.parse(line.slice(6)), ctx); } catch {}
    }
  }
}

// 后台静默消费流（用于历史页的续跑/重跑,不阻塞 UI）
async function consumeRunStream(res) {
  try {
    const reader = res.body.getReader();
    while (true) {
      const { done } = await reader.read();
      if (done) break;
    }
  } catch {}
}

async function autoSaveResults(format, path, taskName) {
  const keys = Object.keys(results[0] || {});
  let mime, text, binary, ext;
  if (format === 'json') { mime='application/json'; text=JSON.stringify(results,null,2); binary=null; ext='json'; }
  else if (format === 'xlsx') {
    await window.ensureXLSX();
    const ws = XLSX.utils.json_to_sheet(results);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Results');
    binary = XLSX.write(wb, { bookType:'xlsx', type:'array' }); mime='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'; text=''; ext='xlsx';
  } else {
    text = '﻿' + [keys.join(','), ...results.map(r => keys.map(k => `"${String(r[k]??'').replace(/"/g,'""')}"`).join(','))].join('\n');
    mime='text/csv;charset=utf-8'; binary=null; ext='csv';
  }
  const stamp = new Date().toISOString().slice(0,16).replace(/[T:]/g,'-');
  const baseName = `${(taskName||'批跑结果').replace(/[\\/:*?"<>|]/g,'_')}_${stamp}.${ext}`;
  if (!path) {
    const blob = binary ? new Blob([binary],{type:mime}) : new Blob([text],{type:mime});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=baseName; a.click(); return;
  }
  const targetPath = path.endsWith('/')||path.endsWith('\\') ? path+baseName : `${path}/${baseName}`;
  const body = binary
    ? { path:targetPath, encoding:'base64', content: btoa(String.fromCharCode(...new Uint8Array(binary))) }
    : { path:targetPath, encoding:'text', content:text };
  const res = await fetch('http://localhost:8000/save-result', { method:'POST', headers:authHeaders(), body:JSON.stringify(body) });
  if (!res.ok) throw new Error(await res.text());
}

  queued: '排队中', running: '运行中', completed: '已完成',
  failed: '失败', partial_failed: '部分失败',
};
const STATUS_CLASS = {

function statusBadge(s) {
  const cls = STATUS_CLASS[s] || 'queued';

function fmtTime(t) {
  if (!t) return '';
  try { return new Date(t).toLocaleString('zh-CN', { hour12: false }); } catch { return String(t); }
}

function fmtDuration(startIso, endIso) {
  if (!startIso || !endIso) return '—';
  try {
    const ms = new Date(endIso) - new Date(startIso);
    if (ms < 1000) return ms + ' ms';
    if (ms < 60000) return (ms/1000).toFixed(1) + ' s';
    return Math.floor(ms/60000) + ' 分 ' + Math.floor((ms%60000)/1000) + ' 秒';
  } catch { return '—'; }
}

function renderHistoryList() {
  const body = document.getElementById('historyListBody');
  if (!_historyList.length) {
    body.innerHTML = '<tr><td colspan="8" style="padding:20px;text-align:center;color:var(--text-muted)">暂无任务</td></tr>';
    updateSortIndicators();
    return;
  }
  // 取模型字段:优先用顶层 t.model,缺失则回退到 config_json.model
  const getModel = t => t.model || (() => { try { return JSON.parse(t.config_json || '{}').model || ''; } catch { return ''; } })();
  // 过滤
  const filtered = _historyList.filter(t => {
    for (const [f, v] of Object.entries(_historyFilters)) {
      if (!v) continue;
      if (f === 'source_type') {
        const norm = (t.source_type === 'script') ? 'script' : 'click';
        if (norm !== v) return false;
      } else if (f === 'status') {
        if ((t.status || '') !== v) return false;
      } else if (f === 'model') {
        if (!getModel(t).toLowerCase().includes(v.toLowerCase())) return false;
      } else {
        const cell = (t[f] || '').toString().toLowerCase();
        if (!cell.includes(v.toLowerCase())) return false;
      }
    }
    return true;
  });
  // 排序
  const { field, dir } = _historySort;
  const mult = dir === 'asc' ? 1 : -1;
  const sorted = filtered.slice().sort((a, b) => {
    let va, vb;
    if (field === 'progress') {
      va = (a.done_count || 0) + (a.fail_count || 0);
      vb = (b.done_count || 0) + (b.fail_count || 0);
    } else if (field === 'source_type') {
      va = (a.source_type === 'script') ? 'script' : 'click';
      vb = (b.source_type === 'script') ? 'script' : 'click';
    } else if (field === 'model') {
      va = getModel(a); vb = getModel(b);
    } else {
      va = a[field] ?? '';
      vb = b[field] ?? '';
    }
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * mult;
    return String(va).localeCompare(String(vb), 'zh') * mult;
  });

  if (!sorted.length) {
    body.innerHTML = '<tr><td colspan="8" style="padding:20px;text-align:center;color:var(--text-muted)">无匹配任务</td></tr>';
    updateSortIndicators();
    return;
  }
  const tk = encodeURIComponent(localStorage.getItem('platform_token') || '');
  body.innerHTML = sorted.map(t => {
    const total = t.row_count || 0;
    const done  = t.done_count || 0;
    const fail  = t.fail_count || 0;
    const processed = done + fail;
    const pct = total > 0 ? Math.round(processed/total*100) : (t.status === 'completed' ? 100 : 0);
    const dlDisabled = (t.status === 'queued' || processed === 0) ? ' disabled' : '';
    const isDone   = ['completed','failed','partial_failed'].includes(t.status);
    const isRunning = t.status === 'running';
    const isPaused  = t.status === 'paused';
    const sourceLabel = t.source_type === 'script'
      ? '<span style="display:inline-block;padding:1px 8px;border-radius:10px;background:#e0e7ff;color:#3730a3;font-size:.7rem">脚本</span>'
      : '<span style="display:inline-block;padding:1px 8px;border-radius:10px;background:#dcfce7;color:#166534;font-size:.7rem">点击配置</span>';
    const pauseBtn = isRunning
      ? `<button class="btn btn-secondary run-pause-btn" data-id="${t.id}" style="padding:3px 8px;font-size:.72rem">暂停</button>`
      : '';
    const resumeBtn = (isPaused || t.status === 'partial_failed')
      ? `<button class="btn btn-primary run-resume-btn" data-id="${t.id}" style="padding:3px 8px;font-size:.72rem">续跑</button>`
      : '';
    const rerunBtn = isDone
      ? `<button class="btn btn-secondary run-rerun-btn" data-id="${t.id}" style="padding:3px 8px;font-size:.72rem">重跑</button>`
      : '';
    const modelLabel = getModel(t);
    return `
      <tr data-id="${t.id}">
        <td style="font-family:monospace;font-size:.78rem">${escapeHtml(t.batch_id||'—')}</td>
        <td><b>${escapeHtml(t.task_name || 'NA')}</b></td>
        <td>${sourceLabel}</td>
        <td style="font-family:monospace;font-size:.78rem">${escapeHtml(modelLabel || '—')}</td>
        <td>${statusBadge(t.status)}</td>
        <td>
          <span class="mini-progress"><div style="width:${pct}%"></div></span>
          <span style="font-size:.75rem;color:var(--text-muted);margin-left:6px">${processed}/${total}</span>
          <div style="font-size:.7rem;color:var(--text-muted);margin-top:2px">
            <span style="color:var(--green)">✓ ${done}</span>　<span style="color:#dc2626">✗ ${fail}</span>
          </div>
        </td>
        <td style="font-size:.78rem;color:var(--text-muted)">${fmtTime(t.created_at)}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-secondary hd-cfg-btn"  data-id="${t.id}" style="padding:3px 8px;font-size:.72rem">配置</button>
          <button class="btn btn-secondary hd-view-btn" data-id="${t.id}" style="padding:3px 8px;font-size:.72rem">结果</button>
          ${pauseBtn}${resumeBtn}${rerunBtn}
          <a class="btn btn-primary" style="padding:3px 8px;font-size:.72rem;text-decoration:none;display:inline-block${dlDisabled?';opacity:.4;pointer-events:none':''}"
             href="http://localhost:8000/batch2/jobs/${t.id}/export?token=${tk}">下载</a>
        </td>
      </tr>`;
  }).join('');

  body.querySelectorAll('.hd-cfg-btn').forEach(b => {
    b.addEventListener('click', async () => {
      _loadingFromHistory = true;
      try {
        const job = _historyList.find(j => String(j.id) === b.dataset.id);
        if (!job) return;
        const cfg = JSON.parse(job.config_json || '{}');
        if (job.source_type === 'script') {
          document.querySelector('.tab-btn[data-tab="script"]').click();
          await loadScriptIntoEditor(job.script_code || '', job.task_name || '', cfg, job.id);
        } else {
          document.querySelector('.tab-btn[data-tab="click-config"]').click();
          await loadConfigIntoClickForm(cfg, job.task_name || '');
        }
        _inHistoricalView = true;
      } catch(e) {
        console.error('加载配置失败：', e);
      } finally {
        _loadingFromHistory = false;
      }
    });
  });
  body.querySelectorAll('.hd-view-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const job = _historyList.find(j => String(j.id) === btn.dataset.id);
      openHistoryDetail(btn.dataset.id, job ? JSON.stringify(job) : '{}');
    });
  });
  body.querySelectorAll('.run-pause-btn').forEach(b => {
    b.addEventListener('click', async () => {
      if (!confirm('确定暂停？已完成的行保留。')) return;
      try {
        await fetch(`http://localhost:8000/batch2/jobs/${b.dataset.id}/pause`, { method:'POST', headers: authHeaders() });
        loadHistory(true);
      } catch(e) { alert('暂停失败：' + e.message); }
    });
  });
  body.querySelectorAll('.run-rerun-btn').forEach(b => {
    b.addEventListener('click', async () => {
      if (!confirm('用相同配置重新跑一次（创建新批次）？')) return;
      try {
        const res = await fetch(`http://localhost:8000/batch2/jobs/${b.dataset.id}/rerun`, {
          method:'POST', headers: authHeaders(), body: JSON.stringify({})
        });
        if (!res.ok) throw new Error(await res.text());
        consumeRunStream(res);
        setTimeout(() => loadHistory(true), 500);
      } catch(e) { alert('重跑失败：' + e.message); }
    });
  });
  body.querySelectorAll('.run-resume-btn').forEach(b => {
    b.addEventListener('click', async () => {
      if (!confirm('从已完成行之后继续跑（沿用原配置）？')) return;
      try {
        const res = await fetch(`http://localhost:8000/batch2/jobs/${b.dataset.id}/resume`, {
          method:'POST', headers: authHeaders(), body: JSON.stringify({})
        });
        if (!res.ok) throw new Error(await res.text());
        consumeRunStream(res);
        setTimeout(() => loadHistory(true), 500);
      } catch(e) { alert('续跑失败：' + e.message); }
    });
  });

  updateSortIndicators();
}

function updateSortIndicators() {

// ── 图片预览 ───────────────────────────────────────────
function imgPreviewUrl(path) {
  const tk = encodeURIComponent(localStorage.getItem('platform_token') || '');
  return `http://localhost:8000/batch2/local-image?path=${encodeURIComponent(path)}&token=${tk}`;
}
function isImagePath(s) {
  return typeof s === 'string' && /\.(jpe?g|png|gif|webp|bmp)\s*$/i.test(s.trim());
}
function renderInputCell(inputObj, fields) {
  const keys = fields && fields.length ? fields : Object.keys(inputObj);
  return keys.map(f => {
    const v = inputObj[f];
    if (v == null || v === '') return `<div><b>${escapeHtml(f)}:</b> —</div>`;
    if (isImagePath(String(v))) {
      const p = String(v).trim();
      const fname = p.split('/').pop();
      return `<div style="display:flex;align-items:center;gap:8px;margin:2px 0">
        <img class="img-thumb" src="${imgPreviewUrl(p)}" data-full="${escapeHtml(p)}"
             onerror="this.outerHTML='<span class=\\'img-thumb broken\\' title=\\'加载失败\\'></span>'">
        <span style="font-size:.78rem;color:var(--text-muted);word-break:break-all">${escapeHtml(fname)}</span>
      </div>`;
    }
    const text = String(v);
    return `<div style="margin:2px 0"><b>${escapeHtml(f)}:</b> ${escapeHtml(text.length>120 ? text.slice(0,120)+'…' : text)}</div>`;
  }).join('');
}

(function initImageModal() {
  const m = document.getElementById('imgModal');
  const img = document.getElementById('imgModalImg');
  document.addEventListener('click', e => {

      m.style.display = 'flex';

// ── 详情页分页相关 ─────────────────────────────────────
const HD_PAGE_SIZE = 10000;  // 服务端一次拉的上限,基本一次性拿全
let _hdPageOffset = 0;
let _hdTotal = 0;
let _hdHasMore = false;
let _hdColFilters = {};   // {field: 'text', '__output': '...', '__error': '...'}
let _hdRerender = null;   // openHistoryDetail 设置,供 col-filter 触发重渲
let _hdPage = 1;
let _hdPageSize = 25;
let _hdLastFilterSig = ''; // 筛选条件指纹,变化时自动重置到第 1 页

// 给详情表头每个 TH 加列宽拖拽手柄
function installColResizers() {
  const ths = document.querySelectorAll('#hdHead > tr > th');
  ths.forEach((th, idx) => {
    if (idx === ths.length - 1) return; // 最后一列不加
    if (th.querySelector('.col-resizer')) return;
    const handle = document.createElement('div');
    handle.className = 'col-resizer';
    handle.style.cssText = 'position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;user-select:none;z-index:3';
    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      const startX = e.clientX;
      const startW = th.offsetWidth;
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      const onMove = ev => {
        const w = Math.max(40, startW + (ev.clientX - startX));
        th.style.width = w + 'px';
        th.style.minWidth = w + 'px';
        th.style.maxWidth = w + 'px';
      };
      const onUp = () => {
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    th.appendChild(handle);
  });
}

// 详情表格列结构:根据首行 input_json 判断哪些字段是图片路径,将其拆成名称列+缩略图列
function buildColumns(fields, sampleRow) {
  const cols = [];
  for (const f of fields) {
    const v = sampleRow ? sampleRow[f] : null;
    if (v != null && isImagePath(String(v))) {
      cols.push({ field: f, kind: 'imgname',  header: f + '(名称)' });
      cols.push({ field: f, kind: 'imgthumb', header: f + '(缩略)' });
    } else {
      cols.push({ field: f, kind: 'value', header: f });
    }
  }
  return cols;
}

async function openHistoryDetail(jobId, jobStr) {
  document.getElementById('historyListView').style.display = 'none';
  document.getElementById('historyDetailView').style.display = '';
  _historyCurrentDetailId = jobId;
  _historyAllRows = [];
  _hdPageOffset = 0; _hdTotal = 0; _hdHasMore = false;
  _hdColFilters = {};
  _hdPage = 1;
  _hdLastFilterSig = '';
  // 持久化:刷新后能恢复
  try { sessionStorage.setItem('batch_detail_' + jobId, jobStr || '{}'); } catch {}
  updateHash({ tab: 'history', detail: jobId });

  let jobMeta = null;
  try { jobMeta = JSON.parse(jobStr || '{}'); } catch {}
  const isScript = (jobMeta?.source_type === 'script');
  let cfg = {};
  try { cfg = JSON.parse(jobMeta?.config_json || '{}'); } catch {}

  // 动态表头：行号 + 每个字段一列 + 识别结果 + 状态 + 耗时 + 错误信息 + 操作
  const detailFields = isScript ? [] : (cfg.selected_fields || []);
  function renderHdHead(columns) {
    const mkFilterTh = (field, label, baseStyle) => {
      const cur = _hdColFilters[field] || '';
      const inputShow = cur ? '' : 'display:none;';
      return `<th style="${baseStyle};position:relative">
        <div style="display:flex;align-items:center;gap:4px">
          <span style="flex:1">${escapeHtml(label)}</span>
          <button class="col-filter-btn" type="button" data-field="${escapeHtml(field)}" title="筛选"
            style="cursor:pointer;background:none;border:none;color:${cur?'var(--green)':'var(--text-muted)'};font-size:.85rem;padding:0 2px;line-height:1">▾</button>
        </div>
        <input class="col-filter-input" type="text" data-field="${escapeHtml(field)}" placeholder="包含..." value="${escapeHtml(cur)}"
          style="${inputShow}width:100%;margin-top:4px;padding:2px 4px;font-size:.75rem;box-sizing:border-box">
      </th>`;
    };
    const mkStatusTh = (baseStyle) => {
      const cur = _hdColFilters['__status'] || '';
      const inputShow = cur ? '' : 'display:none;';
      return `<th style="${baseStyle};position:relative">
        <div style="display:flex;align-items:center;gap:4px">
          <span style="flex:1">状态</span>
          <button class="col-filter-btn" type="button" data-field="__status" title="筛选"
            style="cursor:pointer;background:none;border:none;color:${cur?'var(--green)':'var(--text-muted)'};font-size:.85rem;padding:0 2px;line-height:1">▾</button>
        </div>
        <select class="col-filter-status" data-field="__status"
          style="${inputShow}width:100%;margin-top:4px;padding:2px 4px;font-size:.75rem;box-sizing:border-box">
          <option value="">全部</option>
          <option value="ok" ${cur==='ok'?'selected':''}>成功</option>
          <option value="err" ${cur==='err'?'selected':''}>失败</option>
        </select>
      </th>`;
    };
    const fieldCols = columns.map(c => {
      if (c.kind === 'imgthumb') {
        return `<th style="width:90px;position:relative">${escapeHtml(c.header)}</th>`;
      }
      return mkFilterTh(c.field, c.header, 'min-width:140px');
    }).join('');
    document.getElementById('hdHead').innerHTML = `<tr>
      <th style="width:80px;position:relative">行号</th>
      ${fieldCols}
      ${mkFilterTh('__output', 'result', 'min-width:280px')}
      ${mkStatusTh('width:80px')}
      <th style="width:80px;position:relative">耗时(s)</th>
      ${mkFilterTh('__error', '错误信息', 'min-width:160px')}
      <th style="width:160px;position:relative">操作</th>
    </tr>`;
    installColResizers();
    // 事件绑定（只绑一次,后续 innerHTML 替换不影响外层元素的 listener）
    const head = document.getElementById('hdHead');
    if (!head._filterBound) {
      head.addEventListener('click', e => {
        const btn = e.target.closest('.col-filter-btn');
        if (!btn) return;
        const inp = btn.closest('th').querySelector('.col-filter-input, .col-filter-status');
        if (!inp) return;
        const hidden = inp.style.display === 'none';
        inp.style.display = hidden ? 'block' : 'none';
        if (hidden) inp.focus();
      });
      let _debounce = 0;
      head.addEventListener('input', e => {
        const inp = e.target.closest('.col-filter-input');
        if (!inp) return;
        const field = inp.dataset.field;
        const val = inp.value.trim();
        if (val) _hdColFilters[field] = val;
        else delete _hdColFilters[field];
        clearTimeout(_debounce);
        _debounce = setTimeout(() => { if (_hdRerender) _hdRerender(); }, 150);
      });
      head.addEventListener('change', e => {
        const sel = e.target.closest('.col-filter-status');
        if (!sel) return;
        const val = sel.value;
        if (val) _hdColFilters['__status'] = val;
        else delete _hdColFilters['__status'];
        // 同步按钮颜色（无需整表重渲表头）
        const th = sel.closest('th');
        const btn = th && th.querySelector('.col-filter-btn');
        if (btn) btn.style.color = val ? 'var(--green)' : 'var(--text-muted)';
        if (_hdRerender) _hdRerender();
      });
      head._filterBound = true;
    }
  }
  // 初始表头(数据未到时):非脚本模式按 selected_fields 列出,均按 value 渲染
  const initialCols = detailFields.map(f => ({ field: f, kind: 'value', header: f }));
  renderHdHead(initialCols);
  const colCount = 6 + initialCols.length;
  document.getElementById('hdBody').innerHTML =
    `<tr><td colspan="${colCount}" style="padding:14px;color:var(--text-muted);text-align:center">加载中…</td></tr>`;

  // 兼容旧调用：loadDetailPage 期望 settings 含 selected_fields/prompt_template
  const settingsForDetail = isScript
    ? { _renderHdHead: renderHdHead, _columns: initialCols }
    : { ...cfg, _renderHdHead: renderHdHead, _columns: initialCols };
  _hdRerender = () => renderDetailRows(settingsForDetail, isScript);
  await loadDetailPage(jobId, settingsForDetail, isScript, true);
}

async function loadDetailPage(jobId, settings, isScript, reset = false) {
  if (reset) { _historyAllRows = []; _hdPageOffset = 0; }
  const fields = (!isScript && settings?.selected_fields) || [];
  const colCount = 6 + fields.length;
  try {
    const res = await fetch(
      `http://localhost:8000/batch2/jobs/${jobId}/rows?offset=${_hdPageOffset}&limit=${HD_PAGE_SIZE}`,
      { headers: authHeaders() });
    if (!res.ok) throw new Error(await res.text());
    const d = await res.json();
    const newRows = d.rows || d;
    _hdTotal = d.total != null ? d.total : (newRows.length + _hdPageOffset);
    _historyAllRows.push(...newRows);
    _hdPageOffset = _historyAllRows.length;
    _hdHasMore = _historyAllRows.length < _hdTotal;
    if (!_historyAllRows.length) {
      document.getElementById('hdBody').innerHTML =
        `<tr><td colspan="${colCount}" style="padding:14px;color:var(--text-muted);text-align:center">无结果</td></tr>`;
      document.getElementById('hdRowCount').textContent = '';
      return;
    }
    // 数据到手后,根据首行 input_json 构建列结构（识别图片字段并拆分）
    if (settings?._renderHdHead && reset) {
      let firstInput = {};
      try { firstInput = JSON.parse((_historyAllRows[0].input_json || '{}').replace(/\bNaN\b/g, 'null').replace(/\b-?Infinity\b/g, 'null')); } catch {}
      const fields = isScript
        ? Object.keys(firstInput).filter(k => k !== '脚本')
        : (settings.selected_fields || []);
      if (isScript) settings._scriptFields = fields;
      settings._columns = buildColumns(fields, firstInput);
      settings._renderHdHead(settings._columns);
    }
    renderDetailRows(settings, isScript);
  } catch(e) {
    document.getElementById('hdBody').innerHTML =
      `<tr><td colspan="${colCount}" style="padding:14px;color:#dc2626;text-align:center">加载失败：${escapeHtml(e.message)}</td></tr>`;
  }
}

function renderDetailRows(settings, isScript) {
  const statusFilter = _hdColFilters['__status'] || '';
  const kw = (document.getElementById('hdSearchInput')?.value || '').trim().toLowerCase();
  const columns = settings?._columns
    || (isScript
        ? (settings?._scriptFields || []).map(f => ({field:f, kind:'value', header:f}))
        : (settings?.selected_fields || []).map(f => ({field:f, kind:'value', header:f})));
  const colCount = 6 + columns.length;
  const body = document.getElementById('hdBody');

  let list = _historyAllRows;
  if (statusFilter === 'ok')  list = list.filter(r => r.success);
  if (statusFilter === 'err') list = list.filter(r => !r.success);
  if (kw) {
    list = list.filter(r =>
      (r.input_json||'').toLowerCase().includes(kw) ||
      (r.output_text||'').toLowerCase().includes(kw)
    );
  }
  // 列筛选（排除 __status，已单独处理）
  const activeColFilters = Object.entries(_hdColFilters).filter(([k,v]) => v && k !== '__status');
  if (activeColFilters.length) {
    list = list.filter(r => {
      let inputObj = {};
      try { inputObj = JSON.parse((r.input_json || '{}').replace(/\bNaN\b/g, 'null').replace(/\b-?Infinity\b/g, 'null')); } catch {}
      for (const [field, fv] of activeColFilters) {
        const needle = String(fv).toLowerCase();
        let hay;
        if (field === '__output')      hay = String(r.output_text || '');
        else if (field === '__error')  hay = String(r.error_msg || '');
        else                           hay = String(inputObj[field] ?? '');
        if (!hay.toLowerCase().includes(needle)) return false;
      }
      return true;
    });
  }

  // 筛选条件变化 → 自动回到第 1 页
  const filterSig = JSON.stringify({ statusFilter, kw, cols: _hdColFilters });
  if (filterSig !== _hdLastFilterSig) { _hdPage = 1; _hdLastFilterSig = filterSig; }

  // 分页切片
  const totalPages = Math.max(1, Math.ceil(list.length / _hdPageSize));
  if (_hdPage > totalPages) _hdPage = totalPages;
  if (_hdPage < 1) _hdPage = 1;
  const startIdx = (_hdPage - 1) * _hdPageSize;
  const pageList = list.slice(startIdx, startIdx + _hdPageSize);
  const rangeEnd = Math.min(startIdx + _hdPageSize, list.length);

  document.getElementById('hdRowCount').innerHTML =
    `共 ${_hdTotal} 行${list.length !== _historyAllRows.length ? `(筛选后 ${list.length})` : ''}` +
    `${list.length ? ` · 显示 ${startIdx + 1}-${rangeEnd}` : ''}`;
  document.getElementById('hdPageInfo').textContent = `第 ${_hdPage} / ${totalPages} 页`;
  document.getElementById('hdPagePrev').disabled  = _hdPage <= 1;
  document.getElementById('hdPageFirst').disabled = _hdPage <= 1;
  document.getElementById('hdPageNext').disabled  = _hdPage >= totalPages;
  document.getElementById('hdPageLast').disabled  = _hdPage >= totalPages;
  document.getElementById('hdLoadMoreHint').innerHTML = _hdHasMore
    ? ` · <a href="#" id="hdLoadMore" style="color:var(--green)">加载更多 (剩余 ${_hdTotal - _historyAllRows.length} 条)</a>`
    : '';

  if (!list.length) {
    body.innerHTML = `<tr><td colspan="${colCount}" style="padding:14px;color:var(--text-muted);text-align:center">无匹配项</td></tr>`;
    return;
  }

  body.innerHTML = pageList.map((r, i) => {
    let inputObj = {}; try { inputObj = JSON.parse((r.input_json || '{}').replace(/\bNaN\b/g, 'null').replace(/\b-?Infinity\b/g, 'null')); } catch {}
    // 按列结构渲染:imgname=纯文件名, imgthumb=纯缩略图, value=值(行内若仍是图片路径则混合显示)
    const fieldCells = columns.map(c => {
      const v = inputObj[c.field];
      const sv = v == null ? '' : String(v);
      if (c.kind === 'imgname') {
        const fname = sv.split(/[\\/]/).pop();
        return `<td style="vertical-align:top;font-size:.78rem;word-break:break-all;max-width:220px">${escapeHtml(fname)}</td>`;
      }
      if (c.kind === 'imgthumb') {
        if (!sv || !isImagePath(sv)) return `<td style="vertical-align:top"></td>`;
        return `<td style="vertical-align:top">
          <img class="img-thumb" src="${imgPreviewUrl(sv)}" data-full="${escapeHtml(sv)}"
               onerror="this.outerHTML='<span class=\\'img-thumb broken\\' title=\\'加载失败\\'></span>'">
        </td>`;
      }
      // value: 兼容某行刚好是图片路径的情况(虽然首行判定为非 image)
      if (isImagePath(sv)) {
        const fname = sv.split(/[\\/]/).pop();
        return `<td style="vertical-align:top">
          <div style="display:flex;align-items:flex-start;gap:6px">
            <img class="img-thumb" src="${imgPreviewUrl(sv)}" data-full="${escapeHtml(sv)}"
                 onerror="this.outerHTML='<span class=\\'img-thumb broken\\' title=\\'加载失败\\'></span>'">
            <span style="font-size:.72rem;color:var(--text-muted);word-break:break-all">${escapeHtml(fname)}</span>
          </div></td>`;
      }
      const safe = escapeHtml(sv);
      return `<td style="max-width:240px;font-size:.82rem;white-space:pre-wrap;word-break:break-word;vertical-align:top">${safe.length > 400 ? safe.slice(0,400) + '…' : safe}</td>`;
    }).join('');

    const outputText = String(r.output_text || '');
    let resultVal = outputText;
    if (!isScript) {
      try { const p = JSON.parse(outputText); if (p && 'result' in p) resultVal = String(p.result ?? ''); } catch {}
    }
    let outputCell;
    if (isImagePath(resultVal.trim())) {
      const fname = resultVal.trim().split(/[\\/]/).pop();
      outputCell = `<td style="vertical-align:top">
        <div style="display:flex;align-items:flex-start;gap:6px">
          <img class="img-thumb" src="${imgPreviewUrl(resultVal.trim())}" data-full="${escapeHtml(resultVal.trim())}"
               onerror="this.outerHTML='<span class=\\'img-thumb broken\\' title=\\'加载失败\\'></span>'">
          <span style="font-size:.72rem;color:var(--text-muted);word-break:break-all">${escapeHtml(fname)}</span>
        </div></td>`;
    } else {
      outputCell = `<td style="max-width:520px;white-space:pre-wrap;word-break:break-word;font-size:.85rem;vertical-align:top">${escapeHtml(resultVal)}</td>`;
    }

    const status = r.success
      ? '<span class="result-status-ok">成功</span>'
      : '<span class="result-status-err">失败</span>';
    // 耗时秒数（一位小数）
    let durSec = '—';
    if (r.started_at && r.finished_at) {
      try {
        const ms = new Date(r.finished_at) - new Date(r.started_at);
        if (ms >= 0) durSec = (ms/1000).toFixed(1);
      } catch {}
    }
    const errCell = escapeHtml(r.error_msg || '');
    const rowCls = r.success ? '' : 'class="row-failed"';
    const inputJsonAttr = escapeHtml(JSON.stringify(inputObj));
    const outputAttr    = escapeHtml(outputText);

    return `<tr ${rowCls}>
      <td style="vertical-align:top">${r.row_index ?? i}</td>
      ${fieldCells}
      ${outputCell}
      <td style="vertical-align:top">${status}</td>
      <td style="font-size:.78rem;color:var(--text-muted);vertical-align:top">${durSec}</td>
      <td style="font-size:.78rem;color:#dc2626;white-space:pre-wrap;word-break:break-word;vertical-align:top">${errCell}</td>
      <td style="white-space:nowrap;vertical-align:top">
        <button class="copy-btn" data-copy="${inputJsonAttr}" title="复制输入">复制输入</button>
        <button class="copy-btn" data-copy="${outputAttr}" title="复制输出" style="margin-left:2px">复制输出</button>
      </td>
    </tr>`;
  }).join('');

  // 复制按钮
  body.querySelectorAll('.copy-btn').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const txt = b.getAttribute('data-copy') || '';
      const tmp = document.createElement('textarea'); tmp.innerHTML = txt;
      navigator.clipboard.writeText(tmp.value).then(() => {
        const orig = b.textContent;
        b.textContent = '✓ 已复制';
        setTimeout(() => { b.textContent = orig; }, 1000);
      });
    });
  });

  // 加载更多
  const more = document.getElementById('hdLoadMore');
  if (more) more.addEventListener('click', async (e) => {
    e.preventDefault();
    await loadDetailPage(_historyCurrentDetailId, settings, isScript, false);
  });
}

async function runScript() {
  const code = monacoEditor?.getValue() ?? '';
  if (!code.trim()) return;
  const configId = document.getElementById('scriptConfigSel').value;
  const model    = document.getElementById('scriptModelSel').value;
  if (!configId || !model) { alert('请先选择 API 配置和模型'); return; }

  document.querySelector('.script-out-tab[data-out="log"]').click();
  clearScriptOutput();
  _scriptStdout = '';
  _scriptFileList = [];
  _scriptStartTs = Date.now();

  monacoEditor?.updateOptions({ readOnly: true });
  document.getElementById('scriptRunBtn').style.display  = 'none';
  document.getElementById('scriptStopBtn').style.display = '';
  let elapsed = 0;
  const timerEl = document.getElementById('scriptTimer');
  timerEl.textContent = '0s';
  _scriptTimer = setInterval(() => { elapsed++; timerEl.textContent = elapsed + 's'; }, 1000);

  _scriptAbort = new AbortController();

  const taskName = document.getElementById('scriptTaskName').value.trim() || defaultTaskName();
  const cfgPayload = JSON.stringify({
    provider: document.getElementById('scriptProviderSel').value,
    request_id: configId ? parseInt(configId) : null,
    model,
    source: (window._scriptSrcMode || 'file'),
    input_file: (window._scriptSrcMode === 'dataset')
      ? ''
      : (window._uploadedFileId || uploadedFileId || ''),
    dataset_id: (window._scriptSrcMode === 'dataset')
      ? (window._scriptDatasetId || '')
      : '',
  });

  try {
    const res = await fetch('http://localhost:8000/batch2/run', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({
        source_type: 'script',
        task_name: taskName,
        config_json: cfgPayload,
        script_code: code,
        request_id: configId ? parseInt(configId) : null,
        model,
      }),
      signal: _scriptAbort.signal,
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      appendScriptLog('error', (d.detail || `HTTP ${res.status}`) + '\n');
      return;
    }
    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try { handleScriptEvent(JSON.parse(line.slice(6))); } catch {}
      }
    }
  } catch(e) {
    if (e.name !== 'AbortError') appendScriptLog('error', '连接中断：' + e.message + '\n');
    else appendScriptLog('info', '已手动停止\n');
  } finally {
    clearInterval(_scriptTimer);
    monacoEditor?.updateOptions({ readOnly: false });
    document.getElementById('scriptRunBtn').style.display  = '';
    document.getElementById('scriptStopBtn').style.display = 'none';
    timerEl.textContent = '';
    // 运行完毕：编辑器恢复模板,任务名清空（任务ID 也跟着清空）
    setTimeout(() => { window._resetScriptEditor?.(); }, 200);
  }
}


function handleScriptEvent(ev) {
  const logEl = document.getElementById('scriptLog');
  switch(ev.type) {
    case 'stdout': _scriptStdout += ev.text; appendScriptLog('stdout', ev.text); break;
    case 'stderr': _scriptStdout += ev.text; appendScriptLog('stderr', ev.text); break;
    case 'error':  _scriptStdout += ev.text; appendScriptLog('error',  ev.text); break;
    case 'info':   appendScriptLog('info',   ev.text); break;
    case 'image': {
      const img = document.createElement('img');
      img.src = ev.data;
      logEl.appendChild(img); logEl.scrollTop = logEl.scrollHeight; break;
    }
    case 'video': {
      const vid = document.createElement('video');
      vid.controls = true;
      vid.src = `http://localhost:8000/script/result/${ev.run_id}/${ev.filename}`;
      logEl.appendChild(vid); logEl.scrollTop = logEl.scrollHeight; break;
    }
    case 'file': {
      _scriptRunId = ev.run_id; _scriptFiles++;
      _scriptFileList.push({ name: ev.name, size: ev.size });
      const badge = document.getElementById('scriptFileBadge');
      badge.textContent = _scriptFiles; badge.style.display = '';
      const filesEl = document.getElementById('scriptResultFiles');
      if (filesEl.querySelector('p')) filesEl.innerHTML = '';
      const sizeStr = ev.size > 1048576 ? (ev.size/1048576).toFixed(1)+' MB'
                    : ev.size > 1024    ? (ev.size/1024).toFixed(1)+' KB'
                    : ev.size + ' B';
      const tk = encodeURIComponent(localStorage.getItem('platform_token') || '');
      const item = document.createElement('div');
      item.className = 'result-file-item';
      item.innerHTML = `<span class="file-name">📄 ${ev.name}</span>
        <span class="file-size">${sizeStr}</span>
        <a class="btn btn-secondary" style="padding:3px 10px;font-size:.78rem;text-decoration:none"
           href="http://localhost:8000/script/result/${ev.run_id}/download?token=${tk}"
           download="result_${ev.run_id.slice(0,8)}.zip">↓</a>`;
      filesEl.appendChild(item);
      document.getElementById('scriptDownloadAll').style.display = '';
      break;
    }
    case 'done': {
      if (ev.run_id) _scriptRunId = ev.run_id;
      appendScriptLog('info', `\n✅ 完成（${ev.elapsed}s，${ev.file_count} 个结果文件）\n`);
      // 历史已由后端 /tasks/{id}/run 自动创建,这里不再重复 POST
      break;
    }
    case 'row': {
      const ok = ev.success ? '✓' : '✗';
      appendScriptLog(ev.success?'stdout':'error',
        `[行 ${ev.idx}] ${ok} ${String(ev.output||ev.error||'').slice(0,80)}\n`);
      break;
    }
    case 'task_started': {
      appendScriptLog('info', `▶ 已创建批次 ${ev.batch_id} (job_id=${ev.job_id})\n`);
      break;
    }
  }
}
