<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密钥管理 — 数据平台</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
  <style>
    .th-filter { position: relative; white-space: nowrap; }
    .filter-btn {
      background: none; border: none; cursor: pointer;
      font-size: .72rem; color: var(--text-muted);
      padding: 0 2px; vertical-align: middle; margin-left: 4px;
    }
    .filter-btn:hover, .filter-btn.active { color: var(--green); }
    .filter-pop {
      position: absolute; top: 100%; left: 0; z-index: 200;
      background: #fff; border: 1px solid var(--border);
      border-radius: 6px; padding: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      min-width: 180px;
    }
    .filter-pop input, .filter-pop select {
      width: 100%; font-size: .82rem; padding: 4px 6px;
      border: 1px solid var(--border); border-radius: 4px;
    }
    .modal .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    /* embed 模式：隐藏导航，内容区全宽且贴边（与父页 tab 间距一致） */
    body.embed .top-bar,
    body.embed .sidebar,
    body.embed .breadcrumb { display: none !important; }
    body.embed .layout { display: block !important; }
    body.embed .main { margin: 0 !important; padding: 0 !important; }
    body.embed .toolbar { margin-bottom: 8px !important; }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="sidebar-toggle" id="sidebarToggle">☰</button>
  <span class="brand">数据平台</span>
  <div style="flex:1"></div>
  <div class="breadcrumb-right" id="userBar"></div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-group open" id="sg1">
      <div class="sidebar-group-title" onclick="document.getElementById('sg1').classList.toggle('open')">
        三方API管理 <span class="arrow">›</span>
      </div>
      <div class="sidebar-children">
        <a href="claude.html"  class="sidebar-item">API调用</a>
        <a href="apply.html"   class="sidebar-item">API管理</a>
        <a href="stats.html"   class="sidebar-item">使用统计</a>
        <a href="users.html"   class="sidebar-item sidebar-admin" id="usersLink">用户管理</a>
      </div>
    </div>
  </div>

  <div class="main">
<div class="breadcrumb" style="margin-bottom:0;padding-bottom:0;border-bottom:none">
  <a href="#">三方API管理</a>
  <span class="sep">›</span>
  <span class="current">密钥管理</span>
</div>

    <div id="adminSection">
      <div class="toolbar" style="margin-bottom:12px">
        <span class="page-title" style="margin:0">密钥管理</span>
        <div style="display:flex;gap:8px;margin-left:auto">
          <button class="btn btn-primary" id="addAccountBtn">+ 新增供应商</button>
          <button class="btn btn-primary" id="addKeyBtn">+ 新增 API key</button>
          <button class="btn btn-secondary" id="reloadBtn">刷新</button>
        </div>
      </div>
      <div class="card" style="padding:0;overflow:auto">
        <table id="acctTable" style="min-width:1400px">
          <thead>
            <tr>
              <th class="th-filter" data-col="provider">供应商<button class="filter-btn" data-fcol="provider">⌄</button></th>
              <th class="th-filter" data-col="base_url">base_url<button class="filter-btn" data-fcol="base_url">⌄</button></th>
              <th class="th-filter" data-col="backend">后端网址<button class="filter-btn" data-fcol="backend">⌄</button></th>
              <th class="th-filter" data-col="sub_account">子帐号<button class="filter-btn" data-fcol="sub_account">⌄</button></th>
              <th class="th-filter" data-col="api_name">API名称<button class="filter-btn" data-fcol="api_name">⌄</button></th>
              <th class="th-filter" data-col="api_key">API key<button class="filter-btn" data-fcol="api_key">⌄</button></th>
              <th class="th-filter" data-col="manager">管理员<button class="filter-btn" data-fcol="manager">⌄</button></th>
              <th class="th-filter" data-col="users">使用人<button class="filter-btn" data-fcol="users">⌄</button></th>
              <th class="th-filter" data-col="creator">创建人<button class="filter-btn" data-fcol="creator">⌄</button></th>
              <th>总额</th>
              <th>余额</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="acctTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal A: 新增供应商（仅新增；编辑走 Modal D） -->
<div class="modal-bg" id="acctModalBg">
  <div class="modal" style="width:560px">
    <h3>新增供应商</h3>
    <div class="form-group"><label>供应商</label>
      <input id="aProvider" list="providerList" placeholder="如 anthropic">
      <datalist id="providerList"></datalist>
    </div>
    <div class="form-group"><label>Base URL</label>
      <input id="aBaseUrl" placeholder="https://api.anthropic.com/v1"></div>
    <div class="form-group"><label>供应商后端网址</label>
      <input id="aBackend" placeholder="可留空（费用接口拼接基址，留空则用 Base URL）"></div>
    <p style="font-size:.82rem;color:var(--text-muted);margin:14px 0 6px;border-top:1px solid var(--border);padding-top:10px">费用接口（可选；填写后系统会用对应 API key 拉取总额/余额）</p>
    <div class="form-group"><label>令牌总额接口</label>
      <input id="aQuotaTotalPath" placeholder="如 /user/quota 或完整 URL"></div>
    <div class="form-group"><label>已用额度接口</label>
      <input id="aCostPath" placeholder="如 /user/used"></div>
    <div class="form-group"><label>剩余额度接口</label>
      <input id="aBalancePath" placeholder="如 /user/balance"></div>
    <p id="aErr" style="color:#dc2626;font-size:.83rem;min-height:18px"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="acctCancelBtn">取消</button>
      <button class="btn btn-primary" id="acctSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- Modal C: 新增 API key（编辑走 Modal D） -->
<div class="modal-bg" id="keyModalBg">
  <div class="modal" style="width:560px">
    <h3>新增 API key</h3>
    <div class="form-group"><label>所属供应商</label>
      <select id="kAccount"></select></div>
    <div class="form-group">
      <label>所属子帐号</label>
      <input id="kSub" list="kSubList" placeholder="选择或输入子帐号名称">
      <datalist id="kSubList"></datalist>
    </div>
    <div class="form-row">
      <div class="form-group" style="margin:0"><label>API 名称</label>
        <input id="kName" placeholder="如 主key 1"></div>
      <div class="form-group" style="margin:0"><label>API key</label>
        <input id="kKey" placeholder="sk-..."></div>
    </div>
    <div class="form-group"><label>管理员 <span style="color:#dc2626">*</span></label>
      <input id="kManager" list="kManagerList" placeholder="管理员用户名（必填）">
      <datalist id="kManagerList"></datalist>
    </div>
    <p id="kErr" style="color:#dc2626;font-size:.83rem;min-height:18px"></p>
    <div style="border-top:1px solid var(--border);margin:6px 0 12px;padding-top:12px;display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--text-muted);flex-wrap:wrap">
      <span>批量导入：</span>
      <label class="btn btn-secondary" style="cursor:pointer;margin:0">
        选择 Excel 文件
        <input type="file" id="kImportFile" accept=".xlsx" style="display:none">
      </label>
      <a id="kTemplateLink" href="#" style="color:var(--green)">下载模板</a>
      <span id="kImportStatus" style="color:var(--text-muted)"></span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="keyCancelBtn">取消</button>
      <button class="btn btn-primary" id="keySaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- Modal D: 统一编辑（供应商 + API key） -->
<div class="modal-bg" id="editModalBg">
  <div class="modal" style="width:600px">
    <h3>编辑</h3>
    <p style="font-size:.82rem;color:var(--text-muted);margin:-4px 0 12px">供应商信息</p>
    <div class="form-group"><label>供应商</label><input id="eProvider" readonly style="background:var(--surface)"></div>
    <div class="form-group"><label>Base URL</label><input id="eBaseUrl"></div>
    <div class="form-group"><label>后端网址</label><input id="eBackend"></div>
    <div class="form-group"><label>供应商管理员</label>
      <input id="eAcctManager" list="eManagerList" placeholder="管理员用户名">
      <datalist id="eManagerList"></datalist>
    </div>
    <p style="font-size:.82rem;color:var(--text-muted);margin:6px 0 4px">费用接口</p>
    <div class="form-group"><label>令牌总额接口</label><input id="eQuotaTotalPath" placeholder="如 /user/quota"></div>
    <div class="form-group"><label>已用额度接口</label><input id="eCostPath" placeholder="如 /user/used"></div>
    <div class="form-group"><label>剩余额度接口</label><input id="eBalancePath" placeholder="如 /user/balance"></div>
    <hr style="border:none;border-top:1px solid var(--border);margin:8px 0 12px">
    <p style="font-size:.82rem;color:var(--text-muted);margin:0 0 8px" id="eKeySectionTitle">API Key 信息</p>
    <div id="eKeySection">
      <div class="form-row">
        <div class="form-group" style="margin:0"><label>API 名称</label><input id="eKeyName"></div>
        <div class="form-group" style="margin:0"><label>API key</label><input id="eKeyVal"></div>
      </div>
      <div class="form-group"><label>子帐号</label><input id="eKeySub" readonly style="background:var(--surface)"></div>
    </div>
    <p id="eErr" style="color:#dc2626;font-size:.83rem;min-height:18px"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="editCancelBtn">取消</button>
      <button class="btn btn-primary" id="editSaveBtn">保存</button>
    </div>
  </div>
</div>

<script type="module">
import { initSidebar } from '../assets/js/sidebar.js';
import { requireLogin, refreshUser, authHeaders } from '../assets/js/auth.js';
import {
  listAccounts, createAccount, updateAccount,
  listSubAccounts, createSubAccount,
  listApiKeys, createApiKey, updateApiKey, deleteApiKey,
} from '../assets/js/admin.js';

const _isEmbed = new URLSearchParams(location.search).has('embed');
if (_isEmbed) {
  document.body.classList.add('embed');
  // iframe 内点侧栏/breadcrumb 链接，强制在父窗口跳转，避免替换 iframe 自身
  document.querySelectorAll('.sidebar a[href], .breadcrumb a[href]').forEach(a => {
    if (!a.target) a.target = '_top';
  });
}
if (!requireLogin()) throw new Error('redirect');
if (!_isEmbed) initSidebar();

const user    = await refreshUser();
const isAdmin = user.role === 'admin';

let allAccounts = [];
let allAccountOptions = [];   // 不受可见性过滤，供"新增 API key"下拉用
let allSubAccounts = {};
let allKeys = {};
let flatRows = [];
let userList = [];
let _importedCount = 0;
const filters = {};

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 模板下载（需带 token，不能直接用 href）────────────────
document.getElementById('kTemplateLink').addEventListener('click', async function(e) {
  e.preventDefault();
  try {
    const res = await fetch('http://localhost:8000/admin/api-keys/template.xlsx', {
      headers: { 'X-Token': localStorage.getItem('platform_token') || '' },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'api_keys_template.xlsx'; a.click();
    URL.revokeObjectURL(url);
  } catch(e) { alert('下载失败：' + e.message); }
});

// ── 加载所有用户（供 manager 下拉）──
async function loadUsers() {
  try {
    const res = await fetch('http://localhost:8000/admin/users', {
      headers: { 'X-Token': localStorage.getItem('platform_token') || '' },
    });
    if (res.ok) userList = await res.json();
  } catch {}
  const fillDL = id => {
    const dl = document.getElementById(id);
    if (dl) dl.innerHTML = userList.map(u => `<option value="${esc(u.username)}">`).join('');
  };
  fillDL('eManagerList');
  fillDL('kManagerList');
}

async function loadAll() {
  try {
    allAccounts = await listAccounts();
  } catch (e) {
    document.getElementById('acctTbody').innerHTML =
      `<tr><td colspan="14" style="text-align:center;color:#dc2626;padding:24px">加载失败:${esc(e.message)}</td></tr>`;
    return;
  }
  try {
    const res = await fetch('http://localhost:8000/admin/accounts/options', {
      headers: { 'X-Token': localStorage.getItem('platform_token') || '' },
    });
    allAccountOptions = res.ok ? await res.json() : [];
  } catch { allAccountOptions = []; }
  allSubAccounts = {}; allKeys = {};
  for (const a of allAccounts) {
    try {
      const subs = await listSubAccounts(a.id);
      allSubAccounts[a.id] = subs;
      for (const s of subs) {
        allKeys[s.id] = await listApiKeys(s.id);
      }
    } catch {}
  }
  buildFlatRows();
  renderTable();
  refreshQuotaInline();
}

function buildFlatRows() {
  flatRows = [];
  for (const a of allAccounts) {
    const subs = allSubAccounts[a.id] || [];
    for (const s of subs) {
      const keys = allKeys[s.id] || [];
      for (const k of keys) flatRows.push({ account: a, sub: s, key: k });
    }
  }
}

function applyFilters(rows) {
  return rows.filter(r => {
    const a = r.account, s = r.sub, k = r.key;
    for (const [col, v] of Object.entries(filters)) {
      if (!v) continue;
      let val = '';
      if      (col === 'provider')    val = a.provider;
      else if (col === 'base_url')    val = a.base_url;
      else if (col === 'backend')     val = a.provider_backend_url || '';
      else if (col === 'sub_account') val = s?.name || '';
      else if (col === 'api_name')    val = k?.name || '';
      else if (col === 'api_key')     val = k?.api_key || '';
      else if (col === 'creator')     val = k?.creator_username || a.creator_username || '';
      else if (col === 'manager')     val = k?.manager_username || '';
      else if (col === 'users')       val = k?.users_username || '';
      if (!String(val).toLowerCase().includes(String(v).toLowerCase())) return false;
    }
    return true;
  });
}

function renderTable() {
  const tbody = document.getElementById('acctTbody');
  const visible = applyFilters(flatRows);
  if (!visible.length) {
    tbody.innerHTML = '<tr><td colspan="14" style="text-align:center;color:var(--text-muted);padding:24px">无数据</td></tr>';
    refreshFilterIndicators();
    return;
  }
  tbody.innerHTML = visible.map(r => {
    const a = r.account, s = r.sub, k = r.key;
    const keyMasked = '****' + (k.api_key || '').slice(-4);
    const canEdit = isAdmin || k.created_by === user.id;
    const used    = (k.usage_count || 0) > 0;
    const delDisabled = used ? 'disabled title="已被调用,不可删除"' : '';
    return `<tr data-key-id="${k.id}">
      <td>${esc(a.provider)}</td>
      <td>${esc(a.base_url)}</td>
      <td>${esc(a.provider_backend_url || '')}</td>
      <td>${esc(s.name)}</td>
      <td>${esc(k.name)}</td>
      <td><code>${keyMasked}</code></td>
      <td>${esc(k.manager_username || '')}</td>
      <td>${esc(k.users_username || '')}</td>
      <td>${esc(k.creator_username || a.creator_username || '')}</td>
      <td data-col="total" style="color:var(--text-muted)">--</td>
      <td data-col="balance" style="color:var(--text-muted)">--</td>
      <td style="white-space:nowrap">
        ${canEdit ? `<button class="btn-icon" data-edit="${k.id}">编辑</button>` : ''}
        ${canEdit ? `<button class="btn-icon btn-danger" data-del="${k.id}" ${delDisabled}>删除</button>` : ''}
      </td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('[data-edit]').forEach(b =>
    b.addEventListener('click', () => openEditModal(parseInt(b.dataset.edit))));
  tbody.querySelectorAll('[data-del]').forEach(b => {
    if (b.disabled) return;
    b.addEventListener('click', () => onDelKey(parseInt(b.dataset.del)));
  });
  refreshFilterIndicators();
}

function refreshFilterIndicators() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', !!filters[btn.dataset.fcol]);
  });
}

// ── 漏斗筛选浮层 ─────────────────────────────────────────
let openPop = null;
function closeFilterPop() {
  if (openPop) { openPop.remove(); openPop = null; }
}
document.addEventListener('click', e => {
  if (!e.target.closest('.filter-pop') && !e.target.closest('.filter-btn')) closeFilterPop();
});
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const col = btn.dataset.fcol;
    if (openPop && openPop.dataset.fcol === col) { closeFilterPop(); return; }
    closeFilterPop();
    const pop = document.createElement('div');
    pop.className = 'filter-pop';
    pop.dataset.fcol = col;
    const isSelect = ['provider','sub_account','creator','manager'].includes(col);
    if (isSelect) {
      let opts = [];
      if (col === 'provider') opts = [...new Set(allAccounts.map(a => a.provider).filter(Boolean))].sort();
      else if (col === 'creator') opts = [...new Set(flatRows.map(r => r.key?.creator_username || r.account.creator_username).filter(Boolean))].sort();
      else if (col === 'manager') opts = [...new Set(flatRows.map(r => r.key?.manager_username).filter(Boolean))].sort();
      else if (col === 'sub_account') opts = [...new Set(Object.values(allSubAccounts).flat().map(s => s.name).filter(Boolean))].sort();
      pop.innerHTML = `<select><option value="">全部</option>${opts.map(o => `<option value="${esc(o)}"${filters[col]===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
      const sel = pop.querySelector('select');
      sel.addEventListener('change', () => {
        filters[col] = sel.value;
        renderTable();
      });
    } else {
      pop.innerHTML = `<input placeholder="筛选..." value="${esc(filters[col] || '')}">`;
      const inp = pop.querySelector('input');
      inp.addEventListener('input', () => {
        filters[col] = inp.value;
        renderTable();
      });
      setTimeout(() => inp.focus(), 0);
    }
    btn.parentElement.appendChild(pop);
    openPop = pop;
  });
});

// ── Modal A: 新增供应商 ───────────────────────────────────
const acctModalBg = document.getElementById('acctModalBg');
const aErr = document.getElementById('aErr');

function openAcctCreate() {
  ['aProvider','aBaseUrl','aBackend','aQuotaTotalPath','aCostPath','aBalancePath']
    .forEach(id => document.getElementById(id).value = '');
  aErr.textContent = '';
  // provider datalist
  const providers = [...new Set(allAccounts.map(a => a.provider).filter(Boolean))].sort();
  document.getElementById('providerList').innerHTML =
    providers.map(p => `<option value="${esc(p)}">`).join('');
  acctModalBg.classList.add('open');
}

document.getElementById('addAccountBtn').addEventListener('click', openAcctCreate);
document.getElementById('acctCancelBtn').addEventListener('click',
  () => acctModalBg.classList.remove('open'));
acctModalBg.addEventListener('click', e => {
  if (e.target === acctModalBg) acctModalBg.classList.remove('open');
});

// 选已有 provider 时自动填模板（带确认覆盖）
document.getElementById('aProvider').addEventListener('change', () => {
  const v = document.getElementById('aProvider').value.trim();
  if (!v) return;
  const matches = allAccounts.filter(a => a.provider === v);
  if (!matches.length) return;
  const tpl = matches[0];
  const fields = ['aBaseUrl','aBackend','aQuotaTotalPath','aCostPath','aBalancePath'];
  const anyFilled = fields.some(id => document.getElementById(id).value.trim());
  if (anyFilled && !confirm(`检测到 provider "${v}" 已有 ${matches.length} 个帐号，应用其模板会覆盖已填字段？`)) return;
  document.getElementById('aBaseUrl').value         = tpl.base_url || '';
  document.getElementById('aBackend').value         = tpl.provider_backend_url || '';
  document.getElementById('aQuotaTotalPath').value  = tpl.quota_total_path || '';
  document.getElementById('aCostPath').value        = tpl.cost_path || '';
  document.getElementById('aBalancePath').value     = tpl.balance_path || '';
});

document.getElementById('acctSaveBtn').addEventListener('click', async () => {
  aErr.textContent = '';
  const body = {
    provider:             document.getElementById('aProvider').value.trim(),
    base_url:             document.getElementById('aBaseUrl').value.trim(),
    provider_backend_url: document.getElementById('aBackend').value.trim(),
    quota_total_path:     document.getElementById('aQuotaTotalPath').value.trim(),
    balance_path:         document.getElementById('aBalancePath').value.trim(),
    cost_path:            document.getElementById('aCostPath').value.trim(),
    manager_user_id:      null,
    is_active: 1,
  };
  if (!body.provider || !body.base_url) {
    aErr.textContent = '供应商和 Base URL 必填'; return;
  }
  // 同 provider+base_url 重复提示
  const dup = allAccounts.find(a => a.provider === body.provider && a.base_url === body.base_url);
  if (dup) {
    aErr.textContent = '已有相同供应商（provider + base_url 完全相同）';
    return;
  }
  try {
    await createAccount(body);
    acctModalBg.classList.remove('open');
    await loadAll();
  } catch (e) {
    aErr.textContent = '保存失败:' + e.message;
  }
});

// ── Modal C: 新增 API key ────────────────────────────────
const keyModalBg = document.getElementById('keyModalBg');

async function refreshKeyModalSubDropdown(accountId) {
  const dl = document.getElementById('kSubList');
  let subs = allSubAccounts[accountId];
  if (!subs) {
    try { subs = await listSubAccounts(accountId); allSubAccounts[accountId] = subs; }
    catch { subs = []; }
  }
  dl.innerHTML = subs.map(s => `<option value="${esc(s.name)}">`).join('');
}

function openKeyCreate() {
  _importedCount = 0;
  document.getElementById('kName').value = '';
  document.getElementById('kKey').value = '';
  document.getElementById('kSub').value = '';
  document.getElementById('kManager').value = '';
  document.getElementById('kErr').textContent = '';
  document.getElementById('kImportStatus').textContent = '';
  const accSel = document.getElementById('kAccount');
  // 按 provider+base_url 去重，仅保留每组中 id 最小的一条
  const seen = new Set();
  const uniq = [];
  for (const a of [...allAccountOptions].sort((x, y) => x.id - y.id)) {
    const key = `${a.provider}${a.base_url}`;
    if (seen.has(key)) continue;
    seen.add(key);
    uniq.push(a);
  }
  accSel.innerHTML = uniq.map(a =>
    `<option value="${a.id}">${esc(a.provider)} / ${esc(a.base_url)}</option>`
  ).join('');
  if (uniq.length) refreshKeyModalSubDropdown(parseInt(accSel.value));
  keyModalBg.classList.add('open');
}

document.getElementById('addKeyBtn').addEventListener('click', () => {
  if (!allAccountOptions.length) { alert('请先新增供应商'); return; }
  openKeyCreate();
});
document.getElementById('kAccount').addEventListener('change', e => {
  refreshKeyModalSubDropdown(parseInt(e.target.value));
  document.getElementById('kSub').value = '';
});
document.getElementById('keyCancelBtn').addEventListener('click',
  () => keyModalBg.classList.remove('open'));
keyModalBg.addEventListener('click', e => {
  if (e.target === keyModalBg) keyModalBg.classList.remove('open');
});

document.getElementById('keySaveBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('kErr');
  errEl.textContent = '';
  // Excel 已导入成功 → 保存按钮变成关闭+刷新
  if (_importedCount > 0) {
    keyModalBg.classList.remove('open');
    await loadAll();
    _importedCount = 0;
    return;
  }
  const accId = parseInt(document.getElementById('kAccount').value);
  const subName = document.getElementById('kSub').value.trim();
  const managerName = document.getElementById('kManager').value.trim();
  const managerUser = userList.find(u => u.username === managerName);
  const body = {
    name: document.getElementById('kName').value.trim(),
    api_key: document.getElementById('kKey').value.trim(),
    is_active: 1, exhausted: 0,
    manager_user_id: managerUser ? managerUser.id : null,
  };
  if (!subName) { errEl.textContent = '请填写子帐号名称'; return; }
  if (!body.name || !body.api_key) { errEl.textContent = '名称和 key 必填'; return; }
  if (!managerName) { errEl.textContent = '请填写管理员'; return; }
  if (!managerUser) { errEl.textContent = `管理员用户不存在：${managerName}`; return; }
  try {
    let subId;
    const existing = (allSubAccounts[accId] || []).find(s => s.name === subName);
    if (existing) {
      subId = existing.id;
    } else {
      const newSub = await createSubAccount(accId, { name: subName, description: '' });
      subId = newSub.id;
    }
    await createApiKey(subId, body);
    keyModalBg.classList.remove('open');
    await loadAll();
  } catch (e) {
    if ((e.message || '').includes('已存在')) {
      errEl.textContent = '已存在(同 provider + 同 key)';
    } else {
      errEl.textContent = '保存失败:' + e.message;
    }
  }
});

// 批量导入 Excel：先校验子帐号是否填写
document.getElementById('kImportFile').addEventListener('change', async function () {
  const file = this.files[0];
  if (!file) return;
  const errEl = document.getElementById('kErr');
  const statusEl = document.getElementById('kImportStatus');
  errEl.textContent = '';
  statusEl.textContent = '';

  const accId = parseInt(document.getElementById('kAccount').value);
  const subName = document.getElementById('kSub').value.trim();
  if (!subName) {
    errEl.textContent = '请先填写子帐号名称';
    this.value = '';
    return;
  }
  let subId;
  const existing = (allSubAccounts[accId] || []).find(s => s.name === subName);
  if (existing) {
    subId = existing.id;
  } else {
    try {
      const newSub = await createSubAccount(accId, { name: subName, description: '' });
      subId = newSub.id;
    } catch (e) {
      errEl.textContent = '创建子帐号失败：' + e.message;
      this.value = ''; return;
    }
  }
  statusEl.textContent = '导入中…';
  statusEl.style.color = 'var(--text-muted)';
  const managerName = document.getElementById('kManager').value.trim();
  const managerUser = userList.find(u => u.username === managerName);
  const fd = new FormData();
  fd.append('file', file);
  if (managerUser) fd.append('manager_user_id', managerUser.id);
  try {
    const res = await fetch(`http://localhost:8000/admin/sub-accounts/${subId}/api-keys/import-excel`, {
      method: 'POST',
      headers: { 'X-Token': localStorage.getItem('platform_token') || '' },
      body: fd,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    const skipped = data.skipped_duplicates?.length || 0;
    const errCount = data.errors?.length || 0;
    const summary = `导入完成：成功 ${data.imported} 条${skipped ? `，跳过重复 ${skipped} 条` : ''}${errCount ? `，失败 ${errCount} 条` : ''}`;

    if (data.imported > 0) {
      // 导入成功 → 保留弹窗、显示状态、置 importedCount，让"保存"按钮变成"关闭"行为
      _importedCount = data.imported;
      statusEl.style.color = 'var(--green)';
      let msg = summary + '\n点击下方"保存"按钮关闭并查看新增数据';
      if (errCount > 0) {
        msg += '\n失败详情：' + data.errors.slice(0, 3).map(e => `第${e.row}行：${e.reason}`).join('；')
             + (errCount > 3 ? ` ...等共 ${errCount} 条` : '');
      }
      statusEl.textContent = msg;
      statusEl.style.whiteSpace = 'pre-line';
    } else {
      // 没有任何成功 → 保留弹窗、显示失败原因
      statusEl.style.color = '#dc2626';
      statusEl.textContent = summary;
      if (errCount > 0) {
        const details = data.errors.slice(0, 3).map(e => `第${e.row}行：${e.reason}`).join('；');
        errEl.textContent = '失败原因：' + details + (errCount > 3 ? ` ...等共 ${errCount} 条` : '');
      }
    }
  } catch (e) {
    statusEl.style.color = '#dc2626';
    statusEl.textContent = '导入失败：' + e.message;
  }
  this.value = '';
});

// ── Modal D: 统一编辑 ────────────────────────────────────
const editModalBg = document.getElementById('editModalBg');
const eErr = document.getElementById('eErr');
let editingKeyId = null;
let editingAcctId = null;

function openEditModal(keyId) {
  let key = null, sub = null, acc = null;
  for (const a of allAccounts) {
    for (const s of allSubAccounts[a.id] || []) {
      for (const k of allKeys[s.id] || []) {
        if (k.id === keyId) { key = k; sub = s; acc = a; }
      }
    }
  }
  if (!key) return;
  editingKeyId  = keyId;
  editingAcctId = acc.id;

  document.getElementById('eProvider').value   = acc.provider;
  document.getElementById('eBaseUrl').value    = acc.base_url || '';
  document.getElementById('eBackend').value    = acc.provider_backend_url || '';
  document.getElementById('eAcctManager').value = acc.manager_username || '';
  document.getElementById('eQuotaTotalPath').value = acc.quota_total_path || '';
  document.getElementById('eCostPath').value       = acc.cost_path || '';
  document.getElementById('eBalancePath').value    = acc.balance_path || '';

  document.getElementById('eKeyName').value    = key.name;
  document.getElementById('eKeyVal').value     = key.api_key;
  document.getElementById('eKeySub').value     = sub.name;

  const acctEditable = isAdmin || acc.created_by === user.id || acc.manager_user_id === user.id;
  ['eBaseUrl','eBackend','eAcctManager','eQuotaTotalPath','eCostPath','eBalancePath'].forEach(id => {
    document.getElementById(id).readOnly = !acctEditable;
    document.getElementById(id).style.background = acctEditable ? '' : 'var(--surface)';
  });

  eErr.textContent = '';
  editModalBg.classList.add('open');
}

document.getElementById('editCancelBtn').addEventListener('click',
  () => editModalBg.classList.remove('open'));
editModalBg.addEventListener('click', e => {
  if (e.target === editModalBg) editModalBg.classList.remove('open');
});

document.getElementById('editSaveBtn').addEventListener('click', async () => {
  eErr.textContent = '';
  if (!editingKeyId || !editingAcctId) return;

  const acc = allAccounts.find(a => a.id === editingAcctId);
  const acctEditable = isAdmin || acc.created_by === user.id || acc.manager_user_id === user.id;

  // 1) 更新供应商（仅当字段变化且有权限）
  if (acctEditable) {
    const newMgrName = document.getElementById('eAcctManager').value.trim();
    let newMgrId = null;
    if (newMgrName) {
      const m = userList.find(u => u.username === newMgrName);
      if (!m) { eErr.textContent = '管理员用户不存在：' + newMgrName; return; }
      newMgrId = m.id;
    }
    const acctBody = {
      provider:             acc.provider,
      base_url:             document.getElementById('eBaseUrl').value.trim(),
      provider_backend_url: document.getElementById('eBackend').value.trim(),
      quota_total_path:     document.getElementById('eQuotaTotalPath').value.trim(),
      balance_path:         document.getElementById('eBalancePath').value.trim(),
      cost_path:            document.getElementById('eCostPath').value.trim(),
      is_active: acc.is_active ?? 1,
      manager_user_id: newMgrId,
      team: acc.team || '',
      models: acc.models || '',
    };
    const changed =
      acctBody.base_url             !== (acc.base_url || '') ||
      acctBody.provider_backend_url !== (acc.provider_backend_url || '') ||
      acctBody.quota_total_path     !== (acc.quota_total_path || '') ||
      acctBody.balance_path         !== (acc.balance_path || '') ||
      acctBody.cost_path            !== (acc.cost_path || '') ||
      (acctBody.manager_user_id ?? null) !== (acc.manager_user_id ?? null);
    if (changed) {
      try { await updateAccount(editingAcctId, acctBody); }
      catch (e) { eErr.textContent = '保存供应商失败：' + e.message; return; }
    }
  }

  // 2) 更新 API key（manager_user_id 沿用原值，编辑面板不再单独维护）
  let key = null;
  for (const subId of Object.keys(allKeys)) {
    const found = allKeys[subId].find(k => k.id === editingKeyId);
    if (found) { key = found; break; }
  }
  const keyBody = {
    name: document.getElementById('eKeyName').value.trim(),
    api_key: document.getElementById('eKeyVal').value.trim(),
    is_active: key?.is_active ?? 1,
    exhausted: key?.exhausted ?? 0,
    manager_user_id: key?.manager_user_id ?? null,
  };
  if (!keyBody.name || !keyBody.api_key) {
    eErr.textContent = 'API 名称和 key 必填'; return;
  }
  try {
    await updateApiKey(editingKeyId, keyBody);
    editModalBg.classList.remove('open');
    await loadAll();
  } catch (e) {
    eErr.textContent = '保存 key 失败：' + e.message;
  }
});

async function onDelKey(keyId) {
  if (!confirm('确认删除此 API key?')) return;
  try {
    await deleteApiKey(keyId);
    await loadAll();
  } catch (e) {
    if ((e.message || '').includes('调用')) alert('该 key 已被调用,不能删除');
    else alert('删除失败:' + e.message);
  }
}

// ── Spec 2: 余额实时刷新 ──────────────────────────────────
async function refreshQuotaInline() {
  let data;
  try {
    const res = await fetch('http://localhost:8000/admin/accounts/quota-all',
      { headers: { 'X-Token': localStorage.getItem('platform_token') || '' } });
    if (!res.ok) return;
    data = await res.json();
  } catch { return; }
  for (const [keyIdStr, q] of Object.entries(data.results || {})) {
    const tr = document.querySelector(`tr[data-key-id="${keyIdStr}"]`);
    if (!tr) continue;
    const totalCell   = tr.querySelector('[data-col="total"]');
    const balanceCell = tr.querySelector('[data-col="balance"]');
    if (!totalCell || !balanceCell) continue;
    if (q.error) {
      totalCell.title = q.error; balanceCell.title = q.error;
      totalCell.textContent = '--'; balanceCell.textContent = '--';
      continue;
    }
    const totalDisp = q.total != null ? q.total : '--';
    const balDisp   = q.balance != null ? q.balance : '--';
    if (q.exhausted) {
      const stamp = (q.cached_at || '').slice(0, 10);
      totalCell.textContent   = totalDisp;
      balanceCell.textContent = '已用完';
      balanceCell.title       = `截至 ${stamp}`;
      balanceCell.style.color = '#dc2626';
    } else {
      totalCell.textContent   = totalDisp;
      balanceCell.textContent = balDisp;
    }
  }
}

document.getElementById('reloadBtn').addEventListener('click', loadAll);

await loadUsers();
loadAll();
</script>
