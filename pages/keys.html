<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密钥管理 — 数据平台</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-group open" id="sg1">
      <div class="sidebar-group-title" onclick="document.getElementById('sg1').classList.toggle('open')">
        三方API管理 <span class="arrow">›</span>
      </div>
      <div class="sidebar-children">
        <a href="claude.html"  class="sidebar-item">API调用</a>
        <a href="apply.html"   class="sidebar-item">API申请&审核</a>
        <a href="keys.html"    class="sidebar-item active">密钥管理</a>
        <a href="stats.html"   class="sidebar-item">使用统计</a>
        <a href="users.html"   class="sidebar-item" id="usersLink" style="display:none">用户管理</a>
      </div>
    </div>
  </div>

  <div class="main">
<!-- 面包屑 -->
<div class="breadcrumb">
  <button class="sidebar-toggle" id="sidebarToggle">☰</button><span class="brand">数据平台</span>
  <span class="sep">›</span>
  <a href="#">三方API管理</a>
  <span class="sep">›</span>
  <span class="current">密钥管理</span>
  <div class="breadcrumb-right" id="userBar"></div>
</div>

    <!-- 管理员：显示完整密钥管理 -->
    <div id="adminSection" style="display:none">
      <div class="toolbar">
        <span class="page-title" style="margin:0">密钥管理</span>
        <button class="btn btn-primary" id="addConfigBtn">+ 新增配置</button>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>名称</th><th>供应商</th><th>密钥</th><th>可用模型</th><th>管理员</th><th>状态</th><th>创建时间</th><th>操作</th></tr>
            </thead>
            <tbody id="adminTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 子账号管理面板（管理员点击展开） -->
    <div id="subAccountPanel" style="display:none;margin-top:20px">
      <div class="toolbar">
        <span style="font-size:1rem;font-weight:600" id="subPanelTitle">子账号管理</span>
        <button class="btn btn-primary" id="addSubBtn">+ 新增子账号</button>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>名称</th><th>描述</th><th>可用模型</th><th>额度类型</th><th>额度</th><th>IP限制</th><th>状态</th><th>创建时间</th><th>操作</th></tr>
            </thead>
            <tbody id="subTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 普通用户：显示已授权列表 -->
    <div id="userSection" style="display:none">
      <p class="page-title">密钥管理</p>
      <div class="card" style="margin-bottom:16px;color:var(--text-muted);font-size:.9rem;line-height:1.8">
        密钥由管理员统一管理。如需申请新 API 访问权限，请前往
        <a href="apply.html" style="color:var(--green)">API申请&审核</a>。
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>名称</th><th>供应商</th><th>子账号</th><th>可用模型</th><th>额度</th><th>IP限制</th><th>状态</th><th>创建时间</th></tr>
            </thead>
            <tbody id="userTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 子账号新增/编辑弹窗 -->
<div class="modal-bg" id="subModalBg">
  <div class="modal">
    <h3 id="subModalTitle">新增子账号</h3>
    <div class="form-group"><label>名称</label><input id="sfName" placeholder="如 项目A账号"></div>
    <div class="form-group"><label>描述</label><input id="sfDesc" placeholder="可选说明"></div>
    <div class="form-group">
      <label>可用模型 <span style="color:var(--text-muted);font-weight:400">（逗号分隔，留空则继承父配置）</span></label>
      <input id="sfModels" placeholder="claude-sonnet-4-6,claude-haiku-4-5-20251001">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group" style="margin:0">
        <label>额度类型</label>
        <select id="sfQuotaType">
          <option value="unlimited">无限额度</option>
          <option value="amount">金额限制</option>
        </select>
      </div>
      <div class="form-group" style="margin:0" id="sfQuotaAmountGroup">
        <label>额度金额（元）</label>
        <input id="sfQuotaAmount" type="number" placeholder="0" min="0" step="0.01">
      </div>
    </div>
    <div class="form-group" style="margin-top:12px">
      <label>IP 限制 <span style="color:var(--text-muted);font-weight:400">（可选，逗号分隔，留空不限制）</span></label>
      <input id="sfIp" placeholder="192.168.1.1,10.0.0.0/24">
    </div>
    <p style="color:#dc2626;font-size:.83rem;min-height:18px" id="subModalError"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="subCancelBtn">取消</button>
      <button class="btn btn-primary"   id="subSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 新增/编辑弹窗（管理员） -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">新增配置</h3>
    <div class="form-group"><label>名称</label><input id="fName" placeholder="如 Claude API"></div>
    <div class="form-group"><label>管理员</label><input id="fManager" placeholder="负责管理员姓名"></div>
    <div class="form-group"><label>供应商</label><input id="fProvider" placeholder="如 anthropic"></div>
    <div class="form-group"><label>Base URL</label><input id="fBaseUrl" placeholder="https://api.anthropic.com/v1"></div>
    <div class="form-group"><label>API Key</label><input id="fApiKey" type="password" placeholder="sk-ant-...（编辑时留空则不修改）"></div>
    <div class="form-group">
      <label>可用模型 <span style="color:var(--text-muted);font-weight:400">（多个用逗号分隔）</span></label>
      <textarea id="fModels" rows="2" placeholder="claude-sonnet-4-6,claude-haiku-4-5-20251001"></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group" style="margin:0">
        <label>Input 价格 <span style="color:var(--text-muted);font-weight:400">（元/千token）</span></label>
        <input id="fPriceInput" type="number" placeholder="0" min="0" step="0.0001">
      </div>
      <div class="form-group" style="margin:0">
        <label>Output 价格 <span style="color:var(--text-muted);font-weight:400">（元/千token）</span></label>
        <input id="fPriceOutput" type="number" placeholder="0" min="0" step="0.0001">
      </div>
    </div>
    <p style="color:#dc2626;font-size:.83rem;min-height:18px;margin-top:8px" id="modalError"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelBtn">取消</button>
      <button class="btn btn-primary"   id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script type="module">
import { initSidebar } from '../assets/js/sidebar.js';
import { requireLogin, getUser, refreshUser, authHeaders, logout } from '../assets/js/auth.js';
if (!requireLogin()) throw new Error('redirect');
initSidebar();

const user    = await refreshUser();
const isAdmin = user.role === 'admin';
if (!isAdmin) { window.location.href = '/pages/claude.html'; throw new Error('no access'); }

const ADMIN_HEADERS = { 'Content-Type': 'application/json', 'X-Admin-Password': 'admin123' };

document.getElementById('userBar').innerHTML = `
  <span class="username">${user.username}（管理员）</span>
  <button class="logout" id="logoutBtn">退出</button>`;
document.getElementById('logoutBtn').addEventListener('click', () => logout());
const l = document.getElementById('usersLink'); if (l) l.style.display = 'block';

if (isAdmin) {
  document.getElementById('adminSection').style.display = 'block';
  loadAdminConfigs();
} else {
  document.getElementById('userSection').style.display = 'block';
  loadUserKeys();
}

// ── 管理员：密钥管理 ──────────────────────────────────────
let editingId = null;
let allConfigs = [];

async function loadAdminConfigs() {
  const res = await fetch('http://localhost:8000/admin/configs', { headers: ADMIN_HEADERS });
  allConfigs = await res.json().catch(() => []);
  const tbody = document.getElementById('adminTbody');
  if (!allConfigs.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:32px">暂无配置</td></tr>';
    return;
  }
  tbody.innerHTML = '';
  allConfigs.forEach(c => {
    const models = c.models ? c.models.split(',').filter(Boolean).join('、') : '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${c.name}</strong></td>
      <td>${c.provider}</td>
      <td><code style="font-size:.82rem">${c.api_key}</code></td>
      <td style="font-size:.82rem;color:var(--text-muted)">${models}</td>
      <td>${c.manager || '—'}</td>
      <td><span class="badge ${c.is_active ? 'badge-green' : 'badge-gray'}">${c.is_active ? '启用' : '禁用'}</span></td>
      <td>${c.created_at.slice(0,10)}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-secondary" style="padding:4px 10px;font-size:.8rem" data-edit="${c.id}">编辑</button>
        <button class="btn btn-secondary" style="padding:4px 10px;font-size:.8rem;color:var(--green)" data-sub="${c.id}" data-name="${c.name}">子账号</button>
        <button class="btn btn-danger"    style="padding:4px 10px;font-size:.8rem" data-del="${c.id}">删除</button>
      </td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(allConfigs.find(x => x.id == b.dataset.edit))));
  tbody.querySelectorAll('[data-del]').forEach(b  => b.addEventListener('click', () => confirmDel(b.dataset.del)));
  tbody.querySelectorAll('[data-sub]').forEach(b  => b.addEventListener('click', () => openSubPanel(b.dataset.sub, b.dataset.name)));
}

// ── 子账号管理 ─────────────────────────────────────────────
let currentConfigId = null;
let editingSubId = null;

async function openSubPanel(configId, configName) {
  currentConfigId = configId;
  document.getElementById('subPanelTitle').textContent = `子账号管理 — ${configName}`;
  document.getElementById('subAccountPanel').style.display = 'block';
  document.getElementById('subAccountPanel').scrollIntoView({ behavior: 'smooth' });
  loadSubAccounts();
}

async function loadSubAccounts() {
  const res = await fetch(`http://localhost:8000/admin/configs/${currentConfigId}/sub-accounts`, { headers: ADMIN_HEADERS });
  const list = await res.json().catch(() => []);
  const tbody = document.getElementById('subTbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:24px">暂无子账号</td></tr>';
    return;
  }
  tbody.innerHTML = '';
  list.forEach(s => {
    const quota = s.quota_type === 'unlimited' ? '无限' : `¥${s.quota_amount}`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${s.name}</strong></td>
      <td style="color:var(--text-muted)">${s.description||'—'}</td>
      <td style="font-size:.82rem">${s.available_models||'继承父配置'}</td>
      <td><span class="badge ${s.quota_type==='unlimited'?'badge-green':'badge-yellow'}">${s.quota_type==='unlimited'?'无限':'金额'}</span></td>
      <td>${quota}</td>
      <td style="font-size:.82rem;color:var(--text-muted)">${s.ip_restriction||'不限制'}</td>
      <td><span class="badge ${s.is_active?'badge-green':'badge-gray'}">${s.is_active?'启用':'禁用'}</span></td>
      <td>${s.created_at.slice(0,10)}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-secondary" style="padding:4px 10px;font-size:.8rem" data-sub-edit="${s.id}">编辑</button>
        <button class="btn btn-danger"    style="padding:4px 10px;font-size:.8rem" data-sub-del="${s.id}">删除</button>
      </td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('[data-sub-edit]').forEach(b => b.addEventListener('click', () => openSubEdit(list.find(x=>x.id==b.dataset.subEdit))));
  tbody.querySelectorAll('[data-sub-del]').forEach(b  => b.addEventListener('click', () => confirmSubDel(b.dataset.subDel)));
}

document.getElementById('addSubBtn').addEventListener('click', () => {
  editingSubId = null;
  document.getElementById('subModalTitle').textContent = '新增子账号';
  ['sfName','sfDesc','sfModels','sfIp'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('sfQuotaType').value = 'unlimited';
  document.getElementById('sfQuotaAmount').value = '0';
  document.getElementById('subModalError').textContent = '';
  document.getElementById('subModalBg').classList.add('open');
});

document.getElementById('sfQuotaType').addEventListener('change', e => {
  document.getElementById('sfQuotaAmountGroup').style.opacity = e.target.value === 'unlimited' ? '0.4' : '1';
});

document.getElementById('subCancelBtn').addEventListener('click', () => document.getElementById('subModalBg').classList.remove('open'));

function openSubEdit(s) {
  editingSubId = s.id;
  document.getElementById('subModalTitle').textContent = '编辑子账号';
  document.getElementById('sfName').value = s.name;
  document.getElementById('sfDesc').value = s.description||'';
  document.getElementById('sfModels').value = s.available_models||'';
  document.getElementById('sfQuotaType').value = s.quota_type||'unlimited';
  document.getElementById('sfQuotaAmount').value = s.quota_amount||0;
  document.getElementById('sfIp').value = s.ip_restriction||'';
  document.getElementById('subModalError').textContent = '';
  document.getElementById('subModalBg').classList.add('open');
}

document.getElementById('subSaveBtn').addEventListener('click', async () => {
  const err = document.getElementById('subModalError');
  const name = document.getElementById('sfName').value.trim();
  if (!name) { err.textContent = '名称不能为空'; return; }
  const body = {
    name, description: document.getElementById('sfDesc').value.trim(),
    available_models: document.getElementById('sfModels').value.trim(),
    quota_type: document.getElementById('sfQuotaType').value,
    quota_amount: parseFloat(document.getElementById('sfQuotaAmount').value)||0,
    ip_restriction: document.getElementById('sfIp').value.trim(),
    is_active: 1,
  };
  try {
    if (editingSubId)
      await fetch(`http://localhost:8000/admin/sub-accounts/${editingSubId}`, { method:'PUT', headers:ADMIN_HEADERS, body:JSON.stringify(body) });
    else
      await fetch(`http://localhost:8000/admin/configs/${currentConfigId}/sub-accounts`, { method:'POST', headers:ADMIN_HEADERS, body:JSON.stringify(body) });
    document.getElementById('subModalBg').classList.remove('open');
    loadSubAccounts();
  } catch(e) { err.textContent = '保存失败'; }
});

async function confirmSubDel(id) {
  if (!confirm('确定删除此子账号？')) return;
  await fetch(`http://localhost:8000/admin/sub-accounts/${id}`, { method:'DELETE', headers:ADMIN_HEADERS });
  loadSubAccounts();
}

document.getElementById('addConfigBtn').addEventListener('click', () => {
  editingId = null;
  document.getElementById('modalTitle').textContent = '新增配置';
  ['fName','fManager','fProvider','fBaseUrl','fApiKey','fModels','fPriceInput','fPriceOutput'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('modalError').textContent = '';
  document.getElementById('modalBg').classList.add('open');
});

document.getElementById('cancelBtn').addEventListener('click', () => document.getElementById('modalBg').classList.remove('open'));

function openEdit(c) {
  editingId = c.id;
  document.getElementById('modalTitle').textContent = '编辑配置';
  document.getElementById('fName').value     = c.name;
  document.getElementById('fManager').value  = c.manager || '';
  document.getElementById('fProvider').value = c.provider;
  document.getElementById('fBaseUrl').value  = c.base_url;
  document.getElementById('fApiKey').value   = '';
  document.getElementById('fModels').value        = c.models || '';
  document.getElementById('fPriceInput').value    = c.price_input || 0;
  document.getElementById('fPriceOutput').value   = c.price_output || 0;
  document.getElementById('modalError').textContent = '';
  document.getElementById('modalBg').classList.add('open');
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const err      = document.getElementById('modalError');
  const name     = document.getElementById('fName').value.trim();
  const provider = document.getElementById('fProvider').value.trim();
  const base_url = document.getElementById('fBaseUrl').value.trim();
  const api_key  = document.getElementById('fApiKey').value.trim();
  const models   = document.getElementById('fModels').value.trim();
  if (!name || !provider || !base_url) { err.textContent = '名称、供应商、Base URL 不能为空'; return; }
  if (!editingId && !api_key) { err.textContent = 'API Key 不能为空'; return; }
  const body = {
    name, provider, base_url, api_key: api_key || '(unchanged)', models, is_active: 1,
    manager: document.getElementById('fManager').value.trim(),
    price_input:  parseFloat(document.getElementById('fPriceInput').value)  || 0,
    price_output: parseFloat(document.getElementById('fPriceOutput').value) || 0,
  };
  try {
    if (editingId)
      await fetch(`http://localhost:8000/admin/configs/${editingId}`, { method:'PUT', headers:ADMIN_HEADERS, body:JSON.stringify(body) });
    else
      await fetch('http://localhost:8000/admin/configs', { method:'POST', headers:ADMIN_HEADERS, body:JSON.stringify(body) });
    document.getElementById('modalBg').classList.remove('open');
    loadAdminConfigs();
  } catch(e) { err.textContent = '保存失败'; }
});

async function confirmDel(id) {
  if (!confirm('确定删除此配置及所有关联统计记录？')) return;
  await fetch(`http://localhost:8000/admin/configs/${id}`, { method:'DELETE', headers:ADMIN_HEADERS });
  loadAdminConfigs();
}

// ── 普通用户：已授权密钥 ──────────────────────────────────
async function loadUserKeys() {
  const res = await fetch('http://localhost:8000/api-requests/approved', { headers: authHeaders() });
  const list = await res.json().catch(() => []);
  const tbody = document.getElementById('userTbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:32px">暂无已授权的密钥，请先<a href="apply.html" style="color:var(--green);margin:0 4px">提交申请</a></td></tr>';
    return;
  }
  tbody.innerHTML = list.map(c => {
    const subName    = c.sub_account_name || '—';
    const subModels  = c.sub_models ? c.sub_models.split(',').filter(Boolean).join('、') : (c.name ? '继承父配置' : '—');
    const quota      = c.quota_type === 'unlimited' ? '无限' : (c.quota_type === 'amount' ? `¥${c.quota_amount}` : '—');
    const ip         = c.ip_restriction || '不限制';
    return `<tr>
      <td><strong>${c.name}</strong></td>
      <td>${c.provider}</td>
      <td><span class="badge ${c.sub_account_id ? 'badge-green' : 'badge-gray'}">${subName}</span></td>
      <td style="font-size:.82rem;color:var(--text-muted)">${subModels}</td>
      <td style="font-size:.82rem">${quota}</td>
      <td style="font-size:.82rem;color:var(--text-muted)">${ip}</td>
      <td><span class="badge badge-green">已启用</span></td>
      <td>${c.created_at ? c.created_at.slice(0,10) : '—'}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
