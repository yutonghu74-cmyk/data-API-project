<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 — 数据平台</title>
  <link rel="stylesheet" href="../assets/css/platform.css">
</head>
<body>
<!-- 面包屑 -->
<div class="breadcrumb">
  <span class="brand">数据平台</span>
  <span class="sep">›</span>
  <a href="#">三方API管理</a>
  <span class="sep">›</span>
  <span class="current">用户管理</span>
  <div class="breadcrumb-right" id="userBar"></div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-group open" id="sg1">
      <div class="sidebar-group-title" onclick="document.getElementById('sg1').classList.toggle('open')">
        三方API管理 <span class="arrow">›</span>
      </div>
      <div class="sidebar-children">
        <a href="claude.html"  class="sidebar-item">API调用</a>
        <a href="apply.html"   class="sidebar-item">API申请&审核</a>
        <a href="keys.html"    class="sidebar-item">密钥管理</a>
        <a href="stats.html"   class="sidebar-item">使用统计</a>
        <a href="users.html"   class="sidebar-item active">用户管理</a>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <span class="page-title" style="margin:0">用户管理</span>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>用户名</th><th>角色</th><th>注册时间</th><th>操作</th></tr>
          </thead>
          <tbody id="userTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 重置密码弹窗 -->
<div class="modal-bg" id="pwdBg">
  <div class="modal">
    <h3>重置密码</h3>
    <p id="pwdUsername" style="font-size:.85rem;color:var(--text-muted);margin-bottom:16px"></p>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="newPwd" placeholder="至少6位">
    </div>
    <p style="color:#dc2626;font-size:.83rem;min-height:18px" id="pwdErr"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="pwdCancel">取消</button>
      <button class="btn btn-primary"   id="pwdSave">确认重置</button>
    </div>
  </div>
</div>

<script type="module">
import { requireLogin, getUser, refreshUser, authHeaders, logout } from '../assets/js/auth.js';
if (!requireLogin()) throw new Error('redirect');

const me = await refreshUser();
if (me.role !== 'admin') { window.location.href = '/pages/claude.html'; throw new Error('no access'); }

document.getElementById('userBar').innerHTML = `
  <span class="username">${me.username}（管理员）</span>
  <button class="logout" id="logoutBtn">退出</button>`;
document.getElementById('logoutBtn').addEventListener('click', () => logout());

const ADMIN_HEADERS = { 'Content-Type': 'application/json', 'X-Admin-Password': 'admin123' };
let resetUserId = null;
let allUsers = [];

async function loadUsers() {
  const res = await fetch('http://localhost:8000/admin/users', { headers: ADMIN_HEADERS });
  allUsers = await res.json().catch(() => []);
  const tbody = document.getElementById('userTbody');
  tbody.innerHTML = '';
  allUsers.forEach(u => {
    const isMe = u.id === me.id;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <strong>${u.username}</strong>
        ${isMe ? '<span style="font-size:.75rem;color:var(--text-muted);margin-left:6px">（当前账号）</span>' : ''}
      </td>
      <td>
        <span class="badge ${u.role === 'admin' ? 'badge-green' : 'badge-gray'}">
          ${u.role === 'admin' ? '管理员' : '普通用户'}
        </span>
      </td>
      <td>${u.created_at.slice(0, 10)}</td>
      <td style="white-space:nowrap">
        ${!isMe ? `
          <button class="btn btn-secondary" style="padding:4px 10px;font-size:.8rem"
            data-role="${u.id}" data-current="${u.role}">
            ${u.role === 'admin' ? '设为普通用户' : '设为管理员'}
          </button>
          <button class="btn btn-secondary" style="padding:4px 10px;font-size:.8rem" data-reset="${u.id}" data-name="${u.username}">
            重置密码
          </button>
          <button class="btn btn-danger" style="padding:4px 10px;font-size:.8rem" data-del="${u.id}">
            删除
          </button>
        ` : '<span style="color:var(--text-muted);font-size:.82rem">—</span>'}
      </td>`;
    tbody.appendChild(tr);
  });

  // 切换角色
  tbody.querySelectorAll('[data-role]').forEach(b => {
    b.addEventListener('click', async () => {
      const newRole = b.dataset.current === 'admin' ? 'user' : 'admin';
      const name = allUsers.find(u => u.id == b.dataset.role)?.username;
      if (!confirm(`确定将 "${name}" 设为${newRole === 'admin' ? '管理员' : '普通用户'}？`)) return;
      const res = await fetch(`http://localhost:8000/admin/users/${b.dataset.role}/role`, {
        method: 'PUT', headers: ADMIN_HEADERS,
        body: JSON.stringify({ role: newRole }),
      });
      if (!res.ok) { const d = await res.json(); alert(d.detail); return; }
      loadUsers();
    });
  });

  // 重置密码
  tbody.querySelectorAll('[data-reset]').forEach(b => {
    b.addEventListener('click', () => {
      resetUserId = b.dataset.reset;
      document.getElementById('pwdUsername').textContent = `用户：${b.dataset.name}`;
      document.getElementById('newPwd').value = '';
      document.getElementById('pwdErr').textContent = '';
      document.getElementById('pwdBg').classList.add('open');
    });
  });

  // 删除用户
  tbody.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', async () => {
      const name = allUsers.find(u => u.id == b.dataset.del)?.username;
      if (!confirm(`确定删除用户 "${name}"？此操作不可恢复。`)) return;
      const res = await fetch(`http://localhost:8000/admin/users/${b.dataset.del}`, {
        method: 'DELETE', headers: ADMIN_HEADERS,
      });
      if (!res.ok) { const d = await res.json(); alert(d.detail); return; }
      loadUsers();
    });
  });
}

document.getElementById('pwdCancel').addEventListener('click', () => document.getElementById('pwdBg').classList.remove('open'));

document.getElementById('pwdSave').addEventListener('click', async () => {
  const pwd = document.getElementById('newPwd').value;
  const err = document.getElementById('pwdErr');
  if (pwd.length < 6) { err.textContent = '密码至少6位'; return; }
  const res = await fetch(`http://localhost:8000/admin/users/${resetUserId}/password`, {
    method: 'PUT', headers: ADMIN_HEADERS,
    body: JSON.stringify({ password: pwd }),
  });
  if (!res.ok) { const d = await res.json(); err.textContent = d.detail; return; }
  document.getElementById('pwdBg').classList.remove('open');
  alert('密码重置成功');
});

loadUsers();
</script>
</body>
</html>
